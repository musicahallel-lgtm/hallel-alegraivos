// ── Tom preferido de cada vocalista (por música) ──
function _vocalistas() {
    const vk = ['vocal1','vocal2','vocal3','animador'];
    return S.members.filter(m => {
        if (m.status==='rejected') return false;
        const instrs = m.instruments || (m.instrument?[m.instrument]:[]);
        return instrs.some(i => vk.includes(i));
    });
}
function tonsVocalistasHtml(song) {
    const vocs = _vocalistas();
    const tons = song.tonsVocalistas || {};
    const comTom = Object.entries(tons).filter(([,v])=>v);
    // Membros não-adm só veem (sem editar). Se não houver vocalistas nem tons, esconde.
    if (!isAdm() && !comTom.length) return '';
    if (isAdm()) {
        if (!vocs.length) return '';
        return `<div class="dsec" style="margin-top:14px">
            <div class="dsec-title">🎤 Tom por vocalista</div>
            <div style="display:flex;flex-direction:column;gap:7px">
                ${vocs.map(m=>{
                    const cur = tons[m.name] || '';
                    return `<div style="display:flex;align-items:center;gap:8px">
                        <span style="flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(m.name)}</span>
                        <select onchange="saveTomVocalista('${song.id}','${escHtml(m.name).replace(/'/g,"\\'")}',this.value)" style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:13px;font-weight:700">
                            <option value="">—</option>
                            ${KEYS.map(k=>`<option value="${k}" ${cur===k?'selected':''}>${k}</option>`).join('')}
                        </select>
                    </div>`;
                }).join('')}
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:8px">💡 Marque o tom em que cada vocalista canta melhor — agiliza montar a escala.</div>
        </div>`;
    }
    // Visão membro/geral (somente leitura)
    return `<div class="dsec" style="margin-top:14px">
        <div class="dsec-title">🎤 Tom por vocalista</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${comTom.map(([nome,tom])=>`<span style="background:rgba(0,150,63,.12);border:1px solid rgba(0,150,63,.25);border-radius:8px;padding:3px 9px;font-size:12px"><b>${escHtml(nome)}</b>: <span style="color:#4ade80;font-weight:800">${tom}</span></span>`).join('')}
        </div>
    </div>`;
}
function saveTomVocalista(songId, nome, tom) {
    const s = S.songs.find(x=>x.id===songId); if(!s) return;
    if (!s.tonsVocalistas) s.tonsVocalistas = {};
    if (tom) s.tonsVocalistas[nome] = tom; else delete s.tonsVocalistas[nome];
    persist();
    toast(tom?`🎤 ${nome}: tom ${tom}`:'Tom removido.');
}

function slCard(sl) {
    const allIds = (sl.blocks||[]).flatMap(b=>b.songIds||[]);

    const blockCount = (sl.blocks||[]).length;
    return `<div class="setlist-card" onclick="openSL('${sl.id}')">
        <div class="setlist-name">${sl.name}</div>
        ${sl.date?`<div class="setlist-date">📅 ${sl.date}</div>`:''}
        <div class="setlist-count">🎵 ${songs.length} música${songs.length!==1?'s':''} · ${blockCount} bloco${blockCount!==1?'s':''}</div>
        ${songs.length>0?`<div class="setlist-preview">${songs.slice(0,3).map(s=>`<div>· ${s.title}</div>`).join('')}${songs.length>3?`<div style="color:var(--purple-light)">+${songs.length-3} mais…</div>`:''}</div>`:''}
    </div>`;
}

function addModal(v) {
    v = v || {};
    const isEdit = !!v.id;
    const hasPdf = isEdit && S.hasPdf.has(v.id);
    const pf = S.pendingPdfFile;
    const removing = S.pendingPdfRemove;

    let pdfSection = '';
    if (removing) {

function nav(p)  { S.page=p; render(); if (p==='inicio') _checkLembretesEnsaio(); }

// ── Lembrete automático de ensaio (véspera + dia) para quem confirmou ──
function _checkLembretesEnsaio() {
    if (!S.currentMember) return;
    const nome = S.currentMember.name;
    (S.ensaios||[]).forEach(e => {
        const conf = (e.confirmacoes||{})[nome];
        if (conf !== 'sim') return;            // só lembra quem confirmou presença
        const dias = _ensaioDias(e.data);
        let fase = null;
        if (dias === 1) fase = 'vespera';
        else if (dias === 0) fase = 'dia';
        if (!fase) return;
        const chave = 'hl_lemb_' + e.id + '_' + fase;
        if (localStorage.getItem(chave)) return;
        localStorage.setItem(chave, '1');
        const [yy,mm,dd] = e.data.split('-');
        const quando = fase==='dia' ? 'É HOJE' : 'é amanhã';
        const corpo = `${quando}${e.hora?' às '+e.hora:''}${e.local?' — '+e.local:''}`;
        toast(`🎼 Lembrete: ensaio ${quando.toLowerCase()}!`);
        if (('Notification' in window) && Notification.permission==='granted') {
            _mostrarNotificacao(`Ensaio ${fase==='dia'?'hoje':'amanhã'}`, corpo);
        }
    });
}
function doSearch(v)    { S.q=v;        render(); }
function doFilterKey(v) { S.filterKey=v; render(); }
function doFilterMomento(v) { S.filterMomento=v; render(); }
function toggleFavFilter() { S.favOnly=!S.favOnly; render(); }

function closeModal(e) {
    if (e && e.target!==e.currentTarget) return;
    stopActTimer();
    if (S.currentPdfUrl) { URL.revokeObjectURL(S.currentPdfUrl); S.currentPdfUrl=null; }
    // Se fechou o form de aprovação sem salvar, reverte o pedido para 'pending'
    if (S.modal?.type === 'member-form' && S.modal?.data?._fromRqId) {
        const rq = S.accessRequests.find(r=>r.id===S.modal.data._fromRqId);
        if (rq && rq.status === 'approving') { rq.status = 'pending'; persist(); }
    }
    S.modal=null; S.transpose=0; S.ptab='youtube'; S.cifraTab='texto';
    S.pendingPdfFile=null; S.pendingPdfRemove=false;
    // Aplica snapshot que ficou aguardando durante o modal
    if (_pendingSnap && !_localDirty) {
        _aplicaDados(_pendingSnap);
        _pendingSnap = null;
    }
    render();
}

// Songs
async function openDetail(id) {
    const s=S.songs.find(x=>x.id===id); if (!s) return;
    S.transpose=0;
    const hasPdf = S.hasPdf.has(id);
    S.cifraTab = hasPdf ? 'pdf' : 'texto';
    S.ptab = ytId(s.youtubeUrl)?'youtube': spId(s.spotifyUrl)?'spotify': dzId(s.deezerUrl)?'deezer':'youtube';
    // Load PDF from IDB
    if (S.currentPdfUrl) { URL.revokeObjectURL(S.currentPdfUrl); S.currentPdfUrl=null; }
    if (hasPdf) {
        const rec = await dbGetPDF(id);
        if (rec) {
            const blob = new Blob([rec.buf], {type:'application/pdf'});
            S.currentPdfUrl = URL.createObjectURL(blob);
        }
    }
    S.modal={type:'detail',data:s}; render();
    maybeInitMixer(s);
}

function openAdd() {
    S.pendingPdfFile=null; S.pendingPdfRemove=false;
    S.modal={type:'add',data:null}; render();
}
function openEdit(id) {
    const s=S.songs.find(x=>x.id===id); if(!s)return;
    S.pendingPdfFile=null; S.pendingPdfRemove=false;
    S.modal={type:'add',data:{...s}}; render();
}

async function saveSong(eid) {
    const title=document.getElementById('f_title')?.value?.trim();
    if (!title) { toast('⚠️ Título é obrigatório!'); return; }
    const d = {
        id: eid||uid(), title,
        artist:      document.getElementById('f_artist')?.value?.trim()||'',
        vozPrincipal:document.getElementById('f_voz')?.value?.trim()||'',
        key:      document.getElementById('f_key')?.value||'',
        bpm:      parseInt(document.getElementById('f_bpm')?.value)||0,
        category: document.getElementById('f_cat')?.value?.trim()||'',
        youtubeUrl: document.getElementById('f_yt')?.value?.trim()||'',
        spotifyUrl: document.getElementById('f_sp')?.value?.trim()||'',
        deezerUrl:  document.getElementById('f_dz')?.value?.trim()||'',
        moisesUrl:  document.getElementById('f_mo')?.value?.trim()||'',
        reaperUrl:  document.getElementById('f_rp')?.value?.trim()||'',
        bandUrl:    document.getElementById('f_bd')?.value?.trim()||'',
        momento:  document.getElementById('f_momento')?.value||'',
        chords:  document.getElementById('f_ch')?.value||'',
        notes:   document.getElementById('f_nt')?.value?.trim()||'',
    };

    // Handle PDF
    if (S.pendingPdfFile) {
        await dbSavePDF(d.id, S.pendingPdfFile);
        S.hasPdf.add(d.id);
        toast('✅ Música e PDF salvos!');
    } else if (S.pendingPdfRemove) {
        await dbDeletePDF(d.id);
        S.hasPdf.delete(d.id);
        toast('✅ Música salva (PDF removido).');
    } else {
        toast(eid ? '✅ Música atualizada!' : '✅ Música adicionada!');
    }

    if (eid) {
        const i=S.songs.findIndex(s=>s.id===eid);
        if(i!==-1) {
            // preserva campos extras não presentes no formulário (stemsPath, bpm de stem, etc.)
            S.songs[i]={...S.songs[i], ...d};
        }
    } else { S.songs.push(d); }

    persist();
    S.modal=null; S.pendingPdfFile=null; S.pendingPdfRemove=false;
    render();
}

function saveBlockVoz(slId, blockId, songId, val) {
    const sl = S.setlists.find(x=>x.id===slId); if(!sl) return;
    const block = sl.blocks?.find(b=>b.id===blockId); if(!block) return;
    if (!block.vozes) block.vozes = {};
    block.vozes[songId] = val.trim();
    if (S.modal?.data?.id === slId) S.modal.data = sl;
    persist();
}

function saveSlEscalado(slId, key, val) {
    const sl = S.setlists.find(s=>s.id===slId); if(!sl) return;
    if (!sl.escalados) sl.escalados = {};
    sl.escalados[key] = val.trim();
    if (S.modal?.data?.id === slId) S.modal.data.escalados = sl.escalados;
    persist();
}

async function delSong(id) {
    const song = S.songs.find(s=>s.id===id);
    if (!confirm('Excluir esta música?\n\n(Fica na Lixeira por 30 dias — dá para recuperar)')) return;
    S.songs = S.songs.filter(s=>s.id!==id);
    S.setlists.forEach(sl=>{
        (sl.blocks||[]).forEach(b=>{ b.songIds=b.songIds.filter(x=>x!==id); });
    });
    if (S.hasPdf.has(id)) { await dbDeletePDF(id); S.hasPdf.delete(id); }
    // Guarda na lixeira (recuperável por 30 dias)
    if (song) S.lixeira.push({ id:'lx'+uid(), tipo:'musica', item:song, excluidoEm:Date.now(),
        excluidoPor: S.currentMember?.name || 'ADM' });
    _limpaLixeiraAntiga();
    // Registra como excluída intencionalmente (evita que o merge restaure)
    const del = JSON.parse(localStorage.getItem('hl_deleted_songs')||'[]');
    if (!del.includes(id)) { del.push(id); localStorage.setItem('hl_deleted_songs', JSON.stringify(del.slice(-200))); }
    persist(); S.modal=null; toast('🗑 Música movida para a Lixeira.'); render();
}

// ── Restaurar / esvaziar lixeira ──
function restaurarLixeira(idx) {
    const item = S.lixeira[idx]; if (!item) return;
    if (item.tipo === 'membro') {
        if (!S.members.find(m=>m.id===item.item.id)) S.members.push(item.item);
        _rmTomb('members', item.item.id);  // tira da lista de excluídos ao restaurar
    } else if (item.tipo === 'musica') {
        if (!S.songs.find(s=>s.id===item.item.id)) S.songs.push(item.item);
        _rmTomb('songs', item.item.id);    // remove do tombstone para não apagar de novo
    }
    if (item.id) _addTomb('lixeira', item.id);  // a ENTRADA da lixeira não volta no merge
    S.lixeira.splice(idx, 1);
    persist(); render();
    toast('♻️ Restaurado com sucesso!');
}
function excluirDaLixeira(idx) {
    if (!confirm('Excluir permanentemente? Esta ação não pode ser desfeita.')) return;
    const item = S.lixeira[idx];
    if (item && item.id) _addTomb('lixeira', item.id);  // não ressuscita no merge
    S.lixeira.splice(idx, 1);
    persist(); render();
    toast('Excluído permanentemente.');
}

// ── Drag-and-drop para set list ──
const _dg = {on:false, id:null, ghost:null, over:null};

function dgDown(e, songId) {
    // only start drag on real pointer/touch, not keyboard clicks
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    _dg.on = false; _dg.id = songId;
    const song = S.songs.find(s=>s.id===songId);
    _dg.ghost = document.createElement('div');
    _dg.ghost.className = 'drag-ghost';
    _dg.ghost.textContent = (song?.title||'?');
    document.body.appendChild(_dg.ghost);
    document.addEventListener('pointermove', dgMv, {passive:false});
    document.addEventListener('pointerup',   dgUp);
    document.addEventListener('pointercancel', dgUp);
    dgMv(e);
    e.preventDefault();
}
function dgMv(e) {
    if (!_dg.ghost) return;
    _dg.ghost.style.left = (e.clientX + 14) + 'px';
    _dg.ghost.style.top  = (e.clientY - 18) + 'px';
    _dg.on = true; // mark as real drag (moved)
    // find block under pointer
    const els = document.elementsFromPoint(e.clientX, e.clientY);
    const bd = els.find(el => el.dataset && el.dataset.blockId);
    if (_dg.over && _dg.over !== bd) _dg.over.classList.remove('drag-over');
    _dg.over = bd || null;
    if (bd) bd.classList.add('drag-over');
    // dim source item
    const src = document.querySelector('.avail-item.dg-lifting');
    if (!src) {
        const items = document.querySelectorAll('.avail-item');
        items.forEach(it => { if (it.dataset && it.getAttribute('onpointerdown')?.includes(_dg.id)) it.classList.add('dg-lifting'); });
    }
    e.preventDefault();
}
function dgUp(e) {
    document.removeEventListener('pointermove', dgMv);
    document.removeEventListener('pointerup',   dgUp);
    document.removeEventListener('pointercancel', dgUp);
    if (_dg.ghost) { _dg.ghost.remove(); _dg.ghost = null; }
    document.querySelectorAll('.avail-item.dg-lifting').forEach(el=>el.classList.remove('dg-lifting'));
    if (_dg.over) {
        _dg.over.classList.remove('drag-over');
        const blockId = _dg.over.dataset.blockId;
        const modal = document.querySelector('[data-sl-id]');
        const slId = modal?.dataset.slId;
        if (_dg.on && slId && blockId && _dg.id) {
            slAddToBlock(slId, _dg.id, blockId);
        }
        _dg.over = null;
    }
    _dg.on = false; _dg.id = null;
}

// Block-aware actions
function slAddToBlock(slId, songId, blockId) {
    const sl = S.setlists.find(x=>x.id===slId); if(!sl) return;
    const bid = blockId || S.slActiveBlock || sl.blocks?.[0]?.id;
    const block = sl.blocks?.find(b=>b.id===bid);
    if (!block) return;
    if (block.songIds.includes(songId)) return;
    block.songIds.push(songId);
    S.slActiveBlock = bid;
    persist(); S.modal={type:'sl',data:sl}; render();
}
function slDelFromBlock(slId, blockId, songId) {
    const sl = S.setlists.find(x=>x.id===slId); if(!sl) return;
    const block = sl.blocks?.find(b=>b.id===blockId); if(!block) return;
    block.songIds = block.songIds.filter(x=>x!==songId);
    persist(); S.modal={type:'sl',data:sl}; render();
}
function slMoveInBlock(slId, blockId, songId, dir) {
    const sl = S.setlists.find(x=>x.id===slId); if(!sl) return;
    const block = sl.blocks?.find(b=>b.id===blockId); if(!block) return;
    const i = block.songIds.indexOf(songId); if(i===-1) return;
    const j = i+dir; if(j<0||j>=block.songIds.length) return;
    [block.songIds[i],block.songIds[j]]=[block.songIds[j],block.songIds[i]];
    persist(); S.modal={type:'sl',data:sl}; render();
}
function slSetActive(slId, blockId) {
    S.slActiveBlock = blockId;
    const sl = S.setlists.find(x=>x.id===slId); if(!sl) return;
    S.modal={type:'sl',data:sl}; render();
}
function slAddBlock(slId) {
    const sl = S.setlists.find(x=>x.id===slId); if(!sl) return;
    const name = prompt('Nome do bloco:'); if(!name?.trim()) return;
    sl.blocks = sl.blocks||[];
    sl.blocks.push({id:'b'+uid(), name:name.trim(), songIds:[]});
    persist(); S.modal={type:'sl',data:sl}; render();
}
function slRenameBlock(slId, blockId) {
    const sl = S.setlists.find(x=>x.id===slId); if(!sl) return;
    const block = sl.blocks?.find(b=>b.id===blockId); if(!block) return;
    const name = prompt('Novo nome:', block.name); if(!name?.trim()) return;
    block.name = name.trim();
    persist(); S.modal={type:'sl',data:sl}; render();
}
function slDelBlock(slId, blockId) {
    const sl = S.setlists.find(x=>x.id===slId); if(!sl) return;
    if (!confirm('Excluir este bloco e suas músicas?')) return;
    sl.blocks = sl.blocks.filter(b=>b.id!==blockId);
    persist(); S.modal={type:'sl',data:sl}; render();
}

const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_PT  = ['D','S','T','Q','Q','S','S'];

function evDaysUntil(ev) {
    const today = new Date(); today.setHours(0,0,0,0);
    const start = new Date(ev.start + 'T00:00:00');
    return Math.round((start - today) / 86400000);
}

function evDateLabel(ev) {
    const s = ev.start.split('-'); const e = ev.end.split('-');
    const ds = parseInt(s[2]), ms = parseInt(s[1]);
    const de = parseInt(e[2]), me = parseInt(e[1]);
    if (ev.start === ev.end) return `${ds}/${ms < 10 ? '0'+ms : ms}`;
    if (ms === me) return `${ds}–${de}/${ms < 10 ? '0'+ms : ms}`;
    return `${ds}/${ms < 10?'0'+ms:ms}–${de}/${me < 10?'0'+me:me}`;
}

let _actTimer = null; // { type, songId, songTitle, tab, startAt }

function trackActivity(type, data = {}) {
    // Rastreia QUALQUER membro logado — incluindo os que são ADM
    // (antes só rastreava perfil 'membro', perdendo Rodrigo/Milene/Luciana que são ADM)
    if (!S.currentMember) return;
    const entry = { id: uid(), memberId: S.currentMember.id,
        memberName: S.currentMember.name, type, at: Date.now(), duration: 0, ...data };
    S.activityLog.push(entry);
    if (S.activityLog.length > 500) S.activityLog = S.activityLog.slice(-500);
    persist(); // debounced
}

function startActTimer(type, data = {}) {
    stopActTimer(); // save previous
    _actTimer = { type, ...data, startAt: Date.now() };
}

function stopActTimer() {
    if (!_actTimer) return;
    const duration = Math.round((Date.now() - _actTimer.startAt) / 1000);
    if (duration >= 3) trackActivity(_actTimer.type, { ..._actTimer, duration });
    _actTimer = null;
}

// ── Registro de SAÍDA do membro (entrada = 'login') ──────────────────
let _saidaRegistrada = false;   // evita registrar saída repetida na mesma sessão
let _lastLogoutAt    = 0;       // throttle: no máx. 1 saída a cada 3 min por sessão
function trackLogout(motivo) {
    if (!S.currentMember || _saidaRegistrada) return;
    // Trava anti-spam: trocar de aba/tela várias vezes não gera várias saídas
    if (Date.now() - _lastLogoutAt < 180000) { _saidaRegistrada = true; return; }
    _saidaRegistrada = true;
    _lastLogoutAt = Date.now();
    stopActTimer();
    S.activityLog.push({ id: uid(), memberId: S.currentMember.id,
        memberName: S.currentMember.name, type: 'logout', at: Date.now(), duration: 0, motivo: motivo||'' });
    if (S.activityLog.length > 500) S.activityLog = S.activityLog.slice(-500);
    persist(true); // imediato — tenta salvar antes de fechar
}
// Sai do app / fecha o app → registra saída. Só conta como saída quando fica
// escondido por mais de alguns segundos (evita contar troca rápida de aba).
let _hiddenTimer = null;
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        clearTimeout(_hiddenTimer);
        _hiddenTimer = setTimeout(() => trackLogout('background'), 8000); // só após 8s escondido
    } else {
        clearTimeout(_hiddenTimer);
        _saidaRegistrada = false; // voltou ao app: libera a próxima saída
    }
});
window.addEventListener('pagehide', () => trackLogout('fechou'));

function resumoMembrosHtml() {
    const mbs = S.members.filter(m => m.status !== 'rejected');

    // ── Resumo de camisas ──
    const ORDEM = ['PP','P','M','G','GG','XG','XGG'];

    const semCamisa = mbs.filter(m => !m.camisa).length;
    const chipsCamisa = ORDEM.filter(t=>camisas[t]).map(t =>
        `<span style="background:rgba(0,150,63,.15);border:1px solid rgba(0,150,63,.3);border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;color:#4ade80">${t}: ${camisas[t]}</span>`
    ).join('');

function participacaoHtml() {
    const mbs = S.members.filter(m => m.status !== 'rejected');
    if (mbs.length < 2) return '';
    // conta participações em escalas (total e futuras)
    const stats = mbs.map(m => {
        const all = getMemberEscalas(m.name);
        const futuras = all.filter(e => e.daysUntil >= 0).length;
        return { name: m.name, total: all.length, futuras };
    });
    const algumaEscala = stats.some(s => s.total > 0);
    if (!algumaEscala) return '';
    stats.sort((a,b) => b.total - a.total || b.futuras - a.futuras);
    const max = Math.max(1, ...stats.map(s => s.total));
    const top = stats.slice(0, 12);
    const corBarra = (n) => n===0 ? 'var(--border)' : 'linear-gradient(90deg,#00963F,#22c55e)';
    return `<details style="margin-bottom:20px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
        <summary style="cursor:pointer;padding:14px 16px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;user-select:none">
            📊 Participação nas escalas
            <span style="font-weight:400;color:var(--muted);font-size:12px">— quem está sendo mais/menos escalado</span>
        </summary>
        <div style="padding:4px 16px 16px">
            ${top.map(s => {
                const pct = Math.round(s.total / max * 100);
                return `<div style="margin-bottom:10px">
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:3px">
                        <span style="font-weight:600">${escHtml(s.name)}</span>
                        <span style="color:var(--muted);font-size:12px">${s.total} escala${s.total!==1?'s':''}${s.futuras?` · ${s.futuras} futura${s.futuras!==1?'s':''}`:''}</span>
                    </div>
                    <div style="height:8px;background:var(--bg4);border-radius:4px;overflow:hidden">
                        <div style="height:100%;width:${Math.max(pct,s.total?6:0)}%;background:${corBarra(s.total)};border-radius:4px;transition:width .3s"></div>
                    </div>
                </div>`;
            }).join('')}
            <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.4">💡 Ajuda a distribuir as escalas com justiça e a notar quem está participando pouco.</div>
        </div>
    </details>`;
}

function approveRequest(rqId) {
    const rq = S.accessRequests.find(r=>r.id===rqId); if(!rq) return;
    // Marca como "em aprovação" — NÃO remove ainda (só remove quando o membro for salvo)
    rq.status = 'approving';
    // Pre-fill member form com o rqId guardado para remover depois
    const newMember = {
        id: null, _fromRqId: rqId, _fromRqCloud: rq._cloud,
        name: rq.name, instrument: rq.instrument,
        instruments: rq.instruments||[rq.instrument],
        whatsapp: rq.whatsapp, email: rq.email,
        nascimento: rq.nascimento||'', camisa: rq.camisa||'',
        user: '', pass: ''
    };
    persist(); // salva status 'approving' — protege contra listener
    S.modal = { type:'member-form', data: newMember };
    render();
    toast(`✅ Aprovando ${rq.name} — defina usuário e senha.`);
}

function rejectRequest(rqId) {
    S.modal = { type:'recusar-solicitacao', data:{ rqId } };

function recusadasHtml(instrLabel2) {
    const recusadas = S.accessRequests.filter(r=>r.status==='rejected')
        .sort((a,b)=>(b.rejectedAt||b.at)-(a.rejectedAt||a.at));
    if (!recusadas.length) return '';
    const linhas = recusadas.map(r => {
        const instr = instrLabel2[r.instrument]||r.instrument||'—';
        const whats = r.whatsapp ? ' · '+r.whatsapp : '';
        const motivo = r.motivo ? '<div style="font-size:11px;color:#f87171;margin-top:3px;font-style:italic">Motivo: '+escHtml(r.motivo)+'</div>' : '';
        const data = r.rejectedAt ? new Date(r.rejectedAt).toLocaleDateString('pt-BR') : '—';
        return '<div style="background:var(--bg2);border:1px solid var(--border);border-left:4px solid #ef4444;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;opacity:.75">'

            + '</div>'
            + '<button class="btn btn-ghost btn-sm" onclick="limparRecusa(\''+r.id+'\')" style="font-size:11px;color:var(--muted)">'+ic('trash',12)+'</button>'
            + '</div></div>';
    }).join('');
    return '<div style="margin-top:20px">'
        + '<div style="font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Recusadas</div>'
        + linhas + '</div>';
}

function limparRecusa(rqId) {
    S.accessRequests = S.accessRequests.filter(r=>r.id!==rqId);
    persist(); render();
}
function confirmarRecusa(rqId) {
    const rq = S.accessRequests.find(r=>r.id===rqId); if(!rq) return;
    const motivo = document.getElementById('rj-motivo')?.value?.trim() || '';
    rq.status  = 'rejected';
    rq.motivo  = motivo;
    rq.rejectedAt = Date.now();
    if (rq._cloud) {
        // Mantém registro local da recusa antes de remover da nuvem
        const copia = { ...rq, _cloud: false };
        S.accessRequests = S.accessRequests.filter(r=>r.id!==rqId);
        S.accessRequests.push(copia);
        fbRemoverSolicitacao(rqId);
    }
    persist();
    S.modal = null;
    render();
    toast(`Solicitação de ${rq.name} recusada.`);
}

function saveMember(id) {
    const name   = document.getElementById('mf-name')?.value?.trim();
    const instrs = EV_INSTR.map(({k})=>k).filter(k=>document.getElementById('mf-ic-'+k)?.checked);
    const whats  = document.getElementById('mf-whats')?.value?.trim();
    const email  = document.getElementById('mf-email')?.value?.trim().toLowerCase();
    const nasc   = document.getElementById('mf-nasc')?.value || '';
    const camisa = document.getElementById('mf-camisa')?.value || '';
    const accessRole = document.getElementById('mf-role')?.value || 'membro';
    const user   = document.getElementById('mf-user')?.value?.trim().toLowerCase();
    const pass   = document.getElementById('mf-pass')?.value?.trim();
    const typeEl = document.querySelector('input[name="mf-type"]:checked');
    const memberType = typeEl ? typeEl.value : 'membro';
    if (!name||!user||!pass) { toast('⚠️ Preencha nome, usuário e senha.'); return; }
    if (!instrs.length) { toast('⚠️ Selecione pelo menos um instrumento.'); return; }
    const conflict = S.members.find(m => m.user===user && m.id!==id);
    if (conflict) { toast('⚠️ Esse nome de usuário já existe.'); return; }
    if (id) {
        const m = S.members.find(x=>x.id===id);
        if (m) { m.name=name; m.instruments=instrs; m.instrument=instrs[0]; m.whatsapp=whats; m.email=email; m.nascimento=nasc; m.camisa=camisa; m.accessRole=accessRole; m.user=user; m.pass=pass; m.memberType=memberType; }
    } else {
        S.members.push({ id:'mb'+uid(), name, instruments:instrs, instrument:instrs[0], whatsapp:whats, email, nascimento:nasc, camisa, accessRole, user, pass, memberType });
    }

    // Agora sim: remove o pedido de solicitação (só após membro salvo com sucesso)
    const rqId = S.modal?.data?._fromRqId;
    const rqCloud = S.modal?.data?._fromRqCloud;
    if (rqId) {
        if (rqCloud) { fbRemoverSolicitacao(rqId); }
        S.accessRequests = S.accessRequests.filter(r => r.id !== rqId);
    }

    persist(); closeModal(); render();
    toast(id ? `✅ ${name} atualizado!` : `✅ ${name} cadastrado no ministério!`);
}

function deleteMember(id) {
    const m = S.members.find(x=>x.id===id); if(!m) return;
    if (!confirm(`Remover ${m.name} do ministério?\n\n(Fica na Lixeira por 30 dias — dá para recuperar)`)) return;
    S.members = S.members.filter(x=>x.id!==id);
    _addTomb('members', id);  // impede que o membro "ressuscite" no merge
    S.lixeira.push({ id:'lx'+uid(), tipo:'membro', item:m, excluidoEm:Date.now(),
        excluidoPor: S.currentMember?.name || 'ADM' });
    _limpaLixeiraAntiga();
    persist(); render();
    toast(`🗑 ${m.name} movido para a Lixeira.`);
}

// Remove da lixeira itens com mais de 30 dias
function _limpaLixeiraAntiga() {
    const limite = Date.now() - 30*24*60*60*1000;
    S.lixeira = (S.lixeira||[]).filter(x => x.excluidoEm > limite);
}

function saveFirstAccess(memberId) {

    const pass2 = document.getElementById('fa-pass2')?.value?.trim();
    if (!whats)  { toast('⚠️ Informe seu WhatsApp.'); return; }

    if (!pass || pass.length < 4) { toast('⚠️ Escolha uma senha com pelo menos 4 caracteres.'); return; }
    if (pass !== pass2) { toast('⚠️ As senhas não conferem.'); return; }
    const member = S.members.find(m=>m.id===memberId);
    if (!member) return;
    member.whatsapp = whats;
    member.email    = email;

    member.firstAccessDone = true;
    S.currentMember = member;
    persist();
    // Abre modal de boas-vindas; ao fechar, mostra missões se houver
    S.modal = { type:'bem-vindo', data:{ member } };
    render();
}

function salvarTrocarSenha() {
    const atual = document.getElementById('ts-atual')?.value?.trim();
    const nova  = document.getElementById('ts-nova')?.value?.trim();
    const nova2 = document.getElementById('ts-nova2')?.value?.trim();
    const member = S.currentMember;
    if (!member) return;
    if (atual !== member.pass)  { toast('⚠️ Senha atual incorreta.'); return; }
    if (!nova || nova.length < 4) { toast('⚠️ Nova senha precisa ter pelo menos 4 caracteres.'); return; }
    if (nova !== nova2) { toast('⚠️ As senhas não conferem.'); return; }
    // Atualiza senha no array de membros
    const m = S.members.find(x=>x.id===member.id);
    if (m) { m.pass = nova; S.currentMember = m; }
    persist();
    S.modal = null; render();
    toast('✅ Senha alterada com sucesso! 🔑');
}

function setAvailability(evId, memberId, status) {
    if (!S.availability[evId]) S.availability[evId] = {};
    if (status === null) {
        delete S.availability[evId][memberId];
    } else {
        S.availability[evId][memberId] = status;
    }
    persist();
    // Refresh mission alert if open
    if (S.modal?.type === 'mission-alert') {
        S.modal.data.escalas = getMemberEscalas(S.currentMember.name).filter(e=>e.daysUntil>=0);
    }
    render();
}

function openSubPicker(evId, fromId, rolesStr, roleLabel, evTitle, evDate) {
    S.modal = { type: 'sub-picker', data: { evId, fromId, rolesStr, roleLabel, evTitle, evDate } };

}

function indicarSubstituto(evId, fromId, toId, rolesStr, roleLabel, evTitle, evDate) {
    const fromMember = S.members.find(m=>m.id===fromId);
    const toMember   = S.members.find(m=>m.id===toId);
    if (!fromMember || !toMember) return;
    // Remove any previous pending substitution for this slot
    S.substitutions.filter(s => s.fromId===fromId && s.evId===evId).forEach(s => _addTomb('substitutions', s.id));
    S.substitutions = S.substitutions.filter(s => !(s.fromId===fromId && s.evId===evId));
    S.substitutions.push({
        id: 'sub'+uid(),
        fromId, fromName: fromMember.name,
        toId,   toName:   toMember.name,
        evId, evTitle, evDate,
        role: rolesStr, roleLabel,
        status: 'pending',
        at: Date.now(),
        notifiedTo: false,
        notifiedFrom: false
    });
    persist();
    closeModal();
    toast(`✅ ${toMember.name} foi indicado como substituto!`);
    render();
}

function respondSubstitution(subId, accepted) {
    const sub = S.substitutions.find(s=>s.id===subId);
    if (!sub) return;
    sub.status = accepted ? 'accepted' : 'rejected';
    sub.notifiedFrom = false; // original member hasn't seen result yet
    if (accepted) {
        // Update the escala: replace the old member's name with the substitute's
        const esc = S.escalas[sub.evId];
        if (esc) {
            const roles = sub.role.split(',');
            roles.forEach(k => {
                if (esc[k] && esc[k].toLowerCase() === sub.fromName.toLowerCase()) {
                    esc[k] = sub.toName;
                }
            });
        }
    }
    persist();
    closeModal();
    toast(accepted ? '✅ Você confirmou a substituição!' : '❌ Substituição recusada.');
    render();
}

// Called on member login — check for pending notifications
function checkSubNotifications(member) {
    // 1. Substitution requests directed TO this member (pending)
    const pendingReqs = S.substitutions.filter(s =>
        s.toId === member.id && s.status === 'pending' && !s.notifiedTo
    );
    // 2. Results of substitutions FROM this member (accepted/rejected, not yet seen)
    const pendingResults = S.substitutions.filter(s =>
        s.fromId === member.id && (s.status==='accepted'||s.status==='rejected') && !s.notifiedFrom
    );

    if (pendingReqs.length > 0) {
        // Mark as notified so we don't show again
        pendingReqs.forEach(s => { s.notifiedTo = true; });
        persist();
        S.modal = { type: 'sub-request', data: { member, requests: pendingReqs } };
        render();
        return true;
    }
    if (pendingResults.length > 0) {
        pendingResults.forEach(s => { s.notifiedFrom = true; });
        persist();
        S.modal = { type: 'sub-result', data: { member, results: pendingResults } };
        render();
        return true;
    }
    return false;
}

// ── Quem está online agora (nomes da presença em tempo real) ──────────
function _onlineNowInner() {
    const agora = Date.now();
    // remove duplicados pelo nome (mesma pessoa em 2 abas conta 1)
    const vistos = new Set();
    const lista = (_onlineInfo||[])
        .slice()
        .sort((a,b)=>b.at-a.at)
        .filter(o => { const k=(o.nome||'').toLowerCase().trim(); if(vistos.has(k))return false; vistos.add(k); return true; });
    if (!lista.length) return `<span style="font-size:13px;color:var(--muted)">Ninguém online no momento.</span>`;
    return lista.map(o => {
        const adm = o.role === 'adm';
        const seg = Math.round((agora - o.at)/1000);
        const quando = seg < 75 ? 'agora' : `há ${Math.round(seg/60)} min`;
        return `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600">

            <span style="font-size:11px;color:var(--muted);font-weight:400">· ${quando}</span>
        </span>`;
    }).join('');
}

// ── Registro de entrada e saída dos membros (últimas 24h) ──────────────
function registro24hHtml() {
    const agora = Date.now();
    const limite = agora - 24*60*60*1000;
    const eventos = (S.activityLog||[])
        .filter(a => a.at >= limite && (a.type==='login' || a.type==='logout') && a.memberId)
        .sort((a,b) => a.at - b.at);
    const hhmm = (ts) => { const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
    const dur = (ms) => { const min=Math.round(ms/60000); if(min<1) return '<1 min'; if(min<60) return min+' min'; return Math.floor(min/60)+'h '+(min%60)+'min'; };

    // agrupa por membro e pareia cada entrada com a próxima saída
    const porMembro = {};
    eventos.forEach(e => { (porMembro[e.memberId] = porMembro[e.memberId] || { nome:e.memberName, evs:[] }).evs.push(e); });

    const linhas = [];
    let totalEntradas = 0;
    Object.values(porMembro).forEach(({nome, evs}) => {
        const online = _onlineNomes.includes((nome||'').toLowerCase().trim());
        const sessoes = [];
        let entradaPend = null;
        evs.forEach(e => {
            if (e.type==='login') { if (entradaPend) sessoes.push({ ent:entradaPend, sai:null }); entradaPend = e.at; }
            else if (e.type==='logout') { if (entradaPend!=null) { sessoes.push({ ent:entradaPend, sai:e.at }); entradaPend=null; } }
        });
        if (entradaPend!=null) sessoes.push({ ent:entradaPend, sai:null });
        totalEntradas += sessoes.length;
        sessoes.forEach(s => {
            linhas.push({ nome, ent:s.ent, sai:s.sai, online });
        });
    });
    linhas.sort((a,b) => b.ent - a.ent); // mais recentes primeiro

    const rows = linhas.map(l => {
        const aberto = l.sai==null;
        const saiTxt = aberto ? (l.online ? '<span style="color:#22c55e;font-weight:700">🟢 online agora</span>' : '<span style="color:var(--muted)">— (não registrada)</span>') : '🔴 '+hhmm(l.sai);
        const tempo = aberto ? (l.online ? dur(agora - l.ent) : '—') : dur(l.sai - l.ent);
        return `<tr>
            <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;font-size:13px">${escHtml(l.nome)}</td>
            <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap">🟢 ${hhmm(l.ent)}</td>
            <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap">${saiTxt}</td>
            <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);white-space:nowrap">${tempo}</td>
        </tr>`;
    }).join('');

    const onlineAgora = _onlineNomes.length;
    return `<details style="margin-bottom:28px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
        <summary style="cursor:pointer;padding:16px 18px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;user-select:none">
            🕐 Registro de Entrada e Saída <span style="font-weight:400;color:var(--muted);font-size:12px">— últimas 24h</span>
        </summary>
        <div style="padding:0 16px 16px">
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
                <span style="font-size:12px;background:rgba(0,150,63,.12);border:1px solid rgba(0,150,63,.25);border-radius:8px;padding:4px 10px;color:#4ade80;font-weight:700">${totalEntradas} entrada${totalEntradas!==1?'s':''}</span>
                <span style="font-size:12px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:8px;padding:4px 10px;color:#22c55e;font-weight:700">🟢 ${onlineAgora} online agora</span>
            </div>
            <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px">
                <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#22c55e;margin-bottom:8px">🟢 Quem está online agora</div>
                <div id="online-now-box" style="display:flex;flex-wrap:wrap;gap:7px">${_onlineNowInner()}</div>
            </div>
            ${linhas.length ? `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;min-width:380px">
                <thead><tr>
                    <th style="text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border)">Membro</th>
                    <th style="text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border)">Entrada</th>
                    <th style="text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border)">Saída</th>
                    <th style="text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:2px solid var(--border)">Tempo</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table></div>`
            : `<div style="text-align:center;padding:18px;color:var(--muted);font-size:13px">Nenhuma entrada registrada nas últimas 24h.</div>`}
            <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4">💡 A saída é registrada quando o membro fecha ou sai do app. "🟢 online agora" = está com o app aberto neste momento.</div>
        </div>
    </details>`;
}

        return Math.floor(sec/3600)+'h '+Math.floor((sec%3600)/60)+'min';

                    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px">
                        <div style="text-align:center;background:var(--bg3);border-radius:8px;padding:8px 14px">
                            <div style="font-size:18px;font-weight:800;color:var(--purple-light)">${uniqueSongs}</div>
                            <div style="font-size:10px;color:var(--muted);text-transform:uppercase">músicas</div>
                        </div>
                        <div style="text-align:center;background:var(--bg3);border-radius:8px;padding:8px 14px">
                            <div style="font-size:18px;font-weight:800;color:#a5b4fc">${fmtTime(totalCifra)}</div>
                            <div style="font-size:10px;color:var(--muted);text-transform:uppercase">cifra</div>
                        </div>
                        <div style="text-align:center;background:var(--bg3);border-radius:8px;padding:8px 14px">

                        <div style="text-align:center;background:var(--bg3);border-radius:8px;padding:8px 14px">

                </div>
                <div style="text-align:center;flex-shrink:0">

                        </div>
                    </div>

                    <div style="font-size:10px;color:var(--muted)">preparação</div>
                </div>
            </div>
            ${recent.length ? `
            <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
                <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Atividade recente</div>
                <div style="display:flex;flex-direction:column;gap:4px">
                    ${recent.map(a=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px">
                        <span style="color:var(--muted);white-space:nowrap">${fmtDate(a.at)}</span>
                        <span>${typeLabel[a.type]||a.type}</span>
                        <span style="color:var(--purple-light);font-weight:600">${a.songTitle||''}</span>
                        ${a.duration>0?`<span style="margin-left:auto;color:var(--muted)">${fmtTime(a.duration)}</span>`:''}
                    </div>`).join('')}
                </div>
            </div>` : `<div style="margin-top:12px;font-size:12px;color:var(--muted);font-style:italic">Sem atividade registrada ainda.</div>`}
        </div>`;

    // ── split by type ─────────────────────────────────────────────────────
    const membros      = mbs.filter(m=>(m.memberType||'membro')==='membro');
    const colaboradores= mbs.filter(m=>m.memberType==='colaborador');

    const membrosSection = membros.length ? `
        <div style="display:flex;align-items:center;gap:10px;margin:28px 0 14px">
            <div style="flex:1;height:1px;background:rgba(0,150,63,.3)"></div>
            <div style="display:flex;align-items:center;gap:8px;background:rgba(0,150,63,.1);border:1px solid rgba(0,150,63,.25);border-radius:20px;padding:5px 14px">
                <span style="font-size:14px">🎼</span>
                <span style="font-size:13px;font-weight:800;color:var(--purple-light)">Membros</span>
                <span style="background:var(--purple);color:#fff;border-radius:10px;padding:0px 7px;font-size:11px;font-weight:700">${membros.length}</span>
            </div>
            <div style="flex:1;height:1px;background:rgba(0,150,63,.3)"></div>
        </div>
        ${membros.map(memberCard).join('')}` : '';

    const colaboradoresSection = colaboradores.length ? `
        <div style="display:flex;align-items:center;gap:10px;margin:28px 0 14px">
            <div style="flex:1;height:1px;background:rgba(245,158,11,.25)"></div>
            <div style="display:flex;align-items:center;gap:8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);border-radius:20px;padding:5px 14px">
                <span style="font-size:14px">🤝</span>
                <span style="font-size:13px;font-weight:800;color:#f59e0b">Colaboradores</span>
                <span style="background:#f59e0b;color:#111;border-radius:10px;padding:0px 7px;font-size:11px;font-weight:700">${colaboradores.length}</span>
            </div>
            <div style="flex:1;height:1px;background:rgba(245,158,11,.25)"></div>
        </div>
        ${colaboradores.map(memberCard).join('')}` : '';

    return `<div style="max-width:800px;margin:0 auto">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px">
            <h2 style="font-size:22px;font-weight:800">📊 Atividade do Ministério</h2>
            <button class="btn btn-ghost btn-sm" onclick="if(confirm('Limpar todo o histórico de atividade?')){S.activityLog=[];persist();render();}"
                style="color:#f87171;border-color:#f87171">${ic('trash',15)} Limpar histórico</button>
        </div>
        ${registro24hHtml()}
        ${overviewSection}
        ${membrosSection}
        ${colaboradoresSection}
    </div>`;
}

            <td style="padding:12px 10px">

                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--muted);text-align:center">

    </div>`;
}

function togglePw(id, pass) {
    const el = document.getElementById('pw-'+id);
    if (!el) return;
    el.textContent = el.textContent === '••••••' ? pass : '••••••';
}

//  INVENTÁRIO DE PATRIMÔNIO
// ════════════════════════════════════════════════════
const INV_CATS = ['Instrumento','Equipamento de Som','Microfone','Cabo / Adaptador','Acessório','Mobiliário','Outro'];
const INV_CAT_EMOJI = {
    'Instrumento':'🎸', 'Equipamento de Som':'🔊', 'Microfone':'🎤',
    'Cabo / Adaptador':'🔌', 'Acessório':'🎵', 'Mobiliário':'🪑', 'Outro':'📦'
};
const INV_ESTADOS = ['Ótimo','Bom','Regular','Manutenção','Inativo'];
const INV_ESTADO_KEY = { 'Ótimo':'otimo','Bom':'bom','Regular':'regular','Manutenção':'manutencao','Inativo':'inativo' };
const INV_UNIDADES = ['un','par','cx','kit','m','rolo'];

function inventarioPage() {
    const q     = (S._invQ || '').toLowerCase();
    const cat   = S._invCat || '';
    const todos = S.inventario.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));

    let lista = todos;
    if (cat) lista = lista.filter(i=>i.categoria===cat);
    if (q)   lista = lista.filter(i=>
        i.nome.toLowerCase().includes(q) ||
        (i.descricao||'').toLowerCase().includes(q) ||
        (i.categoria||'').toLowerCase().includes(q)
    );

    // ── Estatísticas ──
    const totalItens = todos.reduce((s,i)=>s+Number(i.quantidade||0),0);
    const manutencao = todos.filter(i=>i.estado==='Manutenção').length;
    const catCount   = [...new Set(todos.map(i=>i.categoria))].length;

    return `
    <div class="section-header">
        <div>
            <h2 class="section-title">${ic('inventario',22)} Inventário</h2>
            <p style="color:var(--muted);font-size:13px;margin-top:2px">Patrimônio do ministério</p>
        </div>
        ${isAdm() ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary btn-sm" onclick="openInvAdd()">${ic('plus',16)} Item</button>
            <button class="btn btn-sm" onclick="printInventario()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff">${ic('print',16)} Imprimir</button>
        </div>` : ''}
    </div>

    <!-- Estatísticas rápidas -->
    <div class="inv-stats">
        <div class="inv-stat-pill"><span>📦</span><b>${todos.length}</b><small>item${todos.length!==1?'s':''}</small></div>
        <div class="inv-stat-pill"><span>🔢</span><b>${totalItens}</b><small>unid. no total</small></div>
        <div class="inv-stat-pill"><span>🗂</span><b>${catCount}</b><small>categoria${catCount!==1?'s':''}</small></div>
        ${manutencao>0?`<div class="inv-stat-pill" style="border-color:rgba(239,68,68,.3)"><span>🔧</span><b style="color:#f87171">${manutencao}</b><small style="color:#f87171">em manutenção</small></div>`:''}
    </div>

    <!-- Filtros -->
    <div class="inv-toolbar">
        <input class="field" type="text" placeholder="🔍 Buscar item..." value="${escHtml(S._invQ||'')}"
            oninput="S._invQ=this.value;render()">
        <select onchange="S._invCat=this.value;render()">
            <option value="" ${!cat?'selected':''}>Todas as categorias</option>
            ${INV_CATS.map(c=>`<option value="${c}" ${cat===c?'selected':''}>${INV_CAT_EMOJI[c]||'📦'} ${c}</option>`).join('')}
        </select>
    </div>

    <!-- Grade de itens -->
    <div class="inv-grid">
        ${lista.length === 0 ? `
        <div class="inv-empty">
            <div class="inv-empty-icon">📦</div>
            <div style="font-size:17px;font-weight:700;margin-bottom:8px">${q||cat?'Nenhum item encontrado':'Inventário vazio'}</div>
            <div style="font-size:13px">${isAdm()&&!q&&!cat?'Clique em "+ Item" para cadastrar o primeiro patrimônio.':q||cat?'Tente outros filtros.':''}</div>
        </div>` :
        lista.map(item => {
            const estadoKey = INV_ESTADO_KEY[item.estado] || 'bom';
            const emoji     = INV_CAT_EMOJI[item.categoria] || '📦';
            return `<div class="inv-card">
                <div class="inv-card-top">
                    <div class="inv-cat-icon">${emoji}</div>
                    <div class="inv-card-info">
                        <div class="inv-card-name">${escHtml(item.nome)}</div>
                        <div class="inv-card-cat">${escHtml(item.categoria)}</div>
                    </div>
                </div>
                <div class="inv-card-mid">
                    <div>
                        <div class="inv-qtd">${Number(item.quantidade)}</div>
                        <div class="inv-unidade">${escHtml(item.unidade||'un')}</div>
                    </div>
                    <div style="flex:1"></div>
                    <span class="inv-estado ${estadoKey}">${escHtml(item.estado)}</span>
                </div>
                ${item.descricao?`<div class="inv-card-desc">${escHtml(item.descricao)}</div>`:''}
                ${item.obs?`<div class="inv-card-desc" style="font-style:italic;color:var(--muted)">📝 ${escHtml(item.obs)}</div>`:''}
                ${isAdm()?`<div class="inv-card-ft">
                    <button class="btn btn-ghost btn-sm" onclick="openInvEdit('${item.id}')">${ic('edit',15)} Editar</button>
                    <button class="btn btn-danger btn-sm" onclick="delInv('${item.id}')">${ic('trash',15)}</button>
                </div>`:''}
            </div>`;
        }).join('')}
    </div>`;
}

function invAddModal(data) {
    const edit = data && data.id;
    const it   = edit ? S.inventario.find(x=>x.id===data.id) : null;
    return `<div class="backdrop" onclick="closeModal(event)">
    <div class="modal" style="max-width:480px">
        <div class="modal-hd">
            <div class="modal-title">${edit?'Editar Item':'Novo Item'}</div>
            <button class="close-btn" onclick="closeModal()">${ic('close',20)}</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Nome do item *</label>
                <input class="field" id="inv-nome" type="text" maxlength="100"
                    placeholder="Ex: Violão Yamaha C40" value="${escHtml(it?.nome||'')}">
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                <div class="form-group">
                    <label class="form-label">Categoria</label>
                    <select class="field" id="inv-cat">
                        ${INV_CATS.map(c=>`<option value="${c}" ${(it?.categoria||INV_CATS[0])===c?'selected':''}>${INV_CAT_EMOJI[c]} ${c}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Estado</label>
                    <select class="field" id="inv-estado">
                        ${INV_ESTADOS.map(e=>`<option value="${e}" ${(it?.estado||'Bom')===e?'selected':''}>${e}</option>`).join('')}
                    </select>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
                <div class="form-group">
                    <label class="form-label">Quantidade *</label>
                    <input class="field" id="inv-qtd" type="number" min="0" step="1" placeholder="1" value="${it?.quantidade??1}">
                </div>
                <div class="form-group">
                    <label class="form-label">Unidade</label>
                    <select class="field" id="inv-unidade">
                        ${INV_UNIDADES.map(u=>`<option value="${u}" ${(it?.unidade||'un')===u?'selected':''}>${u}</option>`).join('')}
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Descrição</label>
                <input class="field" id="inv-desc" type="text" maxlength="200"
                    placeholder="Ex: Modelo, marca, número de série…" value="${escHtml(it?.descricao||'')}">
            </div>
            <div class="form-group">
                <label class="form-label">Observação</label>
                <textarea class="field" id="inv-obs" rows="2" placeholder="Localização, quem está usando, etc.">${escHtml(it?.obs||'')}</textarea>
            </div>
        </div>
        <div class="modal-ft">
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="saveInv('${edit?it.id:''}')">💾 Salvar</button>
        </div>
    </div></div>`;
}

function openInvAdd()     { S.modal = { type:'inv-add', data:{} }; render(); }

function saveInv(editId) {
    const nome   = (document.getElementById('inv-nome')?.value||'').trim();
    const cat    = document.getElementById('inv-cat')?.value||'Outro';
    const estado = document.getElementById('inv-estado')?.value||'Bom';
    const qtd    = parseFloat(document.getElementById('inv-qtd')?.value||'1');
    const unid   = document.getElementById('inv-unidade')?.value||'un';
    const desc   = (document.getElementById('inv-desc')?.value||'').trim();
    const obs    = (document.getElementById('inv-obs')?.value||'').trim();

    if (!nome) { toast('⚠️ Informe o nome do item.'); return; }
    if (isNaN(qtd)||qtd<0) { toast('⚠️ Informe uma quantidade válida.'); return; }

    const agora = Date.now();
    if (editId) {
        const idx = S.inventario.findIndex(x=>x.id===editId);
        if (idx>=0) S.inventario[idx] = { ...S.inventario[idx], nome, categoria:cat, estado, quantidade:qtd, unidade:unid, descricao:desc, obs, atualizadoEm:agora };

    } else {

    S.modal = null;

const FIN_CAT_ENTRADA = ['Doação','Dízimo','Contribuição','Evento','Patrocínio','Outro'];
const FIN_CAT_SAIDA   = ['Equipamento','Material Musical','Evento','Manutenção','Serviços','Impressão','Outro'];

function fmtBRL(v) {
    return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDataFin(ds) {
    if (!ds) return '';
    const [y,m,d] = ds.split('-');
    return `${d}/${m}/${y}`;
}

function saveFin(editId) {
    const desc  = (document.getElementById('fin-desc')?.value||'').trim();
    const valor = parseFloat(document.getElementById('fin-valor')?.value||'0');
    const data  = document.getElementById('fin-data')?.value||'';
    const cat   = document.getElementById('fin-cat')?.value||'';
    const obs   = (document.getElementById('fin-obs')?.value||'').trim();
    const tipo  = S.modal?.data?.tipo || 'entrada';

    if (!desc)        { toast('⚠️ Informe a descrição.'); return; }
    if (!valor||valor<=0) { toast('⚠️ Informe um valor válido.'); return; }
    if (!data)        { toast('⚠️ Informe a data.'); return; }

    if (editId) {
        const idx = S.financeiro.findIndex(x=>x.id===editId);
        if (idx>=0) S.financeiro[idx] = { ...S.financeiro[idx], tipo, categoria:cat, descricao:desc, valor, data, obs };
        toast('✅ Lançamento atualizado.');
    } else {
        S.financeiro.push({ id:'fin'+uid(), tipo, categoria:cat, descricao:desc, valor, data, obs,
            criadoPor: S.currentMember?.name || 'ADM', criadoEm: Date.now() });
        toast('✅ Lançamento registrado.');
    }
    persist();
    S.modal = null;
    render();
}

function delFin(id) {
    if (!confirm('Excluir este lançamento?')) return;
    S.financeiro = S.financeiro.filter(x=>x.id!==id); _addTomb('financeiro', id);
    persist();
    toast('🗑 Lançamento excluído.');
    render();
}

function downloadFinCSV() {
    const todos = S.financeiro.slice().sort((a,b)=>a.data.localeCompare(b.data));
    const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

    const totalEntrada = todos.filter(t=>t.tipo==='entrada').reduce((a,t)=>a+Number(t.valor),0);
    const totalSaida   = todos.filter(t=>t.tipo==='saida').reduce((a,t)=>a+Number(t.valor),0);
    const saldo        = totalEntrada - totalSaida;

    const header = 'Data;Tipo;Categoria;Descrição;Valor (R$);Observação;Registrado por\n';
    const rows = todos.map(t => [
        fmtDataFin(t.data),
        t.tipo==='entrada'?'Entrada':'Saída',
        t.categoria,
        t.descricao,
        Number(t.valor).toFixed(2).replace('.',','),
        t.obs||'',
        t.criadoPor||'ADM'
    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');

    const rodape = `\n\n"Total Entradas";"${totalEntrada.toFixed(2).replace('.',',')}"\n"Total Saídas";"${totalSaida.toFixed(2).replace('.',',')}"\n"Saldo";"${saldo.toFixed(2).replace('.',',')}"\n`;

    const bom = '﻿'; // BOM para Excel reconhecer UTF-8
    const blob = new Blob([bom + header + rows + rodape], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const hoje = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `hallel-financeiro-${hoje}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    toast('📥 Relatório baixado!');
}

const AVISO_TIPOS = {
    urgente: { label:'🚨 Urgente',  cor:'#ef4444', cls:'aviso-urgente' },
    ensaio:  { label:'🎵 Ensaio',   cor:'#f59e0b', cls:'aviso-ensaio'  },
    info:    { label:'📢 Informativo', cor:'#6366f1', cls:'aviso-info'  },
};

function avisosHtml() {
    if (!S.avisos || !S.avisos.length) return '';
    const dismissed = JSON.parse(localStorage.getItem('hl_avisos_dismissed')||'[]');
    const visiveis = S.avisos.filter(a => !dismissed.includes(a.id));
    if (!visiveis.length) return '';
    return visiveis.map(a => {
        const t = AVISO_TIPOS[a.tipo] || AVISO_TIPOS.info;
        const data = new Date(a.criadoEm).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        return `<div class="aviso-banner ${t.cls}">
            <div class="aviso-body">
                <div class="aviso-titulo" style="color:${t.cor}">${t.label} — ${escHtml(a.titulo)}</div>
                <div class="aviso-texto">${escHtml(a.texto).replace(/\n/g,'<br>')}</div>
                <div class="aviso-meta">${a.criadoPor} · ${data}</div>
                <div class="aviso-actions">
                    <button class="btn btn-sm" onclick="dismissAviso('${a.id}')"
                        style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:var(--muted);font-size:12px">
                        ${ic('check',13)} Entendido
                    </button>
                    ${isAdm() ? `<button class="btn btn-sm btn-danger" onclick="delAviso('${a.id}')" style="font-size:12px">
                        ${ic('trash',13)} Remover para todos
                    </button>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');
}

function dismissAviso(id) {
    const d = JSON.parse(localStorage.getItem('hl_avisos_dismissed')||'[]');
    if (!d.includes(id)) d.push(id);
    localStorage.setItem('hl_avisos_dismissed', JSON.stringify(d));
    render();
}

function delAviso(id) {
    if (!confirm('Remover este aviso para todos?')) return;
    S.avisos = S.avisos.filter(a => a.id !== id); _addTomb('avisos', id);
    persist();
    toast('Aviso removido.');
    render();
}

function openNovoAviso() {

function _ensaioDias(dataStr) {
    if (!dataStr) return 999;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const [y,m,d] = dataStr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    return Math.round((dt - hoje) / 86400000);
}
function _ensaioLabel(dataStr) {
    const dias = _ensaioDias(dataStr);
    if (dias === 0) return '🔴 HOJE';
    if (dias === 1) return '🟡 AMANHÃ';
    if (dias > 1)   return `em ${dias} dias`;
    return 'passado';
}

function ensaiosHtml() {
    const futuros = (S.ensaios||[]).filter(e => _ensaioDias(e.data) >= 0)
        .sort((a,b) => _ensaioDias(a.data) - _ensaioDias(b.data));
    if (!futuros.length && !isAdm()) return '';
    const meuNome = S.currentMember?.name || '';
    const cards = futuros.map(e => {
        const conf = e.confirmacoes || {};
        const sim = Object.values(conf).filter(v=>v==='sim').length;
        const nao = Object.values(conf).filter(v=>v==='nao').length;
        const [y,mo,d] = e.data.split('-');
        const dataFmt = `${d}/${mo}`;
        const dias = _ensaioDias(e.data);
        const meuStatus = meuNome ? conf[meuNome] : null;
        const isMembroView = isMembro();
        return `<div style="background:var(--bg2);border:1px solid ${dias<=1?'rgba(255,212,0,.4)':'var(--border)'};border-radius:12px;padding:14px 16px;margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
                <div>
                    <div style="font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px">🎼 Ensaio <span style="font-size:12px;font-weight:700;color:${dias<=1?'var(--gold)':'var(--purple-light)'}">${_ensaioLabel(e.data)}</span></div>
                    <div style="font-size:13px;color:var(--muted);margin-top:3px">📅 ${dataFmt}${e.hora?` · ⏰ ${e.hora}`:''}</div>
                    ${e.local?`<div style="font-size:13px;color:var(--text);margin-top:3px">📍 ${escHtml(e.local)}</div>`:''}
                    ${e.obs?`<div style="font-size:12px;color:var(--muted);margin-top:4px;font-style:italic">${escHtml(e.obs).replace(/\n/g,'<br>')}</div>`:''}
                </div>
                ${isAdm()?`<div style="display:flex;gap:6px;flex-shrink:0">
                    <button class="btn btn-ghost btn-sm btn-icon" onclick="openEditEnsaio('${e.id}')" title="Editar">${ic('edit',14)}</button>
                    <button class="btn btn-ghost btn-sm btn-icon" style="color:#f87171" onclick="delEnsaio('${e.id}')" title="Excluir">${ic('trash',14)}</button>
                </div>`:''}
            </div>
            ${e.local?`<div style="margin-top:8px">${mapButtons(e.local)}</div>`:''}
            ${isMembroView ? `<div style="display:flex;gap:8px;margin-top:10px">
                <button class="btn btn-sm" style="flex:1;background:${meuStatus==='sim'?'#16a34a':'var(--bg4)'};color:${meuStatus==='sim'?'#fff':'var(--text)'};font-weight:700;border:1px solid ${meuStatus==='sim'?'#16a34a':'var(--border)'}" onclick="confirmarEnsaio('${e.id}','sim')">✅ Vou</button>
                <button class="btn btn-sm" style="flex:1;background:${meuStatus==='nao'?'#dc2626':'var(--bg4)'};color:${meuStatus==='nao'?'#fff':'var(--text)'};font-weight:700;border:1px solid ${meuStatus==='nao'?'#dc2626':'var(--border)'}" onclick="confirmarEnsaio('${e.id}','nao')">❌ Não vou</button>
            </div>`:''}
            <div style="display:flex;gap:12px;margin-top:10px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap">
                <span style="color:#22c55e;font-weight:700">✅ ${sim} confirmado${sim!==1?'s':''}</span>
                ${nao?`<span style="color:#ef4444;font-weight:700">❌ ${nao}</span>`:''}
                ${isAdm() && (sim+nao)>0 ? `<button class="btn btn-ghost btn-sm" style="font-size:11px;padding:2px 8px;margin-left:auto" onclick="verConfirmacoesEnsaio('${e.id}')">Ver quem</button>`:''}
            </div>
        </div>`;
    }).join('');
    return `<div style="margin-bottom:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
            <h3 style="font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px">🎼 Mural de Ensaios</h3>
            ${isAdm()?`<button class="btn btn-sm btn-primary" onclick="openNovoEnsaio()">+ Agendar</button>`:''}
        </div>
        ${cards || `<div style="text-align:center;padding:18px;color:var(--muted);background:var(--bg2);border:1px dashed var(--border);border-radius:12px;font-size:13px">Nenhum ensaio agendado.</div>`}
    </div>`;
}

function openNovoEnsaio() { S.modal = { type:'ensaio', data:{} }; render(); }
function openEditEnsaio(id) {
    const e = (S.ensaios||[]).find(x=>x.id===id);
    if (e) { S.modal = { type:'ensaio', data:{...e} }; render(); }
}
function delEnsaio(id) {
    if (!confirm('Excluir este ensaio?')) return;
    S.ensaios = (S.ensaios||[]).filter(e=>e.id!==id); _addTomb('ensaios', id);
    persist(true); render(); toast('Ensaio excluído.');
}
function confirmarEnsaio(id, status) {
    if (!S.currentMember) { toast('Apenas membros confirmam presença.'); return; }
    const e = (S.ensaios||[]).find(x=>x.id===id); if(!e) return;
    if (!e.confirmacoes) e.confirmacoes = {};
    const nome = S.currentMember.name;
    if (e.confirmacoes[nome] === status) delete e.confirmacoes[nome];
    else e.confirmacoes[nome] = status;
    persist(true); render();
    toast(status==='sim'?'✅ Presença confirmada!':'Resposta registrada.');
}
function verConfirmacoesEnsaio(id) {
    const e = (S.ensaios||[]).find(x=>x.id===id); if(!e) return;
    const conf = e.confirmacoes||{};
    const sim = Object.entries(conf).filter(([,v])=>v==='sim').map(([n])=>'✅ '+n);
    const nao = Object.entries(conf).filter(([,v])=>v==='nao').map(([n])=>'❌ '+n);
    alert('Confirmações do ensaio:\n\n'+([...sim,...nao].join('\n')||'Ninguém respondeu ainda.'));
}
function ensaioModal(data) {
    const isEdit = !!data?.id;
    return `<div class="backdrop" onclick="closeModal(event)">
    <div class="modal" style="max-width:460px">
        <div class="modal-hd">
            <div class="modal-title">🎼 ${isEdit?'Editar Ensaio':'Agendar Ensaio'}</div>
            <button class="close-btn" onclick="closeModal()">${ic('close',20)}</button>
        </div>
        <div class="modal-body" style="display:flex;flex-direction:column;gap:14px">
            <div style="display:flex;gap:10px">
                <div style="flex:1"><label class="form-label">Data *</label>
                    <input class="field" id="en-data" type="date" value="${data?.data||''}"></div>
                <div style="width:120px"><label class="form-label">Hora</label>
                    <input class="field" id="en-hora" type="time" value="${data?.hora||''}"></div>
            </div>
            <div><label class="form-label">Local</label>
                <input class="field" id="en-local" type="text" placeholder="Ex: Salão paroquial" value="${escHtml(data?.local||'')}"></div>
            <div><label class="form-label">Observações</label>
                <textarea class="field" id="en-obs" rows="3" placeholder="Ex: Levar instrumentos; foco no repertório da missa">${escHtml(data?.obs||'')}</textarea></div>
        </div>
        <div class="modal-ft">
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" onclick="salvarEnsaio(${isEdit?`'${data.id}'`:'null'})">${ic('check',16)} ${isEdit?'Salvar':'Agendar para todos'}</button>
        </div>
    </div></div>`;
}
function salvarEnsaio(editId) {
    const dataV = document.getElementById('en-data')?.value;
    if (!dataV) { toast('⚠️ Informe a data do ensaio.'); return; }
    const obj = {
        data: dataV,
        hora: document.getElementById('en-hora')?.value || '',
        local: document.getElementById('en-local')?.value?.trim() || '',
        obs: document.getElementById('en-obs')?.value?.trim() || '',
    };
    if (!S.ensaios) S.ensaios = [];
    if (editId) {
        const e = S.ensaios.find(x=>x.id===editId);
        if (e) Object.assign(e, obj);
    } else {
        obj.id = 'en'+uid();
        obj.criadoPor = (isAdm() && S.currentMember) ? S.currentMember.name : 'ADM';
        obj.criadoEm = Date.now();
        obj.confirmacoes = {};
        S.ensaios.push(obj);
        const [yy,mm,dd] = obj.data.split('-');
        pushNotificar('Novo ensaio agendado', `📅 ${dd}/${mm}${obj.hora?' às '+obj.hora:''}${obj.local?' — '+obj.local:''}`);
    }
    persist(true);
    S.modal = null; render();
    toast(editId?'✅ Ensaio atualizado!':'🎼 Ensaio agendado para todos!');
}

function _meuNomeChat() {
    return S.currentMember?.name || (isAdm() ? 'Coordenador' : 'Equipe');
}
function _meuIdChat() {
    return S.currentMember?.id || (isAdm() ? '_adm' : '_geral');
}
function comentariosHtml(alvo) {
    const lista = (S.comentarios||[]).filter(c => c.alvo === alvo).sort((a,b)=>(a.at||0)-(b.at||0));
    const meuId = _meuIdChat();
    const inputId = 'cmt-input-' + alvo.replace(/[^a-z0-9]/gi,'');
    const itens = lista.length ? lista.map(c => {
        const dt = new Date(c.at);
        const quando = dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}) + ' ' + dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
        const meu = c.autorId === meuId;
        const podeApagar = meu || isAdm();
        return `<div style="display:flex;flex-direction:column;align-items:${meu?'flex-end':'flex-start'};margin-bottom:8px">
            <div style="max-width:85%;background:${meu?'rgba(0,150,63,.18)':'var(--bg3)'};border:1px solid ${meu?'rgba(0,150,63,.3)':'var(--border)'};border-radius:12px;padding:8px 11px">
                <div style="font-size:11px;font-weight:700;color:${meu?'#4ade80':'var(--purple-light)'};margin-bottom:2px">${escHtml(c.autor)}</div>
                <div style="font-size:13px;line-height:1.4;white-space:pre-wrap;word-break:break-word">${escHtml(c.texto)}</div>
                <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:3px">
                    <span style="font-size:10px;color:var(--muted)">${quando}</span>
                    ${podeApagar?`<span onclick="delComentario('${c.id}')" style="cursor:pointer;font-size:11px;color:#f87171">excluir</span>`:''}
                </div>
            </div>
        </div>`;
    }).join('') : `<div style="text-align:center;color:var(--muted);font-size:13px;font-style:italic;padding:10px 0">Nenhuma mensagem ainda. Comece a conversa! 💬</div>`;
    const podeEscrever = !!S.role;
    return `<div class="dsec" style="margin-top:14px">
        <div class="dsec-title">💬 Conversa ${lista.length?`<span style="color:var(--muted);font-weight:400">(${lista.length})</span>`:''}</div>
        <div style="max-height:280px;overflow-y:auto;padding:4px 2px 2px">${itens}</div>
        ${podeEscrever ? `<div style="display:flex;gap:8px;margin-top:10px">
            <textarea id="${inputId}" rows="1" placeholder="Escreva uma mensagem…" style="flex:1;resize:none;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13px;font-family:inherit"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();addComentario('${alvo}','${inputId}')}"></textarea>
            <button class="btn btn-primary btn-sm" style="flex-shrink:0;align-self:stretch;padding:0 16px" onclick="addComentario('${alvo}','${inputId}')">Enviar</button>
        </div>` : `<div style="font-size:12px;color:var(--muted);margin-top:8px">Entre como membro para participar da conversa.</div>`}
    </div>`;
}
function addComentario(alvo, inputId) {
    if (!S.role) { toast('Entre para comentar.'); return; }
    const el = document.getElementById(inputId);
    const texto = (el?.value || '').trim();
    if (!texto) return;
    if (!S.comentarios) S.comentarios = [];
    S.comentarios.push({ id:'c'+uid(), alvo, autor:_meuNomeChat(), autorId:_meuIdChat(), texto, at:Date.now() });
    if (el) el.value = '';
    persist(true);
    render();
}
function delComentario(id) {
    const c = (S.comentarios||[]).find(x=>x.id===id); if(!c) return;
    if (!(c.autorId===_meuIdChat() || isAdm())) { toast('Você só pode excluir suas mensagens.'); return; }
    if (!confirm('Excluir esta mensagem?')) return;
    S.comentarios = S.comentarios.filter(x=>x.id!==id);
    _addTomb('comentarios', id);
    persist(true);
    render();
}
