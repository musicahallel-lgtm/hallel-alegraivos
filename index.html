function relatorioPage() {
    const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                   'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const instrEmoji = {violao:'🎸',teclado:'🎹',bateria:'🥁',baixo:'🎸',guitarra:'🎸',sopro:'🎷',vocal1:'🎤',vocal2:'🎤',vocal3:'🎤',animador:'🎙'};
    const instrLabel = {violao:'Violão',teclado:'Teclado',bateria:'Bateria',baixo:'Baixo',guitarra:'Guitarra',sopro:'Sopro',vocal1:'Vocal 1',vocal2:'Vocal 2',vocal3:'Vocal 3',animador:'Animador'};

    const selMonth = S._relMonth ?? new Date().getMonth();

    function eventsForMonth(mo) {
        // One-time events
        const evs = EVENTOS_2026.filter(ev => {
            const m = parseInt(ev.start.split('-')[1]) - 1;
            return m === mo;
        });
        // Recurring for this month (unique by recId to show pattern once)
        const recDates = REC_2026.filter(ev => parseInt(ev.start.split('-')[1])-1 === mo);
        // Group recurring by recId
        const recGroups = {};
        recDates.forEach(ev => {
            if (!recGroups[ev.recId]) recGroups[ev.recId] = [];
            recGroups[ev.recId].push(ev);
        });
        return { evs, recGroups };
    }

    function fmtDate(ds) {
        const [y,m,d] = ds.split('-');
        return `${parseInt(d)}/${parseInt(m)}/${y}`;
    }

    function escalaBlock(esc, compact) {
        if (!esc) return '';
        const filled = EV_INSTR.filter(({k})=>esc[k]);
        if (!filled.length) return compact ? '' : `<span style="color:var(--muted);font-size:12px;font-style:italic">Sem escala definida</span>`;
        if (compact) {
            return filled.map(({k})=>`<span style="font-size:11px;margin-right:6px;display:inline-flex;align-items:center;gap:3px">${instrIcon(k,12)} ${esc[k]}</span>`).join('');
        }
        return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px 12px;margin-top:6px">
            ${filled.map(({k})=>`<div style="display:flex;gap:6px;align-items:center;font-size:12px">
                <span style="color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px">${instrIcon(k,12)} ${instrLabel[k]}</span>
                <span style="font-weight:700;color:var(--text)">${esc[k]}</span>
            </div>`).join('')}
        </div>`;
    }

    function setListBlock(esc) {
        const slId = esc?.setListId;
        if (!slId) return '';
        const sl = S.setlists.find(x=>x.id===slId);
        if (!sl) return '';
        const songs = (sl.blocks||[]).flatMap(b=>(b.songIds||[]).map(id=>({
            song: S.songs.find(s=>s.id===id),
            voz: (b.vozes||{})[id]||''
        }))).filter(x=>x.song);
        if (!songs.length) return '';
        return `<div style="margin-top:8px;padding:8px 10px;background:rgba(0,150,63,.06);border-left:3px solid var(--purple);border-radius:0 6px 6px 0">
            <div style="font-size:10px;font-weight:700;color:var(--purple-light);text-transform:uppercase;margin-bottom:4px">🎵 Set List</div>
            ${songs.map((x,i)=>`<div style="font-size:12px;padding:1px 0">${i+1}. ${x.song.title}${x.song.key?` <span style="color:var(--muted)">(${x.song.key})</span>`:''}${x.voz?` <span style="color:var(--muted)">— 🎤 ${x.voz}</span>`:''}</div>`).join('')}
        </div>`;
    }

    const { evs, recGroups } = eventsForMonth(selMonth);
    const totalEvents = evs.length + Object.keys(recGroups).length;

    // Build event cards
    const eventCards = evs.map(ev => {
        const esc = S.escalas[ev.id]||{};
        const hasEsc = EV_INSTR.some(({k})=>esc[k]);
        const multiDay = ev.start !== ev.end;
        const dateLabel = multiDay ? `${fmtDate(ev.start)} a ${fmtDate(ev.end)}` : fmtDate(ev.start);
        return `<div class="rel-event-card ${ev.alegrai?'rel-alegrai':''}">
            <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
                <div style="flex:1;min-width:180px">
                    <div style="font-size:15px;font-weight:800;margin-bottom:2px;color:${ev.alegrai?'#F15A24':'var(--text)'}">${ev.alegrai?'⭐ ':''}${ev.title}</div>
                    <div style="font-size:12px;color:var(--muted)">📅 ${dateLabel}${ev.horario?' · ⏰ '+ev.horario:''}</div>
                </div>
                ${hasEsc?`<div style="font-size:10px;font-weight:700;background:rgba(0,150,63,.15);color:var(--purple-light);border:1px solid rgba(0,150,63,.25);padding:2px 8px;border-radius:8px;white-space:nowrap">✅ Com escala</div>`:'<div style="font-size:10px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);padding:2px 8px;border-radius:8px;white-space:nowrap">Sem escala</div>'}
            </div>
            ${escalaBlock(esc, false)}
            ${setListBlock(esc)}
        </div>`;
    });

    // Recurring groups
    const recCards = Object.entries(recGroups).map(([recId, dates]) => {
        const rec = RECORRENTES.find(r=>r.id===recId);
        if (!rec) return '';
        const weekName = rec.weekday===6?'Sábados':'Quintas';
        // Dates with individual escalas
        const dateRows = dates.map(ev => {
            const esc = S.escalas[ev.id]||{};
            const hasEsc = EV_INSTR.some(({k})=>esc[k]);
            return `<div style="padding:7px 10px;border-bottom:1px solid var(--border);${dates.indexOf(ev)===dates.length-1?'border-bottom:none':''}">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                    <span style="font-size:12px;font-weight:700;color:var(--muted);min-width:60px">${fmtDate(ev.start)}</span>
                    <span style="font-size:11px;color:var(--muted)">${rec.horario}</span>
                    <span style="margin-left:auto;font-size:10px;font-weight:700;${hasEsc?'color:var(--purple-light)':'color:var(--muted)'}">
                        ${hasEsc?'✅ escalado':'—'}
                    </span>
                </div>
                ${hasEsc ? `<div style="margin-top:4px">${escalaBlock(esc, true)}</div>` : ''}
                ${setListBlock(esc)}
            </div>`;
        }).join('');
        return `<div class="rel-event-card">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
                <div style="width:10px;height:10px;border-radius:50%;background:${rec.color};flex-shrink:0"></div>
                <div>
                    <div style="font-size:15px;font-weight:800">${rec.title}</div>
                    <div style="font-size:12px;color:var(--muted)">Toda ${weekName} · ${rec.horario} · ${dates.length} ocorrência${dates.length>1?'s':''}</div>
                </div>
            </div>
            <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">${dateRows}</div>
        </div>`;
    });

    const allCards = [...eventCards, ...recCards];

    // Month selector
    const monthSelector = `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px">
        ${MESES.map((m,i)=>`<button onclick="S._relMonth=${i};render()"
            class="btn btn-sm ${selMonth===i?'btn-primary':'btn-ghost'}">${m}</button>`).join('')}
    </div>`;

    return `<div style="max-width:860px;margin:0 auto" id="rel-page">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
            <h2 style="font-size:22px;font-weight:800">📄 Relatório Mensal</h2>
            <button class="btn btn-ghost btn-sm" style="color:#22c55e;border-color:#22c55e"
                onclick="printRelatorio('${MESES[selMonth]}')">
                🖨 Imprimir / Salvar PDF
            </button>
        </div>
        ${monthSelector}
        <div id="rel-content">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:14px 18px;background:linear-gradient(90deg,rgba(0,150,63,.12),transparent);border-left:4px solid var(--purple);border-radius:0 var(--radius) var(--radius) 0">
                <div style="font-size:28px">📅</div>
                <div>
                    <div style="font-size:20px;font-weight:900">${MESES[selMonth]} 2026</div>
                    <div style="font-size:13px;color:var(--muted)">${totalEvents} atividade${totalEvents!==1?'s':''} neste mês</div>
                </div>
            </div>
            ${allCards.length === 0
                ? `<div style="text-align:center;padding:48px;color:var(--muted)">Nenhuma atividade registrada para ${MESES[selMonth]}.</div>`
                : allCards.join('')}
        </div>
    </div>`;
}

function printRelatorio(mesNome) {
    const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                   'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const selMonth = (S._relMonth !== undefined) ? S._relMonth : 0;
    const content = document.getElementById('rel-content');
    if (!content) return;

    const instrEmoji = {violao:'🎸',teclado:'🎹',bateria:'🥁',baixo:'🎸',guitarra:'🎸',sopro:'🎷',vocal1:'🎤',vocal2:'🎤',vocal3:'🎤',animador:'🎙'};
    const instrLabel = {violao:'Violão',teclado:'Teclado',bateria:'Bateria',baixo:'Baixo',guitarra:'Guitarra',sopro:'Sopro',vocal1:'Vocal 1',vocal2:'Vocal 2',vocal3:'Vocal 3',animador:'Animador'};

    // Build a clean print window
    const win = window.open('','_blank','width=900,height=700');
    const evs = EVENTOS_2026.filter(ev => parseInt(ev.start.split('-')[1])-1 === selMonth);
    const recDates = REC_2026.filter(ev => parseInt(ev.start.split('-')[1])-1 === selMonth);
    const recGroups = {};
    recDates.forEach(ev => { if (!recGroups[ev.recId]) recGroups[ev.recId]=[];  recGroups[ev.recId].push(ev); });

    function fmtD(ds) { const [y,m,d]=ds.split('-'); return `${parseInt(d)}/${parseInt(m)}/${y}`; }
    function escalaToHtml(esc) {
        if (!esc) return '<em style="color:#999">Sem escala</em>';
        const filled = EV_INSTR.filter(({k})=>esc[k]);
        if (!filled.length) return '<em style="color:#999">Sem escala definida</em>';
        return filled.map(({k})=>`<span style="display:inline-block;margin:2px 6px 2px 0;font-size:12px">${instrEmoji[k]} <b>${instrLabel[k]}:</b> ${esc[k]}</span>`).join('');
    }
    function slHtml(esc) {
        const sl = esc?.setListId && S.setlists.find(x=>x.id===esc.setListId);
        if (!sl) return '';
        const songs = (sl.blocks||[]).flatMap(b=>(b.songIds||[]).map(id=>({s:S.songs.find(x=>x.id===id),v:(b.vozes||{})[id]||''}))).filter(x=>x.s);
        if (!songs.length) return '';
        return `<div style="margin:8px 0 0;padding:8px;background:#f0faf4;border-left:3px solid #00963F;font-size:12px">
            <b style="color:#00963F">🎵 Set List:</b><br>
            ${songs.map((x,i)=>`${i+1}. ${x.s.title}${x.s.key?` (${x.s.key})`:''}${x.v?` — 🎤 ${x.v}`:''}`).join('<br>')}
        </div>`;
    }

    const evRows = evs.map(ev => {
        const esc = S.escalas[ev.id]||{};
        const multiDay = ev.start!==ev.end;
        const dt = multiDay?`${fmtD(ev.start)} a ${fmtD(ev.end)}`:fmtD(ev.start);
        return `<div class="ev-block">
            <div class="ev-title">${ev.alegrai?'⭐ ':''}${ev.title}</div>
            <div class="ev-meta">📅 ${dt}${ev.horario?' · ⏰ '+ev.horario:''}</div>
            <div class="ev-escala">${escalaToHtml(esc)}</div>
            ${slHtml(esc)}
        </div>`;
    }).join('');

    const recRows = Object.entries(recGroups).map(([recId,dates])=>{
        const rec = RECORRENTES.find(r=>r.id===recId);
        if (!rec) return '';
        const rows = dates.map(ev => {
            const esc = S.escalas[ev.id]||{};
            return `<tr>
                <td style="padding:5px 10px;font-weight:600;white-space:nowrap;border-bottom:1px solid #eee">${fmtD(ev.start)}</td>
                <td style="padding:5px 10px;border-bottom:1px solid #eee">${escalaToHtml(esc)}</td>
                <td style="padding:5px 10px;border-bottom:1px solid #eee">${slHtml(esc)}</td>
            </tr>`;
        }).join('');
        return `<div class="ev-block">
            <div class="ev-title">${rec.title}</div>
            <div class="ev-meta">Toda ${rec.weekday===6?'Sábado':'Quinta-feira'} · ${rec.horario}</div>
            <table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12px">
                <thead><tr style="background:#f5f5f5">
                    <th style="padding:5px 10px;text-align:left;font-size:11px;text-transform:uppercase;color:#666">Data</th>
                    <th style="padding:5px 10px;text-align:left;font-size:11px;text-transform:uppercase;color:#666">Escalados</th>
                    <th style="padding:5px 10px;text-align:left;font-size:11px;text-transform:uppercase;color:#666">Set List</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
    }).join('');

    win.document.write(`<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <title>Relatório ${mesNome} 2026 — Ministério de Música Hallel</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial, sans-serif; color:#1a1a1a; padding:32px; font-size:13px; }
        .header { border-bottom:3px solid #00963F; padding-bottom:16px; margin-bottom:28px; }
        .header h1 { font-size:22px; color:#00963F; margin-bottom:4px; }
        .header p { color:#666; font-size:13px; }
        .ev-block { margin-bottom:20px; padding:14px 16px; border:1px solid #e0e0e0; border-left:4px solid #00963F; border-radius:4px; page-break-inside:avoid; }
        .ev-title { font-size:16px; font-weight:700; margin-bottom:4px; }
        .ev-meta { font-size:12px; color:#666; margin-bottom:8px; }
        .ev-escala { margin-top:6px; line-height:2; }
        .footer { margin-top:40px; border-top:1px solid #e0e0e0; padding-top:12px; font-size:11px; color:#999; display:flex; justify-content:space-between; }
        @media print {
            body { padding:16px; }
            .no-print { display:none; }
        }
    </style>
    </head><body>
    <div class="header">
        <h1>📄 Relatório — ${mesNome} 2026</h1>
        <p>Ministério de Música Hallel · Gerado em ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</p>
    </div>
    <div class="no-print" style="margin-bottom:20px">
        <button onclick="window.print()" style="background:#00963F;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer">🖨 Imprimir / Salvar como PDF</button>
        <button onclick="window.close()" style="background:#eee;border:none;padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer;margin-left:8px">✕ Fechar</button>
    </div>
    ${evRows || '<p style="color:#999;font-style:italic">Nenhum evento avulso neste mês.</p>'}
    ${recRows}
    <div class="footer">
        <span>Ministério de Música Hallel — Alegraivos</span>
        <span>${mesNome} 2026</span>
    </div>
    </body></html>`);
    win.document.close();
    win.focus();
}

function openEditAtividade(id) {

function salvarAtividade(editId) {
    const titulo  = document.getElementById('na-titulo')?.value?.trim();
    const inicio  = document.getElementById('na-inicio')?.value;
    const fim     = document.getElementById('na-fim')?.value || inicio;
    const horario = document.getElementById('na-horario')?.value?.trim();
    const local   = document.getElementById('na-local')?.value?.trim();
    const obs     = document.getElementById('na-obs')?.value?.trim();
    const cor     = document.getElementById('na-cor')?.value || '#3b82f6';
    const criadoPor = S.currentMember?.name || 'ADM';
    if (!titulo) { toast('⚠️ Informe o título da atividade.'); return; }
    if (!inicio) { toast('⚠️ Informe a data de início.'); return; }
    if (editId) {
        const ev = S.eventosCustom.find(e=>e.id===editId);
        if (ev) Object.assign(ev, { title:titulo, start:inicio, end:fim, horario, local, obs, cor });
        toast('✅ Atividade atualizada!');
    } else {
        S.eventosCustom.push({ id:'evc'+uid(), title:titulo, start:inicio, end:fim, horario, local, obs, cor, criadoPor, criadoEm:Date.now() });
        toast('✅ Atividade adicionada ao calendário!');
    }
    persist(); S.modal=null; render();
}

function agendaPage() {
    const today = new Date(); today.setHours(0,0,0,0);
    const dismissed = JSON.parse(localStorage.getItem('hl_notif_dismissed')||'[]');

    // Member context: which events is the current member escalated for?
    const myEscalas = isMembro() && S.currentMember
        ? new Set(getMemberEscalas(S.currentMember.name).map(x => x.ev.id))
        : new Set();

    // Events in next 15 days (not dismissed)
    const upcoming = EVENTOS_2026.filter(ev => {
        const d = evDaysUntil(ev);
        return d >= 0 && d <= 15 && !dismissed.includes(ev.id);
    });

    // Build set of dates with events for quick lookup
    const evByDate = {};    // one-time events
    const recByDate = {};   // recurring events
    const todosEvs = [...EVENTOS_2026, ...S.eventosCustom];
    todosEvs.forEach(ev => {
        const s = new Date(ev.start+'T00:00:00');
        const e = new Date(ev.end+'T00:00:00');
        for (let d = new Date(s); d <= e; d.setDate(d.getDate()+1)) {
            const k = d.toISOString().slice(0,10);
            if (!evByDate[k]) evByDate[k] = [];
            evByDate[k].push(ev);
        }
    });
    REC_2026.forEach(ev => {
        if (!recByDate[ev.start]) recByDate[ev.start] = [];
        recByDate[ev.start].push(ev);
    });

    // Notification banner
    let notifHtml = '';
    if (upcoming.length) {
        const items = upcoming.map(ev => {
            const d = evDaysUntil(ev);
            const when = d === 0 ? 'HOJE' : d === 1 ? 'amanhã' : `em ${d} dias`;
            return `<div class="agenda-notif-item">🔔 <b>${ev.title}</b> — ${when} (${evDateLabel(ev)})<br>
            <span style="font-size:12px;opacity:.85">Esteja disponível para esta missão da Comunidade Hallel!</span></div>`;
        }).join('');
        notifHtml = `<div class="agenda-notif">
            <div class="agenda-notif-icon">⚠️</div>
            <div style="flex:1">
                <div class="agenda-notif-title">Eventos nos próximos 15 dias</div>
                ${items}
            </div>
            <button class="agenda-notif-dismiss" onclick="agendaDismiss([${upcoming.map(e=>"'"+e.id+"'").join(',')}])">✕ Dispensar</button>
        </div>`;
    }

    // Mini-calendar year (12 months)
    let calHtml = '<div class="year-grid">';
    for (let m = 0; m < 12; m++) {
        const firstDay = new Date(2026, m, 1).getDay(); // 0=Sun
        const daysInMonth = new Date(2026, m+1, 0).getDate();
        calHtml += `<div class="month-card">
            <div class="month-hd">${MESES_PT[m]}</div>
            <div class="cal-week-hd">${DIAS_PT.map(d=>`<div class="cal-wday">${d}</div>`).join('')}</div>
            <div class="cal-days">`;
        // leading blanks
        for (let i = 0; i < firstDay; i++) calHtml += '<div class="cal-day other"></div>';
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `2026-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            const isToday = dateStr === today.toISOString().slice(0,10);
            const hasEv = !!evByDate[dateStr];
            const isPast = new Date(dateStr+'T00:00:00') < today && !isToday;
            const hasRec = !!recByDate[dateStr];
            const recTip = hasRec ? recByDate[dateStr].map(e=>e.title+' ('+e.horario+')').join(', ') : '';
            const tip = [hasEv?evByDate[dateStr].map(e=>e.title).join(', '):'', recTip].filter(Boolean).join(' | ');
            const isAlegrai = hasEv && evByDate[dateStr].some(e=>e.alegrai);
            const isMissa = hasRec && recByDate[dateStr].some(e=>e.missa);
            const isMy = hasEv && evByDate[dateStr].some(e => myEscalas.has(e.id));
            const cls = [isToday?'today':'', isAlegrai?'has-alegrai':hasEv?'has-ev':'', hasRec?'has-rec':'', isMissa?'rec-missa':'', isPast?'past':'', isMy?'my-escala':''].filter(Boolean).join(' ');
            const click = (hasEv||hasRec) ? `onclick="openDayModal('${dateStr}')"` : '';
            calHtml += `<div class="cal-day ${cls}" title="${tip}" ${click}>${day}</div>`;
        }
        calHtml += '</div></div>';
    }
    calHtml += '</div>';

    // Event list grouped by month (inclui eventos criados pelo ADM)
    const evByMonth = {};
    [...EVENTOS_2026, ...S.eventosCustom].forEach(ev => {
        const mo = parseInt(ev.start.split('-')[1]) - 1;
        if (!evByMonth[mo]) evByMonth[mo] = [];
        evByMonth[mo].push(ev);
    });
    let listHtml = '';
    for (let m = 0; m < 12; m++) {
        const evs = evByMonth[m]; if (!evs) continue;
        listHtml += `<div class="ev-list-section">
            <div class="ev-month-title">📅 ${MESES_PT[m]}</div>`;
        evs.forEach(ev => {
            const d = evDaysUntil(ev);
            const isPast = d < 0;
            const isUp = d >= 0 && d <= 15;
            const esc = S.escalas[ev.id];
            const hasCl = esc?.checklist?.length > 0;
            const clDone = hasCl ? esc.checklist.filter(i=>i.done).length : 0;
            const clTotal = hasCl ? esc.checklist.length : 0;
            const isMine = myEscalas.has(ev.id);
            const alegraiBadge = ev.alegrai ? `<div style="font-size:10px;font-weight:800;background:linear-gradient(90deg,#FFD400,#F15A24);color:#fff;padding:2px 8px;border-radius:8px;white-space:nowrap">⭐ DESTAQUE</div>` : '';
            const myBadge = isMine ? `<div style="font-size:10px;font-weight:800;background:linear-gradient(90deg,var(--purple),var(--purple-light));color:#fff;padding:2px 8px;border-radius:8px;white-space:nowrap">🎯 Você está escalado</div>` : '';
            // Show team for member when escalated
            let teamHtml = '';
            if (isMine && esc) {
                const team = EV_INSTR.filter(({k})=>esc[k]).map(({k,emoji,label})=>`<span style="font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px">${instrIcon(k,12)} <b style="color:var(--text)">${esc[k]}</b></span>`);
                if (team.length) teamHtml = `<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;background:rgba(0,150,63,.06);border-radius:6px;border:1px solid rgba(0,150,63,.15)">${team.join('')}</div>`;
            }
            const isCustom = !!ev.criadoEm; // evento criado pelo ADM no app
            const corCustom = ev.cor || '#3b82f6';
            listHtml += `<div class="ev-item ${ev.alegrai?'ev-alegrai-card':''} ${isMine&&!isPast?'ev-mine':''} ${isUp&&!ev.alegrai&&!isMine?'upcoming':''} ${isPast?'past':''}" onclick="${isCustom?'':'openEvModal(\''+ev.id+'\')'}" style="cursor:${isCustom?'default':'pointer'};${isCustom?'border-left-color:'+corCustom+';':''}" >
                <div class="ev-dot" style="${isCustom?'background:'+corCustom:''}"></div>
                <div class="ev-date" style="${ev.alegrai?'color:#F15A24;font-weight:800':isMine?'color:var(--purple-light);font-weight:700':''}">
                    ${isMine&&!isPast?'📍 ':''} ${evDateLabel(ev)}${ev.horario?' · ⏰ '+ev.horario:''}
                </div>
                <div style="display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap">
                    <div class="ev-title" style="${isCustom?'color:'+corCustom:''}">${ev.title}${isCustom?'<span style="margin-left:6px;font-size:10px;background:rgba(255,255,255,.1);padding:1px 6px;border-radius:6px;font-weight:600">✦ sua ativ.</span>':''}</div>
                    ${isAdm()&&isCustom?`<div style="display:flex;gap:4px">
                        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openEditAtividade('${ev.id}')">${ic('edit',13)}</button>
                        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();delAtividade('${ev.id}')">${ic('trash',13)}</button>
                    </div>`:''}
                </div>
                <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                    ${alegraiBadge}
                    ${myBadge}
                    ${hasCl&&!isMembro()?`<span style="font-size:11px;color:${clDone===clTotal?'var(--purple-light)':'var(--muted)'}">✅ ${clDone}/${clTotal}</span>`:''}
                    ${isUp ? `<div class="ev-badge">${d===0?'HOJE':d===1?'amanhã':d+' dias'}</div>` : ''}
                    ${ev.local&&isCustom?`<span style="font-size:11px;color:var(--muted)">${ic('pin',11)} ${escHtml(ev.local)}</span>`:''}
                </div>
                ${teamHtml}
            </div>`;
        });
        listHtml += '</div>';
    }

    // Semanais
    const recSumHtml = `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px">
        ${RECORRENTES.map(r=>`<div style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);border-left:4px solid ${r.color}">
            <div style="width:10px;height:10px;border-radius:50%;background:${r.color};flex-shrink:0"></div>
            <div>
                <div style="font-size:13px;font-weight:700;color:${r.color}">${r.weekday===6?'Todo Sábado':'Toda Quinta'} — ${r.title}</div>
                <div style="font-size:12px;color:var(--muted)">⏰ ${r.horario}</div>
            </div>
        </div>`).join('')}
    </div>`;

    return `<div class="agenda-wrap">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px">
            <h2 style="font-size:22px;font-weight:800;display:inline-flex;align-items:center;gap:7px">${ic('agenda',20)} Agenda Hallel 2026</h2>
            ${isAdm()
                ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
                    <button class="btn btn-primary btn-sm" onclick="openEscalaPicker()">${ic('setlists',16)} Fazer Escala</button>
                    <button class="btn btn-sm" onclick="openNovaAtividade()" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff">${ic('plus',16)} Atividade</button>
                   </div>`
                : `<span style="font-size:13px;color:var(--muted)">${EVENTOS_2026.length} eventos + semanais</span>`}
        </div>
        ${recSumHtml}
        ${notifHtml}
        ${calHtml}
        <div style="margin-top:4px">${listHtml}</div>
    </div>`;
}

function openEvModal(evId) {
    const ev = EVENTOS_2026.find(e=>e.id===evId); if(!ev) return;
    S.modal = {type:'evento', data:ev}; S.evTab='escala'; render();
}

function openRecModal(recId, dateStr) {
    const rec = RECORRENTES.find(r=>r.id===recId); if(!rec) return;
    const [y,m,d] = dateStr.split('-');
    const label = `${parseInt(d)}/${parseInt(m)} — ${rec.horario}`;
    // Reuse evento modal passing a synthetic event object
    const ev = { id: recId+'-'+dateStr, recId, title: rec.title, start: dateStr, end: dateStr,
                 horario: rec.horario, recurring: true, dateLabel: label };
    S.modal = {type:'evento', data:ev}; S.evTab='escala'; render();
}

function eventsOnDate(dateStr) {
    const evs  = [...EVENTOS_2026, ...S.eventosCustom].filter(ev => dateStr >= ev.start && dateStr <= ev.end);
    const recs = REC_2026.filter(e => e.start === dateStr);
    return { evs, recs };
}

function openDayModal(dateStr) {
    const { evs, recs } = eventsOnDate(dateStr);
    const total = evs.length + recs.length;
    if (total === 0) return;
    if (total === 1) {                       // só um evento → abre direto
        if (evs.length) openEvModal(evs[0].id);
        else openRecModal(recs[0].recId, dateStr);
        return;
    }
    S.modal = { type:'day-picker', data:{ dateStr } };   // vários → mostra opções
    render();
}

function dayPickerModal(data) {
    const dateStr = data?.dateStr;
    if (!dateStr) return '';
    const { evs, recs } = eventsOnDate(dateStr);
    const [y,mo,d] = dateStr.split('-');
    const titulo = `${parseInt(d)} de ${MESES_PT[parseInt(mo)-1]}`;
    const rows = [...evs.map(ev=>({ev,rec:false})), ...recs.map(ev=>({ev,rec:true}))];

    function row(item) {
        const ev = item.ev;
        const esc = S.escalas[ev.id];
        const temEsc = EV_INSTR.some(({k})=>esc?.[k]);
        const onclick = item.rec ? `openRecModal('${ev.recId}','${dateStr}')` : `openEvModal('${ev.id}')`;
        const loc = (esc?.local || ev.local || '').trim();
        return `<button class="ep-row" onclick="${onclick}">
            <div class="ep-row-main">
                <div class="ep-row-title">${ev.alegrai?'⭐ ':''}${ev.title}</div>
                <div class="ep-row-meta">${ev.horario?'⏰ '+ev.horario:'📅 '+titulo}${loc?' · 📍 '+loc.replace(/</g,'&lt;'):''}</div>
            </div>
            <span class="ep-tag ${temEsc?'ok':''}">${temEsc?'✅ Com escala':'+ Escalar'}</span>
        </button>`;
    }

    return `<div class="backdrop" onclick="closeModal(event)">
    <div class="modal" style="max-width:520px">
        <div class="modal-hd">
            <div class="modal-title">📅 ${titulo}</div>
            <button class="close-btn" onclick="closeModal()">${ic('close',20)}</button>
        </div>
        <div class="modal-body">
            <p style="color:var(--muted);font-size:13px;margin-bottom:14px">${rows.length} eventos neste dia — selecione para montar a escala.</p>
            ${rows.map(row).join('')}
        </div>
    </div></div>`;
}

function openEscalaPicker() { S.modal = {type:'escala-picker', data:{q:''}}; render(); }
function escalaPickerSearch(v) { if (S.modal?.type==='escala-picker') { S.modal.data.q = v; render(); } }

function escalaPickerModal(data) {
    const q = (data?.q || '').toLowerCase().trim();
    const today = new Date(); today.setHours(0,0,0,0);

    // Eventos avulsos: futuros primeiro, depois passados
    const evs = EVENTOS_2026
        .filter(ev => !q || ev.title.toLowerCase().includes(q))
        .map(ev => ({ ev, d: evDaysUntil(ev) }))
        .sort((a,b) => {
            const af = a.d >= 0, bf = b.d >= 0;
            if (af !== bf) return af ? -1 : 1;       // futuros antes
            return af ? a.d - b.d : b.d - a.d;        // futuros asc, passados desc
        });

    // Próximas datas dos cultos semanais
    const recNext = RECORRENTES.map(r => {
        const next = REC_2026.filter(e => e.recId===r.id && evDaysUntil(e) >= 0)
            .sort((a,b)=>a.start.localeCompare(b.start))[0];
        return next ? { rec:r, ev:next } : null;
    }).filter(Boolean).filter(x => !q || x.rec.title.toLowerCase().includes(q));

    function evRow(ev, d) {
        const esc = S.escalas[ev.id];
        const temEsc = EV_INSTR.some(({k})=>esc?.[k]);
        const passou = d < 0;
        const quando = d === 0 ? 'HOJE' : d === 1 ? 'amanhã' : d > 0 ? `em ${d} dias` : `${evDateLabel(ev)}`;
        return `<button class="ep-row" onclick="openEvModal('${ev.id}')" ${passou?'style="opacity:.6"':''}>
            <div class="ep-row-main">
                <div class="ep-row-title">${ev.alegrai?'⭐ ':''}${ev.title}</div>
                <div class="ep-row-meta">📅 ${evDateLabel(ev)}${ev.horario?' · ⏰ '+ev.horario:''}${d>=0?` · <b style="color:var(--purple-light)">${quando}</b>`:''}</div>
            </div>
            <span class="ep-tag ${temEsc?'ok':''}">${temEsc?'✅ Com escala':'+ Escalar'}</span>
        </button>`;
    }

    return `<div class="backdrop" onclick="closeModal(event)">
    <div class="modal" style="max-width:560px">
        <div class="modal-hd">
            <div class="modal-title">Fazer Escala</div>
            <button class="close-btn" onclick="closeModal()">${ic('close',20)}</button>
        </div>
        <div class="modal-body">
            <p style="color:var(--muted);font-size:13px;margin-bottom:12px">Selecione o evento para montar a escala.</p>
            <input class="field" type="text" placeholder="🔍 Buscar evento…" value="${(data?.q||'').replace(/"/g,'&quot;')}"
                oninput="escalaPickerSearch(this.value)" style="margin-bottom:16px">
            ${recNext.length ? `<div class="ep-section">Cultos semanais (próxima data)</div>
                ${recNext.map(x => evRow(x.ev, evDaysUntil(x.ev))).join('')}` : ''}
            <div class="ep-section">Eventos</div>
            ${evs.length ? evs.map(({ev,d}) => evRow(ev,d)).join('')
                : `<div style="text-align:center;color:var(--muted);padding:24px;font-size:13px">Nenhum evento encontrado.</div>`}
        </div>
    </div></div>`;
}

const EV_INSTR = [
    {k:'violao',emoji:'🎸',label:'Violão'},{k:'teclado',emoji:'🎹',label:'Teclado'},
    {k:'bateria',emoji:'🥁',label:'Bateria'},{k:'baixo',emoji:'🎸',label:'Baixo'},
    {k:'guitarra',emoji:'🎸',label:'Guitarra'},{k:'sopro',emoji:'🎷',label:'Sopro'},
    {k:'vocal1',emoji:'🎤',label:'Vocal 1'},{k:'vocal2',emoji:'🎤',label:'Vocal 2'},
    {k:'vocal3',emoji:'🎤',label:'Vocal 3'},{k:'salmo',emoji:'📖',label:'Salmo'},
    {k:'animador',emoji:'🎙',label:'Animador'},{k:'sobreaviso',emoji:'🔔',label:'Sobreaviso'},
];

function eventoModal(ev) {
    const esc = S.escalas[ev.id] || {};
    const cl  = esc.checklist || [];
    const tab = S.evTab;
    const done = cl.filter(i=>i.done).length;
    const hasEsc = EV_INSTR.some(({k})=>esc[k]);

    // ── Escala: ADM edits, others read-only ──────────────────────────────
    let escalaHtml = '';
    if (isAdm()) {
        const membersWithLogin = S.members.filter(m => m.user && m.pass);
        const dlId = 'dl-ev-'+ev.id;
        const linkedSl = S.escalas[ev.id]?.setListId && S.setlists.find(x=>x.id===S.escalas[ev.id].setListId);
        escalaHtml = `
        <datalist id="${dlId}">${membersWithLogin.map(m=>`<option value="${m.name}">`).join('')}</datalist>

            ${EV_INSTR.map(({k,emoji,label})=>{
                const instrMatch = membersWithLogin.filter(m => {
                    const instrs = m.instruments || (m.instrument ? [m.instrument] : []);
                    if (k==='vocal1'||k==='vocal2'||k==='vocal3') return instrs.some(i=>i==='vocal1'||i==='vocal2'||i==='vocal3');
                    return instrs.includes(k);
                });
                const thisDl = instrMatch.length ? `dl-${k}-${ev.id}` : dlId;
                const cst = (esc.confirmacoes||{})[esc[k]];
                const cbadge = esc[k] ? (cst==='sim'
                    ? `<span style="font-size:10px;color:#22c55e;font-weight:700;white-space:nowrap">✅</span>`
                    : cst==='nao'
                    ? `<span style="font-size:10px;color:#ef4444;font-weight:700;white-space:nowrap">❌</span>`
                    : `<span style="font-size:10px;color:var(--muted);white-space:nowrap">⏳</span>`) : '';
                return `${instrMatch.length?`<datalist id="${thisDl}">${instrMatch.map(m=>`<option value="${m.name}">`).join('')}</datalist>`:''}
                <div class="escal-row">
                    <div class="escal-inst">${instrIcon(k,15)} ${label} ${cbadge}</div>
                    <input class="escal-input" type="text" placeholder="—" list="${thisDl}"
                        value="${(esc[k]||'').replace(/"/g,'&quot;')}"
                        onchange="saveEvEscalado('${ev.id}','${k}',this.value)"
                        onblur="saveEvEscalado('${ev.id}','${k}',this.value)">
                </div>`;
            }).join('')}
        </div>
        ${membersWithLogin.length===0?`<div style="background:rgba(241,90,36,.08);border:1px solid rgba(241,90,36,.25);border-radius:8px;padding:10px 12px;font-size:12px;color:#f97316;margin-bottom:12px">
            ⚠️ Nenhum membro com acesso cadastrado ainda. <button class="btn btn-ghost btn-sm" style="color:#f97316;border-color:#f97316;margin-left:6px" onclick="closeModal();nav('membros')">Cadastrar membros →</button>
        </div>`:''}
        ${membersWithLogin.length>0&&membersWithLogin.length<S.members.length?`<div style="background:rgba(255,212,0,.07);border:1px solid rgba(255,212,0,.2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted);margin-bottom:12px">
            💡 Sugestões: apenas membros com acesso (${membersWithLogin.length}/${S.members.length})
        </div>`:''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
            <button class="btn btn-primary" style="flex:1;min-width:160px" onclick="gerarChecklist('${ev.id}')">
                ${ic('check',16)} ${cl.length?'Atualizar Checklist':'Gerar Checklist'}
            </button>
            ${linkedSl
                ? `<button class="btn" style="flex:1;min-width:160px;background:#1a7a3c;color:#fff;display:flex;align-items:center;gap:6px;justify-content:center" onclick="verSetListDoEvento('${ev.id}')">${ic('setlists',15)} Ver Set List</button>`
                : `<button class="btn btn-ghost btn-sm" style="flex:1;min-width:160px;border:1px solid var(--purple);color:var(--purple-light)" onclick="subirParaSetList('${ev.id}')">${ic('setlists',15)} Subir para Set List</button>`}
        </div>
        ${hasEsc ? `<button class="btn btn-sm" style="margin-top:10px;width:100%;background:#25d366;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:7px" onclick="openWaEscala('${ev.id}')">
            ${ic('whatsapp',16)} Notificar escalados via WhatsApp
        </button>
        <button class="btn btn-sm btn-ghost" style="margin-top:8px;width:100%;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border)" onclick="exportarEscalaPDF('${ev.id}')">
            ${ic('print',15)} Exportar escala em PDF
        </button>` : ''}`;
    } else {
        // Read-only view for membros/geral
        const myName = S.currentMember?.name?.toLowerCase() || '';
        const filled = EV_INSTR.filter(({k})=>esc[k]);
        const conf = esc.confirmacoes || {};
        const souEscalado = myName && filled.some(({k})=>(esc[k]||'').toLowerCase().includes(myName));
        const meuStatus = S.currentMember ? conf[S.currentMember.name] : null;
        const confBadge = (nome)=>{
            const st = conf[nome];
            if (st==='sim') return `<span style="font-size:11px;color:#22c55e;font-weight:700;white-space:nowrap">✅ confirmou</span>`;
            if (st==='nao') return `<span style="font-size:11px;color:#ef4444;font-weight:700;white-space:nowrap">❌ não vai</span>`;
            return `<span style="font-size:11px;color:var(--muted);white-space:nowrap">⏳ aguardando</span>`;
        };
        escalaHtml = `
        <div class="escal-grid" style="margin-bottom:12px">
            ${filled.length === 0
                ? `<div style="color:var(--muted);font-size:13px;font-style:italic;padding:10px 0">Escala ainda não definida para este evento.</div>`
                : filled.map(({k,emoji,label})=>{
                    const val = esc[k]||'';
                    const isMine = myName && val.toLowerCase().includes(myName);

                        </div>
                    </div>`;
                }).join('')}
        </div>
        ${souEscalado ? `<div style="background:${meuStatus==='sim'?'rgba(34,197,94,.1)':meuStatus==='nao'?'rgba(239,68,68,.1)':'rgba(255,212,0,.08)'};border:1px solid ${meuStatus==='sim'?'rgba(34,197,94,.35)':meuStatus==='nao'?'rgba(239,68,68,.35)':'rgba(255,212,0,.25)'};border-radius:10px;padding:12px 14px;margin-bottom:12px">
            <div style="font-size:13px;font-weight:700;margin-bottom:${meuStatus?'6px':'10px'}">${meuStatus==='sim'?'✅ Você confirmou presença!':meuStatus==='nao'?'❌ Você marcou que não poderá ir.':'🎯 Você está escalado neste evento. Pode confirmar?'}</div>
            <div style="display:flex;gap:8px">
                <button class="btn btn-sm" style="flex:1;background:${meuStatus==='sim'?'#16a34a':'var(--bg4)'};color:${meuStatus==='sim'?'#fff':'var(--text)'};font-weight:700;border:1px solid ${meuStatus==='sim'?'#16a34a':'var(--border)'}" onclick="confirmarPresenca('${ev.id}','sim')">✅ Confirmar</button>
                <button class="btn btn-sm" style="flex:1;background:${meuStatus==='nao'?'#dc2626':'var(--bg4)'};color:${meuStatus==='nao'?'#fff':'var(--text)'};font-weight:700;border:1px solid ${meuStatus==='nao'?'#dc2626':'var(--border)'}" onclick="confirmarPresenca('${ev.id}','nao')">❌ Não poderei</button>
            </div>
        </div>` : ''}`;
    }

    // ── Checklist ────────────────────────────────────────────────────────
    const checkHtml = cl.length === 0
        ? `<div style="padding:28px;text-align:center;color:var(--muted)">
            Nenhum item ainda.${isAdm()?`<br><br><button class="btn btn-ghost btn-sm" onclick="setEvTab('escala')">← Preencha a Escala primeiro</button>`:''}
           </div>`
        : `<div style="margin-bottom:12px;display:flex;align-items:center;gap:8px">
            <span style="font-size:13px;color:var(--muted)">${done}/${cl.length} concluídos</span>
            <div style="flex:1;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${cl.length?Math.round(done/cl.length*100):0}%;background:var(--purple);transition:width .3s"></div>
            </div>
           </div>
           <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
               ${cl.map(item=>`
               <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:var(--radius-sm);border:1px solid ${item.done?'var(--purple)':'var(--border)'}">
                   <input type="checkbox" ${item.done?'checked':''} onchange="toggleCheckItem('${ev.id}','${item.id}')"
                       style="width:18px;height:18px;accent-color:var(--purple);cursor:pointer;flex-shrink:0">
                   <span style="flex:1;font-size:13px;${item.done?'text-decoration:line-through;color:var(--muted)':''}">${item.text}</span>
                   ${isAdm()?`<button class="btn btn-ghost btn-sm btn-icon" onclick="deleteCheckItem('${ev.id}','${item.id}')">✕</button>`:''}
               </div>`).join('')}
           </div>
           ${isAdm()?`<div style="display:flex;gap:8px">
               <input class="field" id="new-check-input" placeholder="Adicionar tarefa…" style="flex:1"
                   onkeydown="if(event.key==='Enter')addCheckItem('${ev.id}')">
               <button class="btn btn-ghost btn-sm" onclick="addCheckItem('${ev.id}')">+ Adicionar</button>
           </div>`:''}`;

    // ── Local / Endereço ─────────────────────────────────────────────────
    const local = (esc.local || ev.local || '').trim();
    let localHtml = `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px">${ic('pin',13)} Local do evento</div>`;
    if (isAdm()) {
        localHtml += `<input class="field" type="text" placeholder="Ex: Rua das Flores, 123 — Centro, Cidade"
            value="${local.replace(/"/g,'&quot;')}"
            onchange="saveEvLocal('${ev.id}',this.value)" onblur="saveEvLocal('${ev.id}',this.value)"
            style="margin-bottom:${local?'10px':'0'}">`;
    } else if (local) {
        localHtml += `<div style="font-size:14px;color:var(--text);margin-bottom:10px;line-height:1.4">${local.replace(/</g,'&lt;')}</div>`;
    } else {
        localHtml += `<div style="font-size:13px;color:var(--muted);font-style:italic">Local ainda não informado.</div>`;
    }
    if (local) localHtml += mapButtons(local);
    localHtml += `</div>`;

    return `<div class="backdrop" onclick="closeModal(event)">
    <div class="modal" style="max-width:600px">
        <div class="modal-hd">
            <div style="flex:1">
                <div class="modal-title">${ev.recurring?ic('repeat',18):ic('agenda',18)} ${ev.title}</div>
                <div style="font-size:13px;color:var(--muted);margin-top:2px">
                    ${ev.dateLabel || evDateLabel(ev)}
                    ${ev.horario?` · ⏰ ${ev.horario}`:''}
                    ${ev.recurring?` · <span style="color:var(--gold)">Evento semanal</span>`:''}
                </div>
            </div>
            <button class="close-btn" onclick="closeModal()">${ic('close',20)}</button>
        </div>
        <div class="modal-body">
            ${localHtml}
            <div style="display:flex;gap:4px;margin-bottom:16px">
                <button class="btn ${tab==='escala'?'btn-primary':'btn-ghost'} btn-sm" onclick="setEvTab('escala')">${ic('membros',15)} Escala</button>
                <button class="btn ${tab==='checklist'?'btn-primary':'btn-ghost'} btn-sm" onclick="setEvTab('checklist')">
                    ${ic('check',15)} Checklist ${cl.length?`<span style="background:rgba(255,255,255,.25);border-radius:8px;padding:0 6px;font-size:11px">${done}/${cl.length}</span>`:''}
                </button>
            </div>
            ${tab==='escala' ? escalaHtml : checkHtml}
            ${tab==='escala' ? repertorioEventoHtml(ev.id) : ''}
            ${tab==='escala' ? comentariosHtml('event:'+ev.id) : ''}
        </div>
    </div></div>`;
}

function setEvTab(tab) { S.evTab=tab; render(); }

// ── WhatsApp Escala ──────────────────────────────────────────────────────
function openWaEscala(evId) {
    S.modal = { type: 'wa-escala', data: { evId } };
    render();
}

function waEscalaModal({ evId }) {
    const ev  = EVENTOS_2026.find(e=>e.id===evId) || REC_2026.find(e=>e.id===evId);
    const esc = S.escalas[evId] || {};
    if (!ev) return '';

    const instrEmoji = {violao:'🎸',teclado:'🎹',bateria:'🥁',baixo:'🎸',guitarra:'🎸',sopro:'🎷',vocal1:'🎤',vocal2:'🎤',vocal3:'🎤',animador:'🎙'};
    const instrLabel = {violao:'Violão',teclado:'Teclado',bateria:'Bateria',baixo:'Baixo',guitarra:'Guitarra',sopro:'Sopro',vocal1:'Vocal 1',vocal2:'Vocal 2',vocal3:'Vocal 3',animador:'Animador'};

    const dateStr = evDateLabel(ev);
    const horario = ev.horario || '';

    // Full team list (filled slots only)
    const teamLines = EV_INSTR.filter(({k})=>esc[k])
        .map(({k})=>`${instrEmoji[k]} *${instrLabel[k]}:* ${esc[k]}`);

    // ── Group message ────────────────────────────────────────────────────
    const groupMsg =
`🎼 *ESCALA — ${ev.title.toUpperCase()}*
📅 ${dateStr}${horario ? `\n⏰ ${horario}` : ''}

${teamLines.join('\n')}

Preparados para servir! 🙌🏻
_— Ministério de Música Hallel_`;

    const groupUrl = `https://wa.me/?text=${encodeURIComponent(groupMsg)}`;

    // ── Individual messages ──────────────────────────────────────────────
    const individuals = EV_INSTR.filter(({k})=>esc[k]).map(({k}) => {
        const name = esc[k];
        const member = S.members.find(m => m.name.toLowerCase() === name.toLowerCase());
        const phone = member?.whatsapp?.replace(/\D/g,'');
        const myRole = `${instrEmoji[k]} ${instrLabel[k]}`;

        const msg =
`Olá, *${name}*! 🎶

Você está escalado(a) para:
📅 *${ev.title}* — ${dateStr}${horario ? `\n⏰ ${horario}` : ''}

🎯 *Sua função:* ${myRole}

*Time escalado:*
${teamLines.join('\n')}

Se prepare com carinho! 🙏
_— Ministério de Música Hallel_`;

        const url = phone
            ? `https://wa.me/55${phone}?text=${encodeURIComponent(msg)}`
            : `https://wa.me/?text=${encodeURIComponent(msg)}`;

        return { name, role: myRole, phone, url, hasPhone: !!phone };
    });

    const allHavePhone = individuals.every(i=>i.hasPhone);
    const missingPhone = individuals.filter(i=>!i.hasPhone);

    return `<div class="backdrop" onclick="closeModal(event)">
    <div class="modal" style="max-width:520px">
        <div class="modal-hd">
            <div class="modal-title">${ic('whatsapp',18)} Notificar via WhatsApp</div>
            <button class="close-btn" onclick="closeModal()">${ic('close',20)}</button>
        </div>
        <div class="modal-body" style="display:flex;flex-direction:column;gap:18px">

            <!-- Mensagem para grupo -->
            <div style="background:rgba(37,211,102,.07);border:1px solid rgba(37,211,102,.25);border-radius:var(--radius);padding:16px">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
                    <span style="font-size:18px">👥</span>
                    <div>
                        <div style="font-size:14px;font-weight:800">Mensagem para o grupo</div>
                        <div style="font-size:11px;color:var(--muted)">Abre o WhatsApp — você escolhe o grupo para enviar</div>
                    </div>
                </div>
                <div style="background:var(--bg3);border-radius:8px;padding:12px;font-size:12px;font-family:monospace;color:var(--muted);white-space:pre-wrap;line-height:1.6;max-height:160px;overflow-y:auto;margin-bottom:12px">${groupMsg.replace(/\*/g,'').replace(/_/g,'')}</div>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-sm" style="background:#25d366;color:#fff;flex:1;font-weight:700" onclick="window.open('${groupUrl}','_blank')">
                        💬 Abrir no WhatsApp
                    </button>
                    <button class="btn btn-ghost btn-sm" onclick="copyWaText(${JSON.stringify(groupMsg).replace(/'/g,'&apos;')})" style="flex:1">
                        📋 Copiar texto
                    </button>
                </div>
            </div>

            <!-- Mensagens individuais -->
            <div>
                <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px">📨 Mensagem individual por escalado</div>
                <div style="display:flex;flex-direction:column;gap:8px">
                    ${individuals.map(ind=>`
                    <div style="display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid ${ind.hasPhone?'var(--border)':'rgba(239,68,68,.2)'};border-radius:var(--radius-sm);padding:10px 12px">
                        <div style="flex:1;min-width:0">
                            <div style="font-size:13px;font-weight:700">${ind.name}</div>
                            <div style="font-size:11px;color:var(--muted)">${ind.role}${ind.hasPhone?' · 📱 '+ind.phone:' · <span style="color:#f87171">sem WhatsApp</span>'}</div>
                        </div>
                        <a href="${ind.url}" target="_blank" class="btn btn-sm"
                            style="background:${ind.hasPhone?'#25d366':'var(--bg3)'};color:${ind.hasPhone?'#fff':'var(--muted)'};text-decoration:none;white-space:nowrap;flex-shrink:0">
                            ${ind.hasPhone?'💬 Enviar':'💬 Abrir'}
                        </a>
                    </div>`).join('')}
                </div>
                ${missingPhone.length ? `<div style="margin-top:10px;font-size:11px;color:#f87171">
                    ⚠️ ${missingPhone.map(i=>i.name).join(', ')} não tem WhatsApp cadastrado.
                    <a onclick="closeModal();nav('membros')" style="color:var(--gold);cursor:pointer;text-decoration:underline">Cadastrar →</a>
                </div>` : ''}
            </div>

        </div>
    </div></div>`;
}

function copyWaText(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(()=>toast('📋 Texto copiado!'));
    } else {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        toast('📋 Texto copiado!');
    }
}

function mapButtons(addr) {
    const q = encodeURIComponent(addr);
    const gmaps = `https://www.google.com/maps/search/?api=1&query=${q}`;
    const waze  = `https://www.waze.com/ul?q=${q}&navigate=yes`;
    return `<div style="display:flex;gap:8px;flex-wrap:wrap">
        <a href="${gmaps}" target="_blank" rel="noopener noreferrer" class="btn btn-sm" style="flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:6px;background:#1a73e8;color:#fff;font-weight:700;text-decoration:none">
            ${ic('map',16)} Google Maps
        </a>
        <a href="${waze}" target="_blank" rel="noopener noreferrer" class="btn btn-sm" style="flex:1;min-width:130px;display:flex;align-items:center;justify-content:center;gap:6px;background:#33ccff;color:#062d3d;font-weight:700;text-decoration:none">
            ${ic('nav',16)} Waze
        </a>
    </div>`;
}

function saveEvLocal(evId, val) {
    if (!S.escalas[evId]) S.escalas[evId] = {};
    S.escalas[evId].local = (val || '').trim();
    if (S.modal?.data?.id === evId) {
        S.modal.data = EVENTOS_2026.find(e=>e.id===evId) || REC_2026.find(e=>e.id===evId) || S.modal.data;
    }
    persist();
    render();
}

function saveEvEscalado(evId, key, val) {
    if (!S.escalas[evId]) S.escalas[evId] = {};
    S.escalas[evId][key] = val.trim();
    // Sync escalados to linked set list if it exists
    const slId = S.escalas[evId].setListId;
    if (slId) {
        const sl = S.setlists.find(x=>x.id===slId);
        if (sl) { if(!sl.escalados) sl.escalados={}; sl.escalados[key] = val.trim(); }
    }
    if (S.modal?.data?.id===evId) S.modal.data = EVENTOS_2026.find(e=>e.id===evId);
    persist();
}

function repertorioEventoHtml(evId) {
    const esc = S.escalas[evId];
    const sl = esc?.setListId && S.setlists.find(x=>x.id===esc.setListId);
    if (!sl) return '';
    const blocks = sl.blocks || [];
    const totalSongs = blocks.reduce((n,b)=>n+(b.songIds||[]).length,0);
    if (!totalSongs) {
        if (!isAdm()) return '';
        return `<div style="background:var(--bg3);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-top:14px">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px">${ic('setlists',13)} Repertório</div>
            <div style="font-size:13px;color:var(--muted);font-style:italic">Set list criado, mas ainda sem músicas. <a onclick="verSetListDoEvento('${evId}')" style="color:var(--purple-light);cursor:pointer;text-decoration:underline">Montar repertório →</a></div>
        </div>`;
    }
    let n = 0;
    const linhas = blocks.map(b => {
        const songs = (b.songIds||[]).map(id => S.songs.find(s=>s.id===id)).filter(Boolean);
        if (!songs.length) return '';
        const blockHdr = blocks.length>1 ? `<div style="font-size:11px;font-weight:700;color:var(--gold);margin:8px 0 4px">${escHtml(b.name||'Bloco')}</div>` : '';
        return blockHdr + songs.map(s => {
            n++;
            return `<div onclick="closeModal();openDetail('${s.id}')" style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer">
                <span style="font-size:12px;font-weight:800;color:var(--purple-light);min-width:18px">${n}</span>
                <div style="flex:1;min-width:0">
                    <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(s.title)}</div>
                    ${s.artist?`<div style="font-size:11px;color:var(--muted)">${escHtml(s.artist)}</div>`:''}
                </div>
                ${s.key?`<span class="key-badge" style="flex-shrink:0">${s.key}</span>`:''}
                ${s.momento?`<span style="font-size:10px;color:#4ade80;white-space:nowrap;flex-shrink:0">⛪ ${s.momento}</span>`:''}
                <span style="color:var(--muted);flex-shrink:0">›</span>
            </div>`;
        }).join('');
    }).join('');
    return `<div style="margin-top:16px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;align-items:center;gap:5px">${ic('setlists',13)} Repertório (${totalSongs})</div>
            <button class="btn btn-ghost btn-sm" style="font-size:11px;padding:3px 9px" onclick="verSetListDoEvento('${evId}')">Abrir Set List →</button>
        </div>
        ${linhas}
    </div>`;
}

function exportarEscalaPDF(evId) {
    const ev = EVENTOS_2026.find(e=>e.id===evId) || REC_2026.find(e=>e.id===evId) || (S.eventosCustom||[]).find(e=>e.id===evId);
    if (!ev) { toast('Evento não encontrado.'); return; }
    const esc = S.escalas[evId] || {};
    const conf = esc.confirmacoes || {};
    const dataLbl = ev.dateLabel || (typeof evDateLabel==='function' ? evDateLabel(ev) : (ev.start||''));
    const local = (esc.local || ev.local || '').trim();

    const statusBadge = (nome) => {
        const st = conf[nome];
        if (st==='sim') return '<span style="color:#16a34a;font-weight:700">✓ confirmado</span>';
        if (st==='nao') return '<span style="color:#dc2626;font-weight:700">✕ não vai</span>';
        return '<span style="color:#999">— aguardando</span>';
    };
    const escRows = EV_INSTR.filter(({k})=>esc[k]).map(({k,label})=>`<tr>
        <td style="padding:7px 12px;border-bottom:1px solid #eee;font-weight:700;width:140px">${label}</td>
        <td style="padding:7px 12px;border-bottom:1px solid #eee">${escHtml(esc[k])}</td>
        <td style="padding:7px 12px;border-bottom:1px solid #eee;text-align:right;font-size:12px">${statusBadge(esc[k])}</td>
    </tr>`).join('');

    // Repertório
    const sl = esc.setListId && S.setlists.find(x=>x.id===esc.setListId);
    let repHtml = '';
    if (sl) {
        let n = 0;
        const linhas = (sl.blocks||[]).map(b => {
            const songs = (b.songIds||[]).map(id=>S.songs.find(s=>s.id===id)).filter(Boolean);
            if (!songs.length) return '';
            const hdr = (sl.blocks.length>1) ? `<tr><td colspan="3" style="padding:8px 12px 3px;font-weight:700;color:#c2410c;font-size:12px">${escHtml(b.name||'Bloco')}</td></tr>` : '';
            return hdr + songs.map(s=>{ n++; return `<tr>
                <td style="padding:6px 12px;border-bottom:1px solid #eee;width:30px;font-weight:700;color:#00963F">${n}</td>
                <td style="padding:6px 12px;border-bottom:1px solid #eee">${escHtml(s.title)}${s.artist?` <span style="color:#999;font-size:11px">— ${escHtml(s.artist)}</span>`:''}${s.momento?`<br><span style="color:#16a34a;font-size:11px">⛪ ${escHtml(s.momento)}</span>`:''}</td>
                <td style="padding:6px 12px;border-bottom:1px solid #eee;text-align:right;font-weight:700">${s.key||''}</td>
            </tr>`; }).join('');
        }).join('');
        if (linhas) repHtml = `<h2 style="font-size:15px;color:#00963F;border-bottom:2px solid #e0e0e0;padding-bottom:5px;margin:26px 0 8px">🎵 Repertório</h2>
            <table style="width:100%;border-collapse:collapse;font-size:13px"><tbody>${linhas}</tbody></table>`;
    }

    const win = window.open('','_blank','width=900,height=700');
    if (!win) { toast('Permita pop-ups para exportar.'); return; }
    win.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
    <title>Escala — ${escHtml(ev.title)}</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: Arial, sans-serif; color:#1a1a1a; padding:32px; font-size:13px; }
        .header { border-bottom:3px solid #00963F; padding-bottom:16px; margin-bottom:22px; }
        .header h1 { font-size:21px; color:#00963F; margin-bottom:4px; }
        .header p { color:#555; font-size:13px; margin-top:2px; }
        table { width:100%; border-collapse:collapse; }
        h2 { page-break-after:avoid; }
        .footer { margin-top:36px; border-top:1px solid #e0e0e0; padding-top:12px; font-size:11px; color:#999; }
        @media print { body { padding:16px; } .no-print { display:none; } }
    </style></head><body>
    <div class="header">
        <h1>🎯 Escala — ${escHtml(ev.title)}</h1>
        <p>📅 ${escHtml(dataLbl)}${ev.horario?` · ⏰ ${escHtml(ev.horario)}`:''}</p>
        ${local?`<p>📍 ${escHtml(local)}</p>`:''}
        <p style="color:#999">Ministério de Música Hallel · gerado em ${new Date().toLocaleDateString('pt-BR')}</p>
    </div>
    <div class="no-print" style="margin-bottom:20px">
        <button onclick="window.print()" style="background:#00963F;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer">🖨 Imprimir / Salvar como PDF</button>
        <button onclick="window.close()" style="background:#eee;border:none;padding:10px 20px;border-radius:6px;font-size:14px;cursor:pointer;margin-left:8px">✕ Fechar</button>
    </div>
    <h2 style="font-size:15px;color:#00963F;border-bottom:2px solid #e0e0e0;padding-bottom:5px;margin-bottom:8px">👥 Equipe escalada</h2>

function criarSetListDoEvento(evId) {
    const ev = EVENTOS_2026.find(e=>e.id===evId) || REC_2026.find(e=>e.id===evId);
    if (!ev) return null;
    if (!S.escalas[evId]) S.escalas[evId] = {};
    const esc = S.escalas[evId];
    // If already linked to an existing set list, skip
    if (esc.setListId && S.setlists.find(sl=>sl.id===esc.setListId)) return null;
    const dateLabel = evDateLabel(ev);
    const newSL = {
        id: 'sl'+uid(),
        name: ev.title + ' — ' + dateLabel,
        date: ev.start,
        blocks: [{ id: 'b'+uid(), name: 'Geral', songIds: [], vozes: {} }],
        escalados: {}
    };
    EV_INSTR.forEach(({k}) => { newSL.escalados[k] = esc[k] || ''; });
    S.setlists.push(newSL);
    esc.setListId = newSL.id;
    persist();
    return newSL;
}

function verSetListDoEvento(evId) {
    const esc = S.escalas[evId];
    if (!esc?.setListId) return;
    closeModal();
    nav('setlists');
    setTimeout(() => openSL(esc.setListId), 80);
}

function subirParaSetList(evId) {
    const newSL = criarSetListDoEvento(evId);
    if (newSL) {
        render();
        toast(`📋 Set List criado: "${newSL.name}". Abra Set Lists para adicionar músicas.`);
    } else {
        toast('Set List já existe para este evento.');
    }
}

function gerarChecklist(evId) {
    const ev = EVENTOS_2026.find(e=>e.id===evId); if(!ev) return;
    if (!S.escalas[evId]) S.escalas[evId] = {};
    const esc = S.escalas[evId];
    const existing = esc.checklist || [];
    const existingTexts = new Set(existing.map(i=>i.text));
    const newItems = [];

    // Auto-items from escala
    EV_INSTR.forEach(({k,label}) => {
        const nome = esc[k];
        if (!nome) return;
        const text = `Confirmar ${label} — ${nome}`;
        if (!existingTexts.has(text)) newItems.push({id:'ck'+uid(),text,done:false});
    });

    // Default preparation items (only if not already present)
    const defaults = [
        `Preparar set list para: ${ev.title}`,
        'Verificar e montar equipamentos',
        'Passagem de som / soundcheck',
        'Oração antes do evento',
    ];
    defaults.forEach(text => {
        if (!existingTexts.has(text)) newItems.push({id:'ck'+uid(),text,done:false});
    });

    esc.checklist = [...existing, ...newItems];
    persist();
    S.evTab = 'checklist';
    render();
    toast(`✅ Checklist ${existing.length?'atualizado':'criado'} para: ${ev.title}`);
}

function toggleCheckItem(evId, itemId) {
    const cl = S.escalas[evId]?.checklist; if(!cl) return;
    const item = cl.find(i=>i.id===itemId); if(!item) return;
    item.done = !item.done;
    persist(); render();
}

function addCheckItem(evId) {
    const input = document.getElementById('new-check-input');
    const text = input?.value?.trim(); if(!text) return;
    if (!S.escalas[evId]) S.escalas[evId] = {};
    if (!S.escalas[evId].checklist) S.escalas[evId].checklist = [];
    S.escalas[evId].checklist.push({id:'ck'+uid(), text, done:false});
    persist(); render();
}

function deleteCheckItem(evId, itemId) {
    const esc = S.escalas[evId]; if(!esc?.checklist) return;
    esc.checklist = esc.checklist.filter(i=>i.id!==itemId);
    persist(); render();
}

function agendaDismiss(ids) {
    const dismissed = JSON.parse(localStorage.getItem('hl_notif_dismissed')||'[]');
    ids.forEach(id => { if (!dismissed.includes(id)) dismissed.push(id); });
    localStorage.setItem('hl_notif_dismissed', JSON.stringify(dismissed));
    render();
}

function plSongs() {
    const plat = S.pl.platform;
    const hasUrl = s => {
        if (plat === 'youtube') return !!ytId(s.youtubeUrl);
        if (plat === 'spotify') return !!spId(s.spotifyUrl);
        if (plat === 'deezer')  return !!dzId(s.deezerUrl);
        return false;
    };
    if (S.pl.source === 'all') return S.songs.filter(hasUrl);
    const sl = S.setlists.find(x => x.id === S.pl.source);
    if (!sl) return S.songs.filter(hasUrl);
    const allIds = (sl.blocks||[]).flatMap(b=>b.songIds||[]);
    return allIds.map(id => S.songs.find(s => s.id === id)).filter(Boolean).filter(hasUrl);
}

function plInfoHtml(song) {
    if (!song) return '<div style="color:var(--muted);font-size:14px">Nenhuma música selecionada</div>';
    return `<div style="flex:1">
        <div class="pl-now-title">${song.title}</div>
        ${song.artist ? `<div class="pl-now-artist">${song.artist}</div>` : ''}
        <div class="pl-now-meta">
            ${song.key  ? `<span class="tag tag-bpm" style="color:var(--gold)">Tom: ${song.key}</span>` : ''}
            ${song.bpm  ? `<span class="tag tag-bpm">♩ ${song.bpm} BPM</span>` : ''}

    </div>`;
}

function afterPLRender() {
    if (S.pl.platform !== 'youtube') return;
    const div = document.getElementById('pl-yt-div');
    if (!div) return;
    const songs = plSongs();
    const song  = songs[S.pl.idx];

        ytPL = new YT.Player('pl-yt-div', {

// ── Playlist actions ──
function plSetPlatform(p) { ytPL = null; S.pl.platform = p; S.pl.idx = 0; render(); }
function plSetSource(v)   { ytPL = null; S.pl.source = v;   S.pl.idx = 0; render(); }
function plFromSL(slId)   { ytPL = null; S.pl.source = slId; S.pl.idx = 0; S.modal = null; S.page = 'playlist'; render(); }

function plGoTo(idx) {
    const songs = plSongs();
    if (idx < 0 || idx >= songs.length) return;
    S.pl.idx = idx;
    const song = songs[idx];
    const plat = S.pl.platform;

    // Update player without full re-render
    if (plat === 'youtube' && ytPL && ytPL.loadVideoById) {
        const vid = ytId(song.youtubeUrl);
        if (vid) ytPL.loadVideoById(vid);
    } else if ((plat === 'spotify' || plat === 'deezer') && song) {
        const iframe = document.getElementById('pl-embed');
        if (iframe) {
            const src = plat === 'spotify'
                ? `https://open.spotify.com/embed/track/${spId(song.spotifyUrl)}`
                : `https://widget.deezer.com/widget/dark/track/${dzId(song.deezerUrl)}`;
            iframe.src = src;
        }
    }

    // Patch info bar
    const infoEl = document.getElementById('pl-info');
    if (infoEl) infoEl.innerHTML = plInfoHtml(song);

    // Patch counter
    const ctrEl = document.getElementById('pl-counter');
    if (ctrEl) ctrEl.textContent = `${idx+1} / ${songs.length}`;

    // Patch prev/next buttons
    const prev = document.getElementById('pl-prev');
    const next = document.getElementById('pl-next');
    if (prev) prev.disabled = idx === 0;
    if (next) next.disabled = idx >= songs.length - 1;

    // Patch queue highlight
    document.querySelectorAll('.pl-q-item').forEach((el, i) => {
        el.classList.toggle('now', i === idx);
        el.querySelector('.pl-q-num').textContent = i === idx ? '▶' : i + 1;
        if (i === idx) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
}

function plNext() { plGoTo(S.pl.idx + 1); }
function plPrev() { plGoTo(S.pl.idx - 1); }

async function initMixer(songId, stemsPath) {
    if (MIXERS[songId]) { showMixerUI(songId); return; }

    // Esconde botão, mostra barra de progresso
    const loadBtn = document.getElementById(`mixer-load-btn-${songId}`);
    const progWrap = document.getElementById(`mixer-prog-wrap-${songId}`);
    const progBar  = document.getElementById(`mixer-prog-bar-${songId}`);
    const progLabel= document.getElementById(`mixer-prog-label-${songId}`);
    if (loadBtn) loadBtn.style.display = 'none';
    if (progWrap) progWrap.style.display = 'block';

    const stemNames = Object.keys(STEM_META);
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const tracks = [];
    let loaded = 0;

    // Carrega um stem por vez para mostrar progresso real
    for (const name of stemNames) {
        try {
            const res = await fetch(`${stemsPath}/${name}.mp3`);
            if (!res.ok) continue;
            const buf = await res.arrayBuffer();
            const decoded = await ctx.decodeAudioData(buf);
            const gain = ctx.createGain();
            gain.connect(ctx.destination);
            tracks.push({ name, decoded, gain, muted: false, solo: false, vol: 1 });
            loaded++;
            const pct = Math.round((loaded / stemNames.length) * 100);
            if (progBar)   progBar.style.width = pct + '%';
            if (progLabel) progLabel.textContent = `Carregando… ${loaded} de ${stemNames.length}`;
        } catch { /* stem não existe, pula */ }
    }

    if (!tracks.length) {
        if (progLabel) progLabel.textContent = '⚠️ Stems não encontrados.';
        return;
    }

    MIXERS[songId] = { ctx, tracks, playing: false, startTime: 0, offset: 0,
        duration: tracks[0].decoded.duration, raf: null };
    buildMixerUI(songId);
    showMixerUI(songId);
}

function buildMixerUI(songId) {
    const m = MIXERS[songId];
    const stemsEl = document.getElementById(`mixer-stems-${songId}`);
    if (!stemsEl) return;
    stemsEl.innerHTML = m.tracks.map(t => {
        const meta = STEM_META[t.name] || { label: t.name };
        return `<div class="stem-row" id="stemrow-${songId}-${t.name}">
            ${stemChip(t.name)}
            <div class="stem-name-vol">
                <span class="stem-name">${meta.label}</span>
                <input type="range" class="stem-vol" min="0" max="1" step="0.01" value="1"
                    oninput="stemVol('${songId}','${t.name}',this.value)">
            </div>
            <button class="stem-btn" id="stem-m-${songId}-${t.name}" onclick="stemMute('${songId}','${t.name}')">M</button>
            <button class="stem-btn" id="stem-s-${songId}-${t.name}" onclick="stemSolo('${songId}','${t.name}')">S</button>
        </div>`;
    }).join('');
    updateMixerTime(songId);
}

function showMixerUI(songId) {
    const progWrap = document.getElementById(`mixer-prog-wrap-${songId}`);
    const ui = document.getElementById(`mixer-ui-${songId}`);
    if (progWrap) progWrap.style.display = 'none';
    if (ui) ui.style.display = 'block';
}

function mixerToggle(songId) {
    const m = MIXERS[songId];
    if (!m) return;
    if (m.playing) { mixerPause(songId); } else { mixerPlay(songId); }
}

function mixerPlay(songId) {
    const m = MIXERS[songId];
    if (!m || m.playing) return;
    if (m.ctx.state === 'suspended') m.ctx.resume();
    const when = m.ctx.currentTime;
    m.sources = m.tracks.map(t => {
        const src = m.ctx.createBufferSource();
        src.buffer = t.decoded;
        src.connect(t.gain);
        src.start(when, m.offset);
        return src;
    });
    m.startTime = when - m.offset;
    m.playing = true;
    document.getElementById(`mixer-play-${songId}`).textContent = '⏸';
    mixerTick(songId);
}

function mixerPause(songId) {
    const m = MIXERS[songId];
    if (!m || !m.playing) return;
    m.offset = m.ctx.currentTime - m.startTime;
    m.sources?.forEach(s => { try { s.stop(); } catch {} });
    m.playing = false;
    cancelAnimationFrame(m.raf);
    document.getElementById(`mixer-play-${songId}`).textContent = '▶';
}

function mixerSeek(e, songId) { /* legado */ }
function mixerSeekRange(input, songId) {
    const m = MIXERS[songId];
    if (!m) return;
    m.offset = (input.value / 1000) * m.duration;
    if (m.playing) { mixerPause(songId); mixerPlay(songId); }
    updateMixerTime(songId);
}

function mixerTick(songId) {
    const m = MIXERS[songId];
    if (!m || !m.playing) return;
    updateMixerTime(songId);
    m.raf = requestAnimationFrame(() => mixerTick(songId));
}

function updateMixerTime(songId) {
    const m = MIXERS[songId];
    if (!m) return;
    const cur = Math.min(m.playing ? m.ctx.currentTime - m.startTime : m.offset, m.duration);
    const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    const pct = m.duration > 0 ? cur / m.duration : 0;
    const timeEl = document.getElementById(`mixer-time-${songId}`);
    const seekEl = document.getElementById(`mixer-prog-${songId}`);
    if (timeEl) timeEl.textContent = `${fmt(cur)} / ${fmt(m.duration)}`;
    if (seekEl) {
        seekEl.value = Math.round(pct * 1000);
        const p = pct * 100;
        seekEl.style.background = `linear-gradient(to right, var(--purple) ${p}%, var(--border) ${p}%)`;
    }
}

function stemVol(songId, name, val) {
    const m = MIXERS[songId];
    const t = m?.tracks.find(t => t.name === name);
    if (t) { t.vol = parseFloat(val); t.gain.gain.value = t.muted ? 0 : t.vol; }
    // Update slider gradient
    const el = document.querySelector(`#stemrow-${songId}-${name} .stem-vol`);
    if (el) el.style.background = `linear-gradient(to right, var(--purple) ${val*100}%, var(--border) ${val*100}%)`;
}

function stemMute(songId, name) {
    const m = MIXERS[songId];
    const t = m?.tracks.find(t => t.name === name);
    if (!t) return;
    t.muted = !t.muted;
    t.gain.gain.value = t.muted ? 0 : t.vol;
    document.getElementById(`stemrow-${songId}-${name}`)?.classList.toggle('muted', t.muted);
    document.getElementById(`stem-m-${songId}-${name}`)?.classList.toggle('on', t.muted);
}

function stemSolo(songId, name) {
    const m = MIXERS[songId];
    if (!m) return;
    const t = m.tracks.find(t => t.name === name);
    if (!t) return;
    t.solo = !t.solo;
    const anySolo = m.tracks.some(t => t.solo);
    m.tracks.forEach(tr => {
        const active = !anySolo || tr.solo;
        tr.gain.gain.value = active && !tr.muted ? tr.vol : 0;
        document.getElementById(`stemrow-${songId}-${tr.name}`)?.classList.toggle('muted', !active);
    });
    document.getElementById(`stem-s-${songId}-${name}`)?.classList.toggle('on', t.solo);
}

// Se mixer já foi carregado antes, restaura a UI sem recarregar
function maybeInitMixer(song) {
    if (!song.stemsPath || !MIXERS[song.id]) return;
    setTimeout(() => {
        const loadBtn = document.getElementById(`mixer-load-btn-${song.id}`);
        if (loadBtn) loadBtn.style.display = 'none';
        buildMixerUI(song.id);
        showMixerUI(song.id);
    }, 60);
}

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
(async () => {
    hydrate();
    // Restore logged-in member session (inclui membros que sao ADM)
    const memberId = localStorage.getItem('hl_current_member');
    if (memberId) {
        S.currentMember = S.members.find(m=>m.id===memberId) || null;
        if (!S.currentMember && S.role === 'membro') { S.role = null; localStorage.removeItem('hl_role'); }
    }
    // Remove músicas retiradas do repertório
    const removedSet = new Set(REMOVED.map(t => t.toLowerCase()));
    S.songs = S.songs.filter(s => !removedSet.has((s.title||'').toLowerCase()));
    // Adiciona músicas novas e sincroniza campos oficiais (ex: stemsPath, moisesUrl)
    SEED.forEach(seed => {
        const existing = S.songs.find(s => s.title.toLowerCase() === seed.title.toLowerCase());
        if (!existing) {
            S.songs.push(seed);
        } else {
            // Sempre sincroniza campos técnicos do seed para o local
            ['stemsPath','moisesUrl','youtubeUrl','spotifyUrl','deezerUrl'].forEach(k => {
                if (seed[k]) existing[k] = seed[k];
            });
        }
    });
    // SEED: não persiste agora — Firebase ainda não conectou
    // Os seeds são sincronizados depois que o Firestore carregar
    await openDB();
    await loadPdfIndex();
    const ytScript = document.createElement('script');
    ytScript.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(ytScript);
    render();
    if (S.role) setTimeout(() => maybeShowBirthday(), 600);
    // Firebase: conecta e carrega dados (única fonte da verdade)
    await initFirebase();
    // Após carregar do Firestore, sincroniza seeds SÓ nas músicas (nunca toca membros/outros dados)
    if (_fbCarregado) {
        let seedChanged = false;
        SEED.forEach(seed => {
            const existing = S.songs.find(s=>s.title.toLowerCase()===seed.title.toLowerCase());
            if (!existing) { S.songs.push(seed); seedChanged=true; }
            else {
                ['stemsPath','moisesUrl','youtubeUrl','spotifyUrl','deezerUrl'].forEach(k=>{
                    if (seed[k] && existing[k]!==seed[k]) { existing[k]=seed[k]; seedChanged=true; }
                });
            }
        });
        if (seedChanged && _fbDB) {
            // Passa pela transação protegida (merge de membros + músicas) — máxima segurança
            persist(true);
        }
    }
    // Backup automático diário (rede de segurança)
    setTimeout(_backupAutomatico, 4000);
    // Lembrete de ensaio (véspera/dia) após os dados carregarem
    setTimeout(_checkLembretesEnsaio, 6000);
})();

// ── Recarrega do Firestore quando o app volta ao foco ──
let _lastVisibleAt = Date.now();
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && _fbDB && S.role) {
        const mins = (Date.now() - _lastVisibleAt) / 60000;
        if (mins >= 2) carregaFirestore();
    } else {
        stopActTimer(); // salva a atividade em andamento ao minimizar/bloquear
        _lastVisibleAt = Date.now();
    }
});

// ── PWA: registra o service worker (app instalável + offline) ──
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW falhou:', err));
    });
}
