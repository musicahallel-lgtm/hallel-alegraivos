<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Hallel">
    <meta name="theme-color" content="#00963F">
    <title>Hallel — Alegraivos</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="preload" href="logo.png" as="image">
    <!-- EmailJS SDK — defer so it doesn't block first paint -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
    <style>
        :root {
            /* ── Identidade Visual Hallel ── */
            --purple:       #00963F;   /* verde esperança — cor principal */
            --purple-light: #2db85a;   /* verde claro — hover */
            --purple-dark:  #006b2d;   /* verde escuro */
            --gold:         #F15A24;   /* laranja Hallel */
            --gold-light:   #FFD400;   /* amarelo Hallel */
            --bg:   #080810;
            --bg2:  #0e0e18;
            --bg3:  #141420;
            --bg4:  #1a1a28;
            --border: #242438;
            --text:   #f0f0f0;
            --muted:  #8888a8;
            --green:  #00963F;
            --red:    #9E1C20;
            --radius: 14px;
            --radius-sm: 9px;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html { height: -webkit-fill-available; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; min-height: -webkit-fill-available;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            text-rendering: optimizeSpeed;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(118deg, #002912 0%, #00963F 58%, #a83800 100%);
            border-bottom: none;
            /* safe-area no topo: header não fica sob o notch/Dynamic Island do iPhone */
            padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
            height: calc(64px + env(safe-area-inset-top, 0px));
            position:sticky; top:0; z-index:100;
            display:flex; align-items:center; gap:16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.06) inset;
            transform: translateZ(0); /* GPU layer — prevents repaint on scroll */
            overflow-x: auto; overflow-y: hidden;
            scrollbar-width: none; /* Firefox */
        }
        .header::-webkit-scrollbar { display:none; } /* Safari/Chrome */
        .back-btn {
            display:inline-flex; align-items:center; gap:4px; flex-shrink:0;
            padding:7px 12px 7px 9px; border-radius:100px; border:1px solid rgba(255,255,255,.3);
            background:rgba(255,255,255,.14); color:#fff; cursor:pointer;
            font-size:14px; font-weight:700; font-family:inherit;
            touch-action:manipulation; transition:background-color .15s;
        }
        .back-btn:hover, .back-btn:active { background:rgba(255,255,255,.26); }
        .back-btn svg { flex-shrink:0; }
        .logo {
            display:flex; align-items:center; gap:8px; white-space:nowrap; text-decoration:none;
        }
        .logo img {
            height:48px; width:auto; object-fit:contain; flex-shrink:0;
            filter: brightness(0) invert(1);
            opacity: .92;
        }
        .logo-alegraivos {
            font-size:16px; font-weight:800; color:#fff; letter-spacing:.2px;
            text-shadow:0 1px 4px rgba(0,0,0,.5);
        }
        .nav { display:flex; gap:2px; flex:1; min-width:0; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; white-space:nowrap; -webkit-overflow-scrolling:touch; }
        .nav::-webkit-scrollbar { display:none; }
        .nav-btn {
            padding:8px 14px; border-radius:var(--radius-sm); border:none;
            background:transparent; color:rgba(255,255,255,.75); cursor:pointer;
            font-size:14px; font-weight:600;
            transition:background-color .15s, color .15s;
            touch-action:manipulation;
        }
        .nav-btn { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
        .nav-btn svg { flex-shrink:0; }
        .nav-btn:hover { background:rgba(255,255,255,.15); color:#fff; }
        .nav-btn.active { background:rgba(255,255,255,.94); color:#004d20; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.25); }
        .header-actions { display:flex; gap:8px; margin-left:auto; }

        /* ── Buttons ── */
        .btn {
            padding:10px 20px; border-radius:100px; border:none;
            cursor:pointer; font-size:14px; font-weight:700;
            transition:background-color .15s, box-shadow .15s, transform .15s, opacity .15s;
            display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
            font-family:inherit; touch-action:manipulation; letter-spacing:.2px;
        }
        .btn-primary  { background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:#fff; box-shadow:0 2px 14px rgba(0,150,63,.3); }
        .btn-primary:hover { background:linear-gradient(135deg,var(--purple-light),var(--purple)); color:#fff; box-shadow:0 4px 20px rgba(0,150,63,.45); transform:translateY(-1px); }
        .btn-gold     { background:linear-gradient(135deg,var(--gold),#c94000); color:#fff; box-shadow:0 2px 12px rgba(241,90,36,.3); }
        .btn-gold:hover { background:linear-gradient(135deg,#ff7040,var(--gold)); box-shadow:0 4px 18px rgba(241,90,36,.45); transform:translateY(-1px); }
        .btn-ghost    { background:transparent; color:var(--muted); border:1px solid var(--border); }
        .btn-ghost:hover { background:var(--bg3); color:var(--text); border-color:var(--muted); }
        .btn-danger   { background:linear-gradient(135deg,#c0262c,var(--red)); color:#fff; box-shadow:0 2px 10px rgba(158,28,32,.3); }
        .btn-danger:hover { opacity:.88; transform:translateY(-1px); }
        .btn-sm  { padding:7px 14px; font-size:13px; }
        .btn-icon{ padding:8px; border-radius:var(--radius-sm); }

        /* ── Main ── */
        .main { max-width:1200px; margin:0 auto; padding:24px 20px; }
        .section-header {
            display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;
        }
        .section-title { font-size:24px; font-weight:800; letter-spacing:-.3px; }
        .section-count {
            font-size:12px; color:var(--muted); background:var(--bg3);
            padding:3px 10px; border-radius:20px;
        }

        /* ── Toolbar ── */
        .toolbar { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
        .search-wrap { flex:1; min-width:200px; position:relative; }
        .search-wrap .si {
            position:absolute; left:12px; top:50%; transform:translateY(-50%);
            color:var(--muted); font-size:15px; pointer-events:none;
        }
        .search-input {
            width:100%; padding:11px 14px 11px 38px;
            background:var(--bg3); border:1.5px solid var(--border);
            border-radius:100px; color:var(--text); font-size:14px;
        }
        .search-input:focus { outline:none; border-color:var(--purple); box-shadow:0 0 0 3px rgba(0,150,63,.1); }
        select {
            padding:10px 12px; background:var(--bg3); border:1px solid var(--border);
            border-radius:var(--radius-sm); color:var(--text); font-size:14px; cursor:pointer;
        }
        select:focus { outline:none; border-color:var(--purple); }

        /* ── Song Grid ── */
        .songs-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px;
        }
        .song-card {
            background:linear-gradient(145deg, var(--bg2) 0%, var(--bg3) 100%);
            border:1px solid var(--border); border-left:3px solid var(--purple);
            border-radius:var(--radius); padding:16px;
            cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s; position:relative;
        }
        .song-card:hover {
            border-color:rgba(0,150,63,.5); border-left-color:var(--purple-light);
            transform:translateY(-3px);
            box-shadow:0 14px 40px rgba(0,150,63,.12), 0 4px 14px rgba(0,0,0,.45);
        }
        .card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
        .song-num {
            background:rgba(0,150,63,.16); color:var(--purple-light); width:28px; height:28px;
            border-radius:6px; display:flex; align-items:center; justify-content:center;
            font-size:12px; font-weight:800; flex-shrink:0;
            border:1px solid rgba(0,150,63,.28);
        }
        .key-badge {
            background:rgba(241,90,36,.12); color:var(--gold); padding:3px 9px;
            border-radius:100px; font-size:12px; font-weight:800;
            border:1px solid rgba(241,90,36,.2);
        }
        .song-title { font-size:17px; font-weight:800; margin-bottom:3px; letter-spacing:-.1px; }
        .song-artist { font-size:13px; color:var(--muted); margin-bottom:10px; min-height:18px; }
        .song-tags { display:flex; gap:5px; flex-wrap:wrap; }
        .tag {
            font-size:11px; padding:2px 7px; border-radius:4px;
            background:var(--bg4); color:var(--muted); font-weight:500;
        }
        .tag-yt     { color:#ff5555; }
        .tag-sp     { color:#1DB954; }
        .tag-dz     { color:#ef5466; }
        .tag-bpm    { color:var(--green); }
        .tag-pdf    { color:#60a5fa; }
        .tag-moises { color:#f97316; }
        .moises-btn {
            display:flex; align-items:center; gap:10px; padding:12px 14px;
            background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(249,115,22,.05));
            border:1px solid rgba(249,115,22,.4); border-radius:var(--radius-sm);
            text-decoration:none; color:var(--text); transition:border-color .15s, background-color .15s, opacity .15s;
        }
        .moises-btn:hover { background:linear-gradient(135deg,rgba(249,115,22,.28),rgba(249,115,22,.1)); border-color:rgba(249,115,22,.7); }
        .moises-logo { font-size:20px; }
        .moises-label { font-weight:700; font-size:14px; color:#f97316; }
        .moises-desc  { font-size:11px; color:var(--muted); margin-top:1px; }

        /* ── Set List Cards ── */
        .setlist-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px;
        }
        .setlist-card {
            background:linear-gradient(145deg, var(--bg2) 0%, var(--bg3) 100%);
            border:1px solid var(--border); border-left:3px solid var(--gold);
            border-radius:var(--radius); padding:20px;
            cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s;
        }
        .setlist-card:hover { border-color:rgba(241,90,36,.5); border-left-color:#ffd400; transform:translateY(-3px); box-shadow:0 14px 40px rgba(241,90,36,.1), 0 4px 14px rgba(0,0,0,.45); }
        .setlist-name { font-size:18px; font-weight:700; margin-bottom:4px; }
        .setlist-date { font-size:13px; color:var(--muted); margin-bottom:10px; }
        .setlist-count { font-size:13px; color:var(--purple-light); font-weight:600; }
        .setlist-preview { margin-top:10px; font-size:13px; color:var(--muted); }
        .setlist-preview div { padding:2px 0; }

        /* ── Modal ── */
        .backdrop {
            position:fixed; inset:0; background:rgba(0,0,0,.82); z-index:200;
            display:flex; align-items:flex-start; justify-content:center;
            padding:20px; overflow-y:auto;
            backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
        }
        .modal {
            background:var(--bg2); border:1px solid var(--border);
            border-radius:20px; width:100%; max-width:840px;
            margin:auto; position:relative;
            box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04) inset;
        }
        .modal-hd {
            padding:20px 24px; border-bottom:1px solid var(--border);
            display:flex; align-items:center; gap:12px; flex-wrap:wrap;
        }
        .modal-title { font-size:20px; font-weight:700; flex:1; min-width:0; }
        .modal-body { padding:24px; }
        .modal-ft {
            padding:14px 24px; border-top:1px solid var(--border);
            display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;
        }
        .close-btn {
            background:transparent; border:none; color:var(--muted);
            font-size:22px; cursor:pointer; padding:4px; line-height:1; flex-shrink:0;
        }
        .close-btn:hover { color:var(--text); }

        /* ── Form ── */
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .fg { display:flex; flex-direction:column; gap:6px; }
        .fg.full { grid-column:1/-1; }
        label { font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
        input[type=text],input[type=url],input[type=number],input[type=password],select.field,textarea {
            padding:10px 12px; background:var(--bg3); border:1px solid var(--border);
            border-radius:var(--radius-sm); color:var(--text); font-size:14px;
            font-family:inherit; width:100%;
        }
        input:focus,select.field:focus,textarea:focus { outline:none; border-color:var(--purple); }
        textarea {
            resize:vertical; min-height:130px; font-family:'Courier New',monospace;
            font-size:13px; line-height:1.7;
        }
        .divider { height:1px; background:var(--border); margin:4px 0; }

        /* ── PDF Upload Box ── */
        .pdf-upload-box {
            border:2px dashed var(--border); border-radius:var(--radius-sm);
            padding:20px; text-align:center; transition:border-color .15s, background-color .15s, opacity .15s; cursor:pointer;
            background:var(--bg3);
        }
        .pdf-upload-box:hover, .pdf-upload-box.drag { border-color:var(--purple); background:var(--bg4); }
        .pdf-upload-box input[type=file] { display:none; }
        .pdf-upload-icon { font-size:32px; margin-bottom:8px; }
        .pdf-upload-label { font-size:14px; font-weight:600; color:var(--text); margin-bottom:4px; }
        .pdf-upload-hint  { font-size:12px; color:var(--muted); }

        .pdf-badge {
            display:flex; align-items:center; gap:10px; padding:12px 14px;
            background:rgba(96,165,250,.1); border:1px solid rgba(96,165,250,.3);
            border-radius:var(--radius-sm);
        }
        .pdf-badge-icon { font-size:22px; }
        .pdf-badge-name { flex:1; font-size:13px; font-weight:600; color:#60a5fa; }
        .pdf-badge-size { font-size:11px; color:var(--muted); }

        /* ── Stem Mixer ── */
        .mixer-wrap { padding:12px; display:flex; flex-direction:column; gap:10px; }
        .mixer-load-btn {
            display:flex; align-items:center; justify-content:center; gap:10px;
            padding:18px; border-radius:var(--radius-sm); border:2px dashed var(--purple);
            background:transparent; color:var(--purple); font-size:15px; font-weight:700;
            cursor:pointer; transition:border-color .15s, background-color .15s, opacity .15s; width:100%; font-family:inherit;
        }
        .mixer-load-btn:hover { background:rgba(0,150,63,.1); }
        .mixer-progress-bar-wrap {
            padding:16px 14px; background:var(--bg4); border-radius:var(--radius-sm);
            display:none;
        }
        .mixer-progress-bar-label { font-size:13px; color:var(--muted); margin-bottom:8px; }
        .mixer-progress-bar {
            height:6px; background:var(--border); border-radius:3px; overflow:hidden;
        }
        .mixer-progress-bar-fill { height:100%; background:var(--purple); width:0%; transition:width .3s; border-radius:3px; }
        .mixer-transport {
            display:flex; align-items:center; gap:12px; padding:12px 14px;
            background:var(--bg4); border-radius:var(--radius-sm);
        }
        .mixer-play-btn {
            width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
            background:var(--purple); color:#fff; font-size:22px;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
            transition:background-color .15s, opacity .15s, transform .12s; touch-action:manipulation;
        }
        .mixer-play-btn:active { transform:scale(.93); }
        .mixer-transport { flex-direction:column; gap:12px; }
        .mixer-transport-row1 { display:flex; align-items:center; gap:12px; width:100%; }
        .mixer-time { font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; margin-left:auto; }
        .mixer-seek-input {
            -webkit-appearance:none; appearance:none;
            width:100%; height:8px; border-radius:4px; outline:none;
            background: linear-gradient(to right, var(--purple) 0%, #444 0%);
            cursor:pointer; touch-action:manipulation;
        }
        .mixer-seek-input::-webkit-slider-thumb {
            -webkit-appearance:none; width:28px; height:28px; border-radius:50%;
            background:var(--purple-light); cursor:pointer;
            box-shadow:0 2px 6px rgba(0,0,0,.4);
        }
        .mixer-stems { display:flex; flex-direction:column; gap:8px; }
        .stem-row {
            display:grid; grid-template-columns:36px 1fr auto auto;
            align-items:center; gap:11px;
            padding:11px 12px; background:var(--bg4); border-radius:var(--radius-sm);
            transition:opacity .2s;
        }
        .stem-row.muted { opacity:.3; }
        .stem-icon {
            width:36px; height:36px; border-radius:11px;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
            box-shadow:0 2px 7px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.2);
        }
        .stem-icon svg { filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.3)); }
        .stem-name-vol { display:flex; flex-direction:column; gap:6px; min-width:0; }
        .stem-name { font-size:13px; font-weight:600; color:var(--text); }
        .stem-vol {
            -webkit-appearance:none; appearance:none;
            width:100%; height:8px; border-radius:4px; outline:none;
            background: linear-gradient(to right, var(--purple) 80%, var(--border) 80%);
            cursor:pointer; touch-action:manipulation;
        }
        .stem-vol::-webkit-slider-thumb {
            -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
            background:var(--purple-light); cursor:pointer;
            box-shadow:0 2px 6px rgba(0,0,0,.4);
        }
        .stem-btn {
            min-width:48px; height:48px; border-radius:var(--radius-sm);
            border:2px solid var(--border);
            background:transparent; color:var(--muted); font-size:13px; font-weight:800;
            cursor:pointer; transition:background-color .15s, opacity .15s, transform .12s; touch-action:manipulation;
            display:flex; align-items:center; justify-content:center;
        }
        .stem-btn:active { transform:scale(.9); }
        .stem-btn.on { background:var(--purple); border-color:var(--purple); color:#fff; }
        .mixer-loading { padding:30px; text-align:center; color:var(--muted); font-size:13px; }

        /* ── Song Detail ── */
        .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
        .dsec { background:var(--bg3); border-radius:var(--radius-sm); overflow:hidden; }
        .dsec-title {
            padding:9px 14px; font-size:11px; font-weight:700; text-transform:uppercase;
            letter-spacing:.5px; color:var(--muted); border-bottom:1px solid var(--border);
            background:var(--bg4);
        }

        /* ── Cifra toggle ── */
        .cifra-toggle {
            display:flex; border-bottom:1px solid var(--border); background:var(--bg4);
        }
        .ctab {
            flex:1; padding:9px 12px; font-size:13px; font-weight:600; cursor:pointer;
            color:var(--muted); border:none; background:transparent; transition:border-color .15s, background-color .15s, color .15s, opacity .15s;
            border-bottom:2px solid transparent; margin-bottom:-1px;
        }
        .ctab:hover { color:var(--text); }
        .ctab.active { color:var(--purple-light); border-bottom-color:var(--purple); }

        /* ── Player ── */
        .player-tabs { display:flex; border-bottom:1px solid var(--border); background:var(--bg4); }
        .ptab {
            padding:10px 14px; font-size:13px; font-weight:600; cursor:pointer;
            color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px;
            transition:color .15s, background-color .15s; border:none; background:transparent;
        }
        .ptab:hover { color:var(--text); }
        .ptab.active { color:var(--purple-light); border-bottom-color:var(--purple); }
        .video-wrap { position:relative; padding-bottom:56.25%; height:0; }
        .video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
        .player-ph { padding:40px; text-align:center; color:var(--muted); font-size:14px; }

        /* ── PDF viewer ── */
        .pdf-viewer {
            width:100%; height:420px; border:none; display:block; background:#fff;
        }
        .pdf-viewer-wrap { padding:0; }
        .pdf-no-preview {
            padding:30px; text-align:center; color:var(--muted); font-size:14px;
        }
        .pdf-actions {
            padding:10px 14px; display:flex; gap:8px; align-items:center;
            border-top:1px solid var(--border); background:var(--bg4);
        }

        /* ── Chord Chart ── */
        .chord-chart {
            padding:14px 16px; font-family:'Courier New',monospace; font-size:13px;
            line-height:1.8; white-space:pre-wrap; word-break:break-word; min-height:180px;
        }
        .ch { color:var(--gold); font-weight:700; }
        .transpose-bar {
            display:flex; align-items:center; gap:8px; padding:10px 14px;
            border-top:1px solid var(--border); background:var(--bg4);
        }
        .t-label { font-size:12px; color:var(--muted); font-weight:600; }
        .t-offset { min-width:60px; text-align:center; font-size:14px; font-weight:700; color:var(--gold); }

        /* ── Links ── */
        .links-list { padding:10px; display:flex; flex-direction:column; gap:6px; }
        .link-item {
            display:flex; align-items:center; gap:10px; padding:10px 12px;
            background:var(--bg4); border-radius:var(--radius-sm); text-decoration:none;
            color:var(--text); font-size:13px; transition:border-color .15s, background-color .15s, color .15s, opacity .15s;
        }
        .link-item:hover { background:var(--border); }
        .link-label { font-weight:600; }
        .link-desc  { font-size:11px; color:var(--muted); }

        /* ── Set List Editor ── */
        .sl-editor { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
        .col-hd {
            font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;
            letter-spacing:.5px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border);
        }
        .sl-item {
            display:flex; align-items:center; gap:8px; padding:8px 12px;
            background:var(--bg3); border:1px solid var(--border);
            border-radius:var(--radius-sm); margin-bottom:6px;
        }
        .sl-num { color:var(--gold); font-weight:700; font-size:14px; min-width:22px; align-self:flex-start; padding-top:2px; }
        .sl-info { flex:1; display:flex; flex-direction:column; gap:3px; min-width:0; }
        .sl-title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .sl-voz-row { display:flex; align-items:center; gap:4px; }
        .sl-voz-input {
            background:transparent; border:none; border-bottom:1px dashed var(--border);
            color:var(--muted); font-size:11px; padding:1px 4px; outline:none;
            width:100%; min-width:0;
        }
        .sl-voz-input::placeholder { color:var(--bg4); }
        .sl-voz-input:focus { border-bottom-color:var(--purple); color:var(--text); }
        .sl-key { font-size:11px; color:var(--gold); background:var(--bg4); padding:2px 6px; border-radius:4px; align-self:flex-start; margin-top:2px; }
        .avail-list { overflow-y:auto; max-height:460px; display:flex; flex-direction:column; gap:5px; }
        .avail-item {
            display:flex; align-items:center; gap:10px; padding:10px 12px;
            background:var(--bg3); border:1px solid var(--border);
            border-radius:var(--radius-sm); cursor:pointer; transition:border-color .15s, background-color .15s, color .15s, opacity .15s;
        }
        .avail-item:hover { border-color:var(--purple); }
        .avail-item.in-list { opacity:.38; cursor:default; pointer-events:none; }

        /* New SL modal */
        .newsl-templates { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
        .newsl-tpl {
          flex:1; min-width:130px; padding:16px 12px; border-radius:var(--radius-sm);
          border:2px solid var(--border); cursor:pointer; text-align:center; transition:border-color .15s, background-color .15s, opacity .15s;
          background:var(--bg3);
        }
        .newsl-tpl:hover { border-color:var(--purple); }
        .newsl-tpl.sel { border-color:var(--purple); background:rgba(0,150,63,.12); }
        .newsl-tpl-icon { font-size:26px; margin-bottom:6px; }
        .newsl-tpl-name { font-weight:700; font-size:13px; }
        .newsl-tpl-desc { font-size:11px; color:var(--muted); margin-top:3px; line-height:1.4; }
        /* Block sections in set list editor */
        .sl-block { margin-bottom:14px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); }
        .sl-block-hd {
          display:flex; align-items:center; gap:8px; padding:9px 12px;
          background:var(--purple); color:#fff; font-weight:700; font-size:13px;
        }
        .sl-block-hd-name { flex:1; }
        .sl-block-hd-btn {
          background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:4px;
          padding:3px 7px; font-size:11px; cursor:pointer; font-weight:700;
        }
        .sl-block-hd-btn:hover { background:rgba(255,255,255,.35); }
        .sl-block-body { padding:8px; background:var(--bg3); transition:background .15s, outline .15s; }
        .sl-block-body.drag-over { background:rgba(0,150,63,.18); outline:2px dashed var(--purple); outline-offset:-2px; border-radius:4px; }
        .sl-block-empty { padding:14px 10px; color:var(--muted); font-size:12px; text-align:center; font-style:italic; }
        .avail-item { cursor:grab; user-select:none; touch-action:none; }
        .avail-item:active { cursor:grabbing; }
        .avail-item.dg-lifting { opacity:.4; }
        .drag-ghost {
            position:fixed; z-index:9999; pointer-events:none;
            background:var(--bg4); border:2px solid var(--purple);
            border-radius:10px; padding:8px 14px;
            font-size:14px; font-weight:700; color:var(--text);
            box-shadow:0 6px 24px rgba(0,0,0,.6);
            white-space:nowrap; max-width:220px; overflow:hidden; text-overflow:ellipsis;
            transform:rotate(-2deg); opacity:.93;
        }
        /* Print block */
        .print-block { margin-bottom:28px; }
        .print-block-title {
          font-size:13px; font-weight:bold; text-transform:uppercase; letter-spacing:.8px;
          color:#fff; background:#222; padding:5px 12px; border-radius:3px; margin-bottom:10px; display:inline-block;
        }
        .print-chord { font-family:'Courier New',monospace; font-size:11px; color:#555; margin-top:6px; white-space:pre-wrap; line-height:1.6; }

        /* ── Print View ── */
        .print-view {
            background:#fff; color:#111; padding:36px;
            font-family:Georgia,serif; border-radius:var(--radius-sm);
        }
        .ph { text-align:center; margin-bottom:28px; border-bottom:2px solid #222; padding-bottom:18px; }
        .ph-title { font-size:26px; font-weight:bold; margin-bottom:4px; }
        .ph-sub { font-size:13px; color:#555; }
        .plist { list-style:none; }
        .plist li {
            display:flex; align-items:center; gap:14px; padding:13px 0;
            border-bottom:1px solid #eee; font-size:15px;
        }
        .pnum {
            width:30px; height:30px; background:#111; color:#fff;
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:13px; font-weight:bold; flex-shrink:0;
        }
        .p-title { flex:1; font-weight:bold; }
        .p-key { font-size:13px; color:#555; }
        .p-bpm { font-size:12px; color:#999; }

        /* ── Meta row ── */
        .meta-row { display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
        .meta-it { display:flex; align-items:center; gap:6px; font-size:14px; }
        .meta-lb { color:var(--muted); }
        .meta-vl { font-weight:700; }
        .meta-vl.key { color:var(--gold); font-size:18px; }

        /* ── Toast ── */
        .toast {
            position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
            background:var(--bg3); border:1px solid rgba(0,150,63,.3); color:var(--text);
            padding:12px 26px; border-radius:100px; font-size:14px;
            font-weight:600; z-index:999; animation:slideUp .2s ease; white-space:nowrap;
            box-shadow:0 8px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04) inset;
        }
        @keyframes slideUp {
            from { transform:translateX(-50%) translateY(20px); opacity:0; }
            to   { transform:translateX(-50%) translateY(0);    opacity:1; }
        }

        /* ── Empty state ── */
        .empty { text-align:center; padding:60px 20px; color:var(--muted); }
        .empty .ei { font-size:48px; margin-bottom:14px; }
        .empty h3  { font-size:18px; margin-bottom:8px; color:var(--text); }
        .empty p   { font-size:14px; }

        /* ── Playlist ── */
        .pl-topbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
        .pl-tabs { display:flex; background:var(--bg3); border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); }
        .pl-tabs .ptab { border-radius:0; border-bottom:none; padding:9px 16px; }
        .pl-tabs .ptab.active { background:var(--purple); color:#fff; border-bottom-color:transparent; }
        .pl-body { display:grid; grid-template-columns:1fr 320px; gap:20px; align-items:start; }
        .pl-left { display:flex; flex-direction:column; gap:12px; }
        .pl-player-box {
            background:#000; border-radius:var(--radius); overflow:hidden;
            min-height:240px; display:flex; align-items:center; justify-content:center;
        }
        .pl-player-box .video-wrap { width:100%; }
        .pl-spotify-wrap { background:var(--bg2); border-radius:var(--radius); overflow:hidden; }
        .pl-no-media { padding:48px 20px; text-align:center; color:var(--muted); font-size:14px; }
        .pl-info-bar {
            background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
            padding:16px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
        }
        .pl-now-title  { font-size:18px; font-weight:700; }
        .pl-now-artist { font-size:13px; color:var(--muted); margin-top:2px; }
        .pl-now-meta   { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
        .pl-nav {
            background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
            padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px;
        }
        .pl-counter { font-size:13px; color:var(--muted); font-weight:600; }
        .pl-right { display:flex; flex-direction:column; }
        .pl-q-hd {
            font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;
            letter-spacing:.5px; padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:8px;
        }
        .pl-queue { max-height:540px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
        .pl-q-item {
            display:flex; align-items:center; gap:10px; padding:10px 12px;
            background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm);
            cursor:pointer; transition:border-color .15s, background-color .15s, color .15s, opacity .15s;
        }
        .pl-q-item:hover { border-color:var(--purple); background:var(--bg3); }
        .pl-q-item.now  { border-color:var(--purple); background:var(--bg4); }
        .pl-q-num { min-width:22px; text-align:center; font-size:13px; font-weight:700; color:var(--muted); }
        .pl-q-item.now .pl-q-num { color:var(--purple-light); }
        .pl-q-title { font-size:14px; font-weight:600; }
        .pl-q-artist { font-size:12px; color:var(--muted); }
        .pl-q-info { flex:1; }
        .pl-empty-q { padding:30px; text-align:center; color:var(--muted); font-size:13px; }
        #pl-yt-div { width:100%; aspect-ratio:16/9; }
        @media(max-width:840px){ .pl-body { grid-template-columns:1fr; } }

        /* ── Responsive ── */
        @media(max-width:640px){
            .form-grid,.detail-grid,.sl-editor { grid-template-columns:1fr; }
            .logo { font-size:15px; }
            .nav-btn { padding:6px 10px; font-size:13px; }
        }

        /* ── Escalados ── */
        .escal-section { margin-top:14px; }
        .escal-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
            gap:1px; background:var(--border);
            border-radius:var(--radius-sm); overflow:hidden;
        }
        .escal-row { display:flex; align-items:center; background:var(--bg3); }
        .escal-inst {
            padding:9px 10px; font-size:12px; font-weight:700; color:var(--muted);
            white-space:nowrap; display:flex; align-items:center; gap:6px;
            min-width:108px; border-right:1px solid var(--border);
        }
        .escal-input {
            background:transparent; border:none; color:var(--text);
            font-size:13px; padding:9px 10px; flex:1; outline:none; min-width:0;
        }
        .escal-input::placeholder { color:var(--bg4); }
        .escal-input:focus { background:var(--bg4); }

        /* ── Agenda ── */
        .agenda-wrap { max-width:1100px; margin:0 auto; }
        .agenda-notif {
            background:linear-gradient(135deg,#7c3a00,#c45a00);
            border-radius:var(--radius-sm); padding:14px 18px; margin-bottom:20px;
            display:flex; align-items:flex-start; gap:12px;
        }
        .agenda-notif-icon { font-size:22px; flex-shrink:0; margin-top:1px; }
        .agenda-notif-title { font-size:14px; font-weight:800; color:#fff; margin-bottom:4px; }
        .agenda-notif-item { font-size:13px; color:rgba(255,255,255,.9); margin-bottom:3px; line-height:1.5; }
        .agenda-notif-dismiss { margin-left:auto; background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; flex-shrink:0; }
        .year-grid {
            display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px;
        }
        @media(max-width:900px){ .year-grid { grid-template-columns:repeat(3,1fr); } }
        @media(max-width:600px){ .year-grid { grid-template-columns:repeat(2,1fr); } }
        .month-card { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
        .month-hd { background:var(--purple); color:#fff; text-align:center; padding:7px 4px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; }
        .cal-week-hd { display:grid; grid-template-columns:repeat(7,1fr); padding:4px 4px 2px; gap:2px; }
        .cal-wday { font-size:9px; font-weight:700; color:var(--muted); text-align:center; }
        .cal-days { display:grid; grid-template-columns:repeat(7,1fr); padding:2px 4px 6px; gap:2px; }
        .cal-day {
            aspect-ratio:1; display:flex; align-items:center; justify-content:center;
            font-size:10px; border-radius:50%; cursor:default; position:relative;
        }
        .cal-day.other { color:var(--border); }
        .cal-day.today { background:var(--gold); color:#fff; font-weight:800; border-radius:50%; }
        .cal-day.has-ev  { background:rgba(0,150,63,.25); color:var(--purple-light); font-weight:700; border-radius:4px; cursor:pointer; }
        .cal-day.has-ev.today { background:var(--gold); color:#fff; }
        .cal-day.has-rec { position:relative; cursor:pointer; }
        .cal-day.has-rec::after { content:''; position:absolute; bottom:1px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:#E85D04; }
        .cal-day.has-rec.rec-missa::after { background:#7B5EA7; }
        .cal-day.has-ev.has-rec::after { background:#fff; }
        .cal-day.past { opacity:.45; }
        /* ALEGRAI-VOS destaque */
        .cal-day.has-alegrai { background:linear-gradient(135deg,#FFD400,#F15A24); color:#fff !important; font-weight:900; border-radius:5px; cursor:pointer; box-shadow:0 0 7px rgba(241,90,36,.7); }
        .ev-alegrai-card { background:linear-gradient(135deg,rgba(255,212,0,.12),rgba(241,90,36,.12)) !important; border:2px solid #FFD400 !important; border-left:5px solid #F15A24 !important; }
        .ev-alegrai-card .ev-title { color:#F15A24 !important; font-size:15px !important; font-weight:900 !important; }
        .ev-alegrai-card .ev-dot { background:linear-gradient(135deg,#FFD400,#F15A24); width:13px; height:13px; box-shadow:0 0 5px rgba(241,90,36,.5); }
        /* Membro escalado — destaque na agenda */
        .cal-day.my-escala { background:var(--purple) !important; color:#fff !important; font-weight:900; border-radius:5px; box-shadow:0 0 6px rgba(0,150,63,.6); }
        .ev-item.ev-mine { border-color:var(--purple) !important; background:rgba(0,150,63,.08) !important; border-left:4px solid var(--purple) !important; }
        .ev-item.ev-mine .ev-dot { background:var(--purple-light); box-shadow:0 0 4px rgba(0,150,63,.5); }
        .ev-list-section { margin-bottom:10px; }
        .ev-month-title { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.7px; color:var(--muted); padding:8px 0 6px; border-bottom:1px solid var(--border); margin-bottom:8px; }
        .ev-item {
            display:flex; align-items:flex-start; gap:12px; padding:10px 14px;
            background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm);
            margin-bottom:6px; transition:border-color .15s;
        }
        .ev-item.upcoming { border-color:var(--gold); background:rgba(241,90,36,.06); }
        .ev-item.past { opacity:.5; }
        .ev-dot { width:10px; height:10px; border-radius:50%; background:var(--purple); flex-shrink:0; margin-top:4px; }
        .ev-item.upcoming .ev-dot { background:var(--gold); }
        .ev-date { font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap; min-width:52px; margin-top:2px; }
        .ev-title { font-size:13px; font-weight:600; color:var(--text); flex:1; }
        .ev-badge { font-size:10px; font-weight:700; background:var(--gold); color:#fff; padding:2px 7px; border-radius:8px; flex-shrink:0; white-space:nowrap; }

        /* ── Login Screen ── */
        .login-screen {
            min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:radial-gradient(ellipse at 50% 0%, rgba(0,150,63,.2) 0%, #060810 55%), linear-gradient(160deg, #020808 0%, #080810 100%);
            padding:20px;
        }
        .login-card {
            background:#ffffff; border:none;
            border-radius:22px;
            padding:42px 34px; width:100%; max-width:380px;
            box-shadow:0 30px 100px rgba(0,0,0,.85), 0 0 80px rgba(0,150,63,.06);
        }
        .login-logo {
            width:88px; height:88px; margin:0 auto 22px; border-radius:24px;
            background:linear-gradient(145deg,#00963F,#006b2d);
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 10px 26px rgba(0,150,63,.38), inset 0 1px 0 rgba(255,255,255,.25);
        }
        .login-logo img {
            width:56px; height:56px; object-fit:contain;
            filter:brightness(0) invert(1); opacity:.96;
        }
        .login-sub   { font-size:14px; color:#555; text-align:center; margin-bottom:28px; font-weight:600; }
        .login-field { margin-bottom:14px; }
        .login-field label { display:block; font-size:12px; font-weight:700; color:#666; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
        .login-field .field { background:#f5f5f7; border-color:#e0e0e0; color:#111; }
        .login-field .field::placeholder { color:#aaa; }
        .login-err { background:#fff0f0; border:1px solid #f87171; border-radius:9px; padding:10px 14px; font-size:13px; color:#dc2626; margin-bottom:14px; display:none; }
        .login-err.show { display:block; }
        .login-btn { width:100%; padding:14px; font-size:15px; font-weight:800; border-radius:100px; border:none; background:linear-gradient(135deg,var(--purple),var(--purple-dark)); color:#fff; cursor:pointer; margin-top:8px; box-shadow:0 4px 20px rgba(0,150,63,.35); letter-spacing:.3px; }
        .login-btn:hover { background:linear-gradient(135deg,var(--purple-light),var(--purple)); box-shadow:0 6px 28px rgba(0,150,63,.5); transform:translateY(-1px); }
        .login-forgot { text-align:center; margin-top:16px; font-size:13px; color:#888; }
        .login-forgot a { color:var(--purple-dark); cursor:pointer; text-decoration:underline; }
        .recovery-success { background:#f0fdf4; border:1px solid #86efac; border-radius:10px; padding:16px; text-align:center; font-size:13px; color:#166534; margin-top:12px; display:none; }
        .recovery-success.show { display:block; }
        /* Role badge in header */
        .role-badge {
            font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px; letter-spacing:.4px; white-space:nowrap;
        }
        .role-badge.adm    { background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.32); }
        .role-badge.geral  { background:rgba(255,212,0,.22); color:#ffe066; border:1px solid rgba(255,212,0,.4); }
        .role-badge.membro { background:rgba(200,210,255,.16); color:#d0d8ff; border:1px solid rgba(200,210,255,.32); }

        /* ── Membros page ── */
        .member-card { display:flex; align-items:center; gap:12px; padding:12px 16px; background:linear-gradient(145deg,var(--bg2),var(--bg3)); border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; transition:border-color .15s, background-color .15s, color .15s, opacity .15s; }
        .member-card:hover { border-color:rgba(0,150,63,.35); transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,0,0,.3); }
        .member-avatar { width:40px; height:40px; border-radius:50%; background:var(--purple); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
        .member-info { flex:1; min-width:0; }
        .member-name { font-size:14px; font-weight:700; color:var(--text); }
        .member-meta { font-size:12px; color:var(--muted); margin-top:2px; }
        .member-form { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
        .member-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        @media(max-width:480px) { .member-form-grid { grid-template-columns:1fr; } }

        /* ── Mission Alert ── */
        @keyframes missionPulse { 0%,100%{opacity:1} 50%{opacity:.82} }
        @keyframes missionEntry { from{opacity:0;transform:scale(.93) translateZ(0)} to{opacity:1;transform:scale(1) translateZ(0)} }
        .mission-backdrop { position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto; }
        .mission-card { background:linear-gradient(160deg,#0f1923 0%,#1a1040 100%);border:2px solid var(--gold);border-radius:20px;padding:32px 28px;max-width:500px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;margin:auto;text-align:center;animation:missionEntry .35s ease forwards;will-change:opacity;-webkit-overflow-scrolling:touch; }

const _pushSessionIds = new Set();   // ids de notificações criadas por mim nesta sessão
let _pushInit = false;

function _notifRef() { return _fbDB ? _fbDB.collection('ministerio').doc('notificacoes') : null; }

function _iniciaNotificacoes() {
    const ref = _notifRef(); if (!ref) return;
    ref.onSnapshot(snap => {
        const lista = (snap.exists && snap.data().lista) || [];
        const seen = parseInt(localStorage.getItem('hl_push_seen') || '0');
        let maxAt = seen;
        if (_pushInit && Notification.permission === 'granted') {
            lista.filter(n => n.at > seen && !_pushSessionIds.has(n.id))
                 .forEach(n => { _mostrarNotificacao(n.titulo, n.corpo); });
        }
        lista.forEach(n => { if (n.at > maxAt) maxAt = n.at; });
        if (maxAt > seen) localStorage.setItem('hl_push_seen', String(maxAt));
        _pushInit = true;
    }, err => console.warn('notificacoes:', err));
}

function _mostrarNotificacao(titulo, corpo) {
    try {
        const opts = { body: corpo || '', icon: 'icon-192.png', badge: 'icon-192.png', tag: 'hallel' };
        if (navigator.serviceWorker && navigator.serviceWorker.ready) {
            navigator.serviceWorker.ready.then(reg => reg.showNotification('🎵 ' + titulo, opts)).catch(()=>{ new Notification('🎵 '+titulo, opts); });
        } else {
            new Notification('🎵 ' + titulo, opts);
        }
    } catch(e) { console.warn('notif show:', e); }
}

// Publica uma notificação para todos os dispositivos
async function pushNotificar(titulo, corpo) {
    const ref = _notifRef(); if (!ref) return;
    try {
        const id = 'n' + uid();
        const at = Date.now();
        _pushSessionIds.add(id);
        localStorage.setItem('hl_push_seen', String(at)); // não notifica a mim mesmo
        const snap = await ref.get();
        let lista = (snap.exists && snap.data().lista) || [];
        lista.push({ id, titulo, corpo: corpo || '', at });
        lista = lista.slice(-30); // mantém só as 30 mais recentes
        await ref.set({ lista });
    } catch(e) { console.warn('pushNotificar:', e); }
}

// Pede permissão de notificação ao usuário
async function pedirNotificacoes() {
    if (!('Notification' in window)) { toast('Seu navegador não suporta notificações.'); return; }
    if (Notification.permission === 'granted') { toast('🔔 Notificações já estão ativas!'); return; }
    if (Notification.permission === 'denied') { toast('⚠️ Notificações bloqueadas. Ative nas configurações do navegador.'); return; }
    try {
        const p = await Notification.requestPermission();
        if (p === 'granted') {
            toast('🔔 Notificações ativadas! Você será avisado de avisos e ensaios.');
            _mostrarNotificacao('Notificações ativadas', 'Você receberá avisos do Ministério Hallel aqui.');
            render();
        } else {
            toast('Notificações não ativadas.');
        }
    } catch(e) { console.warn(e); }
}

// ── persist: escreve no Firestore (Firestore é a única fonte da verdade) ──
function persist(immediate) {

    _persistTimer = setTimeout(_gravaFirestore, 300);

// ═══════════════════════════════════════════════════════════════════
//  TOMBSTONES + MERGE  — blindagem contra perda de dados com vários
//  dispositivos editando ao mesmo tempo. Cada exclusão é registrada
//  (tombstone) para não "ressuscitar" no merge; cada gravação une os
//  dados do dispositivo com os da nuvem (nunca sobrescreve cego).
// ═══════════════════════════════════════════════════════════════════
function _getTombs() { try { return JSON.parse(localStorage.getItem('hl_tombstones')||'{}'); } catch { return {}; } }
function _addTomb(coll, id) {
    if (id==null) return;
    const t = _getTombs();
    t[coll] = t[coll] || [];
    if (!t[coll].includes(id)) t[coll].push(id);
    t[coll] = t[coll].slice(-500);
    localStorage.setItem('hl_tombstones', JSON.stringify(t));
}
function _rmTomb(coll, id) {
    const t = _getTombs();
    if (t[coll]) { t[coll] = t[coll].filter(x => x !== id); localStorage.setItem('hl_tombstones', JSON.stringify(t)); }
    if (coll === 'songs') { // compatibilidade com tombstone antigo de músicas
        const d = JSON.parse(localStorage.getItem('hl_deleted_songs')||'[]').filter(x => x !== id);
        localStorage.setItem('hl_deleted_songs', JSON.stringify(d));
    }
}
function _tombSet(coll) {
    const arr = (_getTombs()[coll] || []).slice();
    if (coll === 'songs') { try { JSON.parse(localStorage.getItem('hl_deleted_songs')||'[]').forEach(x=>arr.push(x)); } catch{} }
    return new Set(arr);
}
// Une dois arrays de objetos {id}: nuvem + local (local vence em conflito),
// remove os marcados como excluídos. confMerge une sub-objeto confirmacoes.
function _mergeArr(local, remote, tombs, confMerge) {
    const map = new Map();
    (remote||[]).forEach(r => { if (r && r.id != null) map.set(r.id, r); });
    (local||[]).forEach(l => {
        if (!l || l.id == null) return;
        const r = map.get(l.id);
        if (confMerge && r) map.set(l.id, { ...r, ...l, confirmacoes: { ...(r.confirmacoes||{}), ...(l.confirmacoes||{}) } });
        else map.set(l.id, l);
    });
    let arr = [...map.values()];
    if (tombs && tombs.size) arr = arr.filter(x => !tombs.has(x.id));
    return arr;
}
// Une objetos indexados por chave (escalas/availability); para escalas,
// une também o sub-objeto confirmacoes de cada evento.
function _mergeKeyed(local, remote, confMerge) {
    const out = { ...(remote||{}) };
    Object.entries(local||{}).forEach(([k, v]) => {
        if (confMerge && out[k] && v && typeof v === 'object')
            out[k] = { ...out[k], ...v, confirmacoes: { ...(out[k].confirmacoes||{}), ...(v.confirmacoes||{}) } };
        else out[k] = v;
    });
    return out;
}

async function _gravaFirestore() {
    if (!_fbDB) { _localDirty = false; return; }
    _setSyncStatus(false);

    const docRef = _fbDB.collection('ministerio').doc('dados');

    // ── TRANSACTION: leitura + merge + escrita atômicos ───────────────
    // Sem race condition: nenhum outro dispositivo pode escrever no meio
    let _merged = null;
    try {
        await _fbDB.runTransaction(async (tx) => {
            const snap = await tx.get(docRef);
            const remote = snap.exists ? snap.data() : {};

            // Trava de segurança: se local tem 0 membros mas remoto tem, aborta e restaura
            // (cobre falha de carga da nuvem — nunca grava vazio por cima de dados reais)
            if (S.members.length === 0 && (remote.members||[]).length > 0) {
                S.members = remote.members;
                throw new Error('ABORT_EMPTY_MEMBERS');
            }

            // ── MERGE de TODAS as coleções (nuvem + local, exclusões respeitadas) ──
            const m = {
                songs:         _mergeArr(S.songs,         remote.songs,         _tombSet('songs')),
                setlists:      _mergeArr(S.setlists,      remote.setlists,      _tombSet('setlists')),
                escalas:       _mergeKeyed(S.escalas,     remote.escalas, true),
                members:       _mergeArr(S.members,       remote.members,       _tombSet('members')),
                availability:  _mergeKeyed(S.availability, remote.availability),
                substitutions: _mergeArr(S.substitutions, remote.substitutions, _tombSet('substitutions')),
                financeiro:    _mergeArr(S.financeiro,    remote.financeiro,    _tombSet('financeiro')),
                inventario:    _mergeArr(S.inventario,    remote.inventario,    _tombSet('inventario')),
                avisos:        _mergeArr(S.avisos,        remote.avisos,        _tombSet('avisos')),
                eventosCustom: _mergeArr(S.eventosCustom, remote.eventosCustom, _tombSet('eventosCustom')),
                ensaios:       _mergeArr(S.ensaios,       remote.ensaios,       _tombSet('ensaios'), true),
                comentarios:   _mergeArr(S.comentarios,   remote.comentarios,   _tombSet('comentarios')),
                lixeira:       _mergeArr(S.lixeira,        remote.lixeira,       _tombSet('lixeira')),
            };

            // Atividade — une por id, mantém as 300 mais recentes
            const actMap = new Map();
            (remote.activityLog || []).forEach(a => { if (a.id) actMap.set(a.id, a); });
            (S.activityLog || []).forEach(a => { if (a.id) actMap.set(a.id, a); });
            m.activityLog = Array.from(actMap.values()).sort((a,b)=>(a.at||0)-(b.at||0)).slice(-300);

            // 🛡️ TRAVA ANTI-WIPE: nunca grava vazio/encolhido por cima de dados que
            // existem na nuvem. Se o merge resultar vazio (ou MENOR) mas a nuvem tinha
            // conteúdo, mantém o da nuvem. Protege contra cache antigo / estado parcial.
            const naoEsvazia = (k) => {
                const rem = remote[k];
                if (Array.isArray(rem) && rem.length > 0) {
                    if (!Array.isArray(m[k]) || m[k].length === 0) m[k] = rem;            // vazio → restaura nuvem
                    else if (m[k].length < rem.length && k!=='members' && k!=='songs') {} // encolheu (ok p/ exclusões via tombstone)
                } else if (rem && typeof rem==='object' && !Array.isArray(rem) && Object.keys(rem).length>0) {
                    if (!m[k] || Object.keys(m[k]).length === 0) m[k] = rem;
                }
            };
            ['members','songs','setlists','escalas','availability','substitutions',
             'financeiro','inventario','avisos','eventosCustom','ensaios','comentarios','lixeira','activityLog'].forEach(naoEsvazia);

            const ts = Date.now();
            _lastWriteTs = ts;
            _merged = m;
            tx.set(docRef, { ...m, _updatedAt: ts });
        });
        // Aplica o resultado do merge no estado local (sem roubar foco/atrapalhar digitação)
        if (_merged) {
            Object.assign(S, _merged);
            _normalize();
            if (S.currentMember) { const m=S.members.find(x=>x.id===S.currentMember.id); if(m) S.currentMember=m; }
            if (!S.modal) {
                const ae = document.activeElement;
                const digitando = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
                if (!digitando) render();
            }
        }
        _localDirty = false; _setSyncStatus(true);
    } catch(e) {
        _localDirty = false; _setSyncStatus(true);
        if (e.message === 'ABORT_EMPTY_MEMBERS') {
            render(); // re-renderiza com membros restaurados
        } else {
            console.warn('Firestore transaction:', e);
            toast('⚠️ Erro ao salvar. Verifique a conexão.');
        }
    }
}

    try {

// ── carregaFirestore: sempre carrega do Firestore ao abrir ────────
async function carregaFirestore() {
    if (!_fbDB) return;
    // Timeout de 8 segundos — se Firebase não responder, mostra o app mesmo assim
    const timeout = new Promise(res => setTimeout(() => {
        if (!_fbCarregado) { _fbCarregado = true; render(); }
        res(null);
    }, 8000));
    try {
        const snap = await Promise.race([
            _fbDB.collection('ministerio').doc('dados').get(),
            timeout.then(() => null)
        ]);
        if (!snap) return; // timeout
        if (!snap.exists) {
            // Primeira vez: nuvem vazia. Se tiver dados locais antigos, migra uma vez.
            const localSongs = (() => { try { return JSON.parse(localStorage.getItem('hl_songs')||'[]'); } catch{ return []; }})();
            if (localSongs.length) {
                const campos = ['songs','setlists','escalas','members','activityLog',
                    'availability','substitutions','financeiro','inventario','avisos','eventosCustom','ensaios','comentarios'];
                campos.forEach(k => {
                    const v = localStorage.getItem('hl_'+k.replace(/([A-Z])/g,c=>c.toLowerCase()));
                    if (v) try { S[k] = JSON.parse(v); } catch{}
                });
                _normalize();
                persist(true); // sobe para nuvem
            }
            _fbCarregado = true; render(); return;
        }
        _aplicaDados(snap.data());
        _fbCarregado = true;
        render();
        _setSyncStatus(true);
    } catch(e) { console.warn('Firestore load:', e); _fbCarregado = true; render(); }
}

// Força recarregamento do Firestore (botão ☁️ no header)
async function recarregarDados() {
    if (!_fbDB) { toast('⚠️ Sem conexão com a nuvem.'); return; }
    _setSyncStatus(false);
    await carregaFirestore();
    toast('✅ Dados atualizados!');
}

// ── BACKUP automático: 7 cópias rotativas (uma por dia da semana) ──
async function _backupAutomatico() {
    if (!_fbDB) return;
    try {
        const now = new Date();
        const slot = 'bkp-' + now.getDay();   // bkp-0 (dom) ... bkp-6 (sáb)
        const hoje = now.toISOString().slice(0,10);
        const bkpRef = _fbDB.collection('ministerio').doc(slot);
        const existe = await bkpRef.get();
        if (existe.exists && existe.data()._backupDate === hoje) return; // já tem hoje
        const dados = await _fbDB.collection('ministerio').doc('dados').get();
        if (dados.exists && (dados.data().members||[]).length > 0) {
            await bkpRef.set({ ...dados.data(), _backupDate: hoje, _backupAt: Date.now() });
            console.log('[BACKUP] slot', slot, 'salvo para', hoje);
        }
    } catch(e) { console.warn('backup:', e); }
}

// ── Baixar backup manual (arquivo JSON) ──
function baixarBackup() {
    const dados = {
        _versao: 'hallel-backup-v1', _backupAt: Date.now(),
        songs: S.songs, setlists: S.setlists, escalas: S.escalas, members: S.members,
        financeiro: S.financeiro, inventario: S.inventario, avisos: S.avisos,
        eventosCustom: S.eventosCustom, availability: S.availability,
        substitutions: S.substitutions, activityLog: S.activityLog,
        ensaios: S.ensaios, comentarios: S.comentarios, lixeira: S.lixeira,
    };
    const blob = new Blob([JSON.stringify(dados, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `hallel-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click(); URL.revokeObjectURL(url);
    toast('💾 Backup baixado!');
}

// ── listener em tempo real: atualiza todos os dispositivos na hora ─
function _escutaFirestore() {
    if (!_fbDB) return;
    _fbDB.collection('ministerio').doc('dados').onSnapshot(snap => {
        if (!snap.exists || !snap.data()) return;
        if (_localDirty) return;  // nossa escrita pendente — ignora
        const d = snap.data();
        const snapTs = d._updatedAt || 0;
        // Se é eco da nossa própria escrita: só confirma o sync, não sobrescreve
        if (snapTs <= _lastWriteTs) { _setSyncStatus(true); return; }
        // É mudança de OUTRO dispositivo — aplica
        if (S.modal) { _pendingSnap = d; return; } // aguarda modal fechar
        _aplicaDados(d);
        render();
        _setSyncStatus(true);
    }, err => console.warn('Firestore listen:', err));
}

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(v) { return (v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function ytId(url) {
    if (!url) return null;
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([^&\n?#]+)/);
    return m ? m[1] : null;
}
function spId(url) {
    if (!url) return null;
    const m = url.match(/spotify\.com\/(?:intl-[a-z]+\/)?track\/([a-zA-Z0-9]+)/);
    return m ? m[1] : null;
}
function dzId(url) {
    if (!url) return null;
    const m = url.match(/deezer\.com\/(?:[a-z]+\/)?track\/(\d+)/);
    return m ? m[1] : null;
}

// Chord transposition
const SH = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FL = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function tNote(n, d) {
    let i = SH.indexOf(n); if (i===-1) i=FL.indexOf(n); if (i===-1) return n;
    return SH[((i+d)%12+12)%12];
}
function tChord(c, d) {
    const m = c.match(/^([A-G][b#]?)(.*)$/);
    if (!m) return c;
    let suffix = m[2];
    // transpõe também a nota do baixo em acordes com barra (ex: D/F#)
    suffix = suffix.replace(/\/([A-G][b#]?)/, (_, bass) => '/' + tNote(bass, d));
    return tNote(m[1], d) + suffix;
}
function tText(txt, d) {
    if (!d) return txt;
    return txt.replace(/\[([A-G][b#]?[^\]]*)\]/g, (_,c)=>'['+tChord(c,d)+']');
}
function fmtChord(txt) {
    return txt.replace(/\[([A-G][b#]?[^\]]*)\]/g, (_,c)=>`<span class="ch">[${c}]</span>`);
}
function fmtLines(txt) { return txt.split('\n').map(fmtChord).join('\n'); }
function offsetLbl(n)  { return n===0?'Original':(n>0?'+':'')+n; }
function fmtSize(b)    { return b > 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.round(b/1024)+' KB'; }

function toast(msg) {
    document.querySelectorAll('.toast').forEach(el=>el.remove());
    const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(),2600);
}

let _renderPending = false;
function render() {
    if (_renderPending) return;
    _renderPending = true;
    requestAnimationFrame(() => {
        _renderPending = false;
        _doRender();

}

function submitAccessRequest() {
    const name  = document.getElementById('req-name')?.value?.trim();
    const instrs = EV_INSTR.map(({k})=>k).filter(k=>document.getElementById('req-ic-'+k)?.checked);
    const instr  = instrs[0] || '';   // principal = primeiro marcado
    const whats  = document.getElementById('req-whats')?.value?.trim();
    const email = document.getElementById('req-email')?.value?.trim().toLowerCase();
    const nasc  = document.getElementById('req-nasc')?.value || '';
    const camisa= document.getElementById('req-camisa')?.value || '';
    const msg   = document.getElementById('req-msg')?.value?.trim();
    if (!name)           { showReqErr('Informe seu nome completo.'); return; }
    if (!instrs.length)  { showReqErr('Selecione pelo menos um instrumento.'); return; }
    if (!whats)          { showReqErr('Informe seu WhatsApp.'); return; }
    // Check duplicate
    const dup = S.accessRequests.find(r => r.name.toLowerCase()===name.toLowerCase() && r.status==='pending');
    if (dup) { showReqErr('Já existe uma solicitação pendente com este nome.'); return; }
    const reqObj = { instrument:instr, instruments:instrs, whatsapp:whats, email, nascimento:nasc, camisa, msg, at:Date.now(), status:'pending', name };
    // Envia para a nuvem (aparece no app do coordenador). Se não houver nuvem, fica só local.
    if (!fbEnviarSolicitacao(reqObj)) {
        S.accessRequests.push({ id:'rq'+uid(), ...reqObj });
        persist();
    }
    document.getElementById('req-ok').classList.add('show');
    document.getElementById('req-btn').style.display = 'none';
    const err = document.getElementById('req-err'); if (err) err.style.display='none';

    // ── Envia a solicitação ao coordenador ──
    const instrLabel = instrs.length
        ? instrs.map(k => (EV_INSTR.find(x=>x.k===k)||{}).label||k).join(', ')
        : (EV_INSTR.find(x=>x.k===instr)||{}).label || instr || '—';
    const nascFmt = nasc ? nasc.split('-').reverse().join('/') : '—';
    const linhas = [
        '🎵 *Nova solicitação de acesso — Hallel*',
        '',
        `*Nome:* ${name}`,
        `*Instrumento:* ${instrLabel}`,
        `*WhatsApp:* ${whats}`,
        `*E-mail:* ${email || '—'}`,
        `*Nascimento:* ${nascFmt}`,
        `*Camisa:* ${camisa || '—'}`,
    ];
    if (msg) linhas.push(`*Mensagem:* ${msg}`);
    linhas.push('', '_Cadastre no app em Membros._');
    const texto = linhas.join('\n');

    // Abre o WhatsApp do coordenador com os dados preenchidos
    if (COORD_WHATS) {
        const waUrl = `https://wa.me/${COORD_WHATS}?text=${encodeURIComponent(texto)}`;
        window.open(waUrl, '_blank');
    }
}
function showReqErr(msg) {
    const el = document.getElementById('req-err');
    if (el) { el.textContent=msg; el.style.display='block'; }
}

function doRecovery() {
    const userInput  = document.getElementById('rec-user')?.value?.trim().toLowerCase();
    const identInput = document.getElementById('rec-email')?.value?.trim();
    if (!userInput)   { showRecErr('Digite seu nome de usuário.'); return; }
    if (!identInput)  { showRecErr('Digite seu email ou nome completo.'); return; }

    const member = S.members.find(m => m.user.toLowerCase() === userInput);
    if (!member) { showRecErr('Usuário não encontrado. Verifique ou contate o coordenador.'); return; }

    // Valida por email OU primeiro nome
    const emailOk     = member.email && member.email.toLowerCase() === identInput.toLowerCase();
    const primeiroNome = member.name.split(' ')[0].toLowerCase();
    const nomeOk      = primeiroNome === identInput.toLowerCase();

    if (!emailOk && !nomeOk) {
        showRecErr('Os dados não conferem. Use seu email ou seu primeiro nome.');
        return;
    }

    // Validação OK — tenta enviar por email primeiro, WhatsApp como backup
    const btn2 = document.getElementById('rec-btn');
    if (btn2) { btn2.disabled=true; btn2.textContent='Enviando…'; }

    const waMsg = encodeURIComponent(
        '🔑 *Recuperação de senha — Hallel*\n\n'
        + 'Olá, *' + member.name + '*! Sua senha atual é:\n'
        + '*' + member.pass + '*\n\n'
        + 'Acesse: https://musicahallel-lgtm.github.io/hallel-alegraivos/\n'
        + '_Recomendamos trocar a senha após entrar._'
    );
    const waUrl = 'https://wa.me/' + ('55'+member.whatsapp.replace(/\D/g,'')) + '?text=' + waMsg;

    function _mostrarSucesso(via) {
        const senhaMask = member.pass.slice(0,2) + '•'.repeat(Math.max(0, member.pass.length-2));
        const okDiv = document.getElementById('rec-ok');
        const okMsg = document.getElementById('rec-ok-msg');
        if (okDiv) okDiv.style.display='block';
        if (okMsg) okMsg.innerHTML = '✅ Identidade confirmada!<br><br>'
            + 'Sua senha: <b style="font-size:18px;letter-spacing:2px">' + senhaMask + '</b><br><br>'
            + '<small style="color:#666">A senha completa foi enviada ' + via + '.</small>';
        if (btn2) btn2.style.display='none';
    }

    // Tenta email via EmailJS
    if (window.emailjs) {
        emailjs.init(EMAILJS_CFG.publicKey);
        emailjs.send(EMAILJS_CFG.serviceId, EMAILJS_CFG.templateId, {
            to_email:    member.email,
            member_name: member.name,
            username:    member.user,
            password:    member.pass,
            app_url:     'https://musicahallel-lgtm.github.io/hallel-alegraivos/',
        }).then(() => {
            _mostrarSucesso('para o seu email <b>' + member.email.replace(/(.{2}).+(@.+)/, '$1***$2') + '</b>');
        }).catch(err => {
            console.warn('EmailJS falhou, usando WhatsApp:', err);
            window.open(waUrl, '_blank');
            _mostrarSucesso('via WhatsApp');
        });
    } else {
        // EmailJS não carregou, usa WhatsApp direto
        window.open(waUrl, '_blank');
        _mostrarSucesso('via WhatsApp');
    }
}

//  PRESENÇA EM TEMPO REAL
// ══════════════════════════════════════════════════════
let _presencaTimer = null;
let _presencaId    = null;
let _onlineCount   = 0;
let _onlineNomes   = [];   // nomes (lowercase) atualmente online — usado no registro 24h
let _onlineInfo    = [];   // [{nome, role, at}] de quem está online agora (para exibir)

function _presencaId_get() {
    // ID único por sessão (não por membro — mesmo sem login conta)
    if (!_presencaId) {
        _presencaId = localStorage.getItem('hl_pid') || ('p'+Date.now()+Math.random().toString(36).slice(2,7));
        localStorage.setItem('hl_pid', _presencaId);
    }
    return _presencaId;
}

function _atualizaPresenca() {
    if (!_fbDB || !S.role) return;
    const nome = S.currentMember?.name || (S.role==='adm'?'ADM':'Equipe');
    const pid = _presencaId_get();
    _fbDB.collection('presenca').doc(pid).set({
        nome, role: S.role, at: Date.now(), pid
    }).catch(()=>{});
}

function _removePresenca() {
    if (!_fbDB || !_presencaId) return;
    _fbDB.collection('presenca').doc(_presencaId).delete().catch(()=>{});
}

function _iniciaPresenca() {
    if (!_fbDB) return;
    // Atualiza presença a cada 60s (heartbeat)
    _atualizaPresenca();
    _presencaTimer = setInterval(_atualizaPresenca, 60000);
    // Remove presença e salva última atividade ao fechar/sair
    window.addEventListener('beforeunload', () => { stopActTimer(); _removePresenca(); });
    // Escuta quem está online (última atualização < 2 minutos)
    _fbDB.collection('presenca').onSnapshot(snap => {
        const agora = Date.now();
        const ativos = snap.docs.filter(d => (agora - (d.data().at||0)) < 120000);
        _onlineNomes = ativos.map(d => (d.data().nome||'').toLowerCase().trim()).filter(Boolean);
        _onlineInfo  = ativos.map(d => ({ nome: d.data().nome||'—', role: d.data().role||'', at: d.data().at||0 }));
        const novo = ativos.length;
        // Se o ADM está vendo a Atividade, atualiza a lista de "quem está online"
        if (S.page === 'atividade' && !S.modal && novo !== _onlineCount) {
            const box = document.getElementById('online-now-box');
            if (box) box.innerHTML = _onlineNowInner();
        }
        if (novo !== _onlineCount) {
            _onlineCount = novo;
            // Atualiza só os elementos do badge sem re-renderizar a página
            const el = document.getElementById('online-count');
            const badge = document.getElementById('online-badge');
            if (el) el.textContent = _onlineCount;
            if (badge) badge.style.display = _onlineCount > 0 ? 'flex' : 'none';
        }
    }, ()=>{});
}

function doLogin() {
    const user = document.getElementById('lg-user')?.value?.trim().toLowerCase();
    const pass = document.getElementById('lg-pass')?.value;
    // Check static credentials (ADM / Equipe)
    const cred = CREDS.find(c => c.user === user && c.pass === pass);
    if (cred) {
        S.role = cred.role;
        S.currentMember = null;
        localStorage.setItem('hl_role', cred.role);
        render();
        setTimeout(_atualizaPresenca, 500);
        setTimeout(() => {
            const pending = S.accessRequests.filter(r=>r.status==='pending'||r.status==='approving');
            if (pending.length) {
                toast(`📨 ${pending.length} solicitação${pending.length>1?'ões':''} de acesso pendente${pending.length>1?'s':''}! Veja em 👥 Membros.`);
                return;
            }
            const dismissed = JSON.parse(localStorage.getItem('hl_notif_dismissed')||'[]');
            const near = EVENTOS_2026.filter(ev => { const d=evDaysUntil(ev); return d>=0&&d<=15&&!dismissed.includes(ev.id); });
            if (near.length) {
                const ev = near[0]; const d = evDaysUntil(ev);
                toast(`🔔 ${ev.title} — ${d===0?'HOJE':d===1?'amanhã':'em '+d+' dias'}! Veja a Agenda.`);
            }
        }, 800);
        return;
    }
    // Check member credentials — exige usuário E senha preenchidos (impede login vazio)
    const member = (user && pass)
        ? S.members.find(m => m.user && m.pass && m.user.toLowerCase() === user && m.pass === pass)
        : null;
    if (member) {
        const accessRole = member.accessRole || 'membro';
        S.role = accessRole;
        S.currentMember = member;
        _saidaRegistrada = false; // nova sessão: habilita registrar a saída
        localStorage.setItem('hl_role', accessRole);
        localStorage.setItem('hl_current_member', member.id);
        // Quantos dias o membro ficou sem entrar (antes de registrar este login)
        const ultimoAcesso = (S.activityLog || [])
            .filter(a => a.memberId === member.id && a.at)
            .reduce((max, a) => Math.max(max, a.at), 0);
        const diasAusente = ultimoAcesso ? Math.floor((Date.now() - ultimoAcesso) / 86400000) : 0;
        // Track login
        S.activityLog.push({ id: uid(), memberId: member.id, memberName: member.name,
            type: 'login', at: Date.now(), duration: 0 });
        persist();
        render();
        // Primeiro acesso → pede WhatsApp e email antes do alert de missão
        setTimeout(() => {
            if (!member.firstAccessDone) {
                S.modal = { type: 'first-access', data: member };
                render();
            } else {
                // Check substitution notifications first, then mission alert
                const showPersonal = () => { if (!checkSubNotifications(member)) showMissionAlert(member); };
                const depoisAniv = () => { if (!maybeShowBirthday({ then: showPersonal })) showPersonal(); };
                // Alerta de inatividade (7+ dias) tem prioridade; depois aniversário e alertas pessoais
                if (!maybeShowInatividade(member, diasAusente, depoisAniv)) depoisAniv();
            }
        }, 300);
        return;
    }
    const err = document.getElementById('login-err');
    if (err) err.classList.add('show');
}

function doLogout() {
    _removePresenca();
    clearInterval(_presencaTimer);
    S.role = null;
    S.currentMember = null;
    localStorage.removeItem('hl_role');
    localStorage.removeItem('hl_current_member');
    S.modal = null;
    render();
}

function showMissionAlert(member) {
    const escalas = getMemberEscalas(member.name);
    const upcoming = escalas.filter(e => e.daysUntil >= 0);
    if (!upcoming.length) {
        toast(`Olá, ${member.name}! 👋 Nenhuma escala futura no momento.`);
        return;
    }
    S.modal = { type: 'mission-alert', data: { member, escalas: upcoming } };
    render();
}

// ── Aniversários ──────────────────────────────────────────────────────
function getTodayBirthdays() {
    const now = new Date();
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const dd = String(now.getDate()).padStart(2,'0');
    return S.members.filter(m => {
        if (!m.nascimento) return false;
        const parts = m.nascimento.split('-'); // YYYY-MM-DD
        return parts[1]===mm && parts[2]===dd;
    });
}

function maybeShowBirthday(opts={}) {
    const bdays = getTodayBirthdays();
    if (!bdays.length) return false;
    const now = new Date();
    const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    if (localStorage.getItem('hl_bday_seen') === today) return false; // já mostrou hoje
    localStorage.setItem('hl_bday_seen', today);
    S._birthdayThen = opts.then || null;
    S.modal = { type:'birthday-alert', data:{ members:bdays } };
    render();
    return true;
}

function closeBirthday() {
    S.modal = null;
    const then = S._birthdayThen; S._birthdayThen = null;
    render();
    if (then) setTimeout(then, 250);
}

function getMemberEscalas(memberName) {
    const results = [];
    const nameLower = memberName.toLowerCase().trim();
    Object.entries(S.escalas).forEach(([evId, esc]) => {
        const roles = EV_INSTR.filter(({k}) => {
            const val = (esc[k]||'').toLowerCase().trim();
            return val && (val === nameLower || val.includes(nameLower));
        });
        if (!roles.length) return;
        const ev = EVENTOS_2026.find(e=>e.id===evId) || REC_2026.find(e=>e.id===evId);
        if (!ev) return;
        results.push({ ev, roles, daysUntil: evDaysUntil(ev) });
    });
    return results.sort((a,b) => a.daysUntil - b.daysUntil);
}

function lembreteEscalaHtml() {
    if (!S.currentMember) return '';
    const escalas = getMemberEscalas(S.currentMember.name)
        .filter(e => e.daysUntil >= 0 && e.daysUntil <= 10)
        .sort((a,b) => a.daysUntil - b.daysUntil);
    if (!escalas.length) return '';
    const cards = escalas.map(({ev, roles, daysUntil}) => {
        const quando = daysUntil===0 ? '🔴 HOJE' : daysUntil===1 ? '🟡 AMANHÃ' : `em ${daysUntil} dias`;
        const cor = daysUntil===0 ? '#ef4444' : daysUntil<=2 ? '#f59e0b' : '#00963F';
        const esc = S.escalas[ev.id]||{};
        const local = (esc.local || ev.local || '').trim();
        return `<div style="background:rgba(0,150,63,.08);border:1px solid rgba(0,150,63,.25);border-left:4px solid ${cor};border-radius:12px;padding:12px 14px;margin-bottom:8px">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
                <div style="font-size:14px;font-weight:800">${ev.alegrai?'⭐ ':''}${escHtml(ev.title)}</div>
                <div style="font-size:12px;font-weight:800;color:${cor}">${quando}</div>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px">📅 ${evDateLabel(ev)}${ev.horario?' · ⏰ '+ev.horario:''}</div>
            <div style="font-size:12px;color:var(--purple-light);margin-top:2px">🎵 Sua função: ${roles.map(r=>r.label).join(', ')}</div>
            ${local?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${ic('pin',11)} ${escHtml(local)}</div>`:''}
        </div>`;
    }).join('');
    return `<div style="margin-bottom:18px">
        <div style="font-size:13px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;text-align:center">
            🎯 Você está escalado!
        </div>
        ${cards}
    </div>`;
}

function libPage() {

    const list = S.songs.filter(s => {

    return `

                   value="${esc(S.q)}" oninput="doSearch(this.value)">
        </div>
        <select onchange="doFilterKey(this.value)">
            <option value="">Todos os tons</option>

        <button class="btn btn-sm" style="background:${S.favOnly?'#f59e0b':'var(--bg4)'};color:${S.favOnly?'#fff':'var(--text)'};border:1px solid ${S.favOnly?'#f59e0b':'var(--border)'};font-weight:700;white-space:nowrap" onclick="toggleFavFilter()" title="Mostrar só favoritas">★ ${favCount}</button>
